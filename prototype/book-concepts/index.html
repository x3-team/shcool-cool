const PW=4.4,PD=5.8,CURV=.3;
const curve=u=>CURV*(1-Math.pow(1-u,6)); // u: 0 at spine, 1 at outer edge
function blockGeo(x0,x1,z0,z1,depth){ // page-stack piece following the page curve, in local coords where x = distance from spine
  const s=new THREE.Shape();s.moveTo(x0,-depth);
  const N=24;for(let i=0;i<=N;i++){const x=x0+(x1-x0)*i/N;s.lineTo(x,curve(x/PW)-.012)}

  const g=new THREE.ExtrudeGeometry(s,{depth:z1-z0,bevelEnabled:false,curveSegments:1});g.translate(0,0,z0);return g}
function pageGeo(){const g=new THREE.PlaneGeometry(PW,PD,48,1);g.rotateX(-PI/2);g.translate(PW/2,0,0);
  const p=g.attributes.position;for(let i=0;i<p.count;i++){p.setY(i,curve(p.getX(i)/PW))}g.computeVertexNormals();return g}
function pageTexture(c,side,hole){
  const W=1024,H=1350,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
  x.fillStyle=c.paper;x.fillRect(0,0,W,H);

  const gx=side==='L'?W:0, gr=x.createLinearGradient(gx,0,side==='L'?W-160:160,0);gr.addColorStop(0,'rgba(0,0,0,.13)');gr.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=gr;x.fillRect(0,0,W,H);

    x.font='600 92px Literata, Georgia, serif';x.fillText(c.page.title,L,290);

    x.strokeStyle=c.ink;x.globalAlpha=.25;x.lineWidth=2;x.strokeRect(L,690,W-2*L-60,150);x.globalAlpha=1;
    x.font='600 64px Literata, Georgia, serif';x.textAlign='center';x.fillText(c.page.fact,L+(W-2*L-60)/2,790);x.textAlign='left';
    x.globalAlpha=.55;x.font='600 32px Manrope, sans-serif';x.fillText('Нажми на модель справа →',L,960);x.globalAlpha=1;
    x.globalAlpha=.4;x.font='500 28px Manrope, sans-serif';x.fillText('24',L,H-90);x.globalAlpha=1;
  }else{

    x.font='500 28px Manrope, sans-serif';x.textAlign='right';x.fillText('25',W-110,H-90);x.textAlign='left';x.globalAlpha=1;
    if(hole){x.clearRect(hole[0]*W/PW,hole[2]*H/PD,(hole[1]-hole[0])*W/PW,(hole[3]-hole[2])*H/PD)}
  }
  if(c.dark&&side==='R'&&!hole){for(let i=0;i<220;i++){x.fillStyle=`rgba(220,230,255,${Math.random()*.5+.1})`;x.beginPath();x.arc(Math.random()*W,Math.random()*H*.85,Math.random()*2+.5,0,7);x.fill()}}
  const t=new THREE.CanvasTexture(cv);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;if(side==='L'){t.wrapS=THREE.RepeatWrapping;t.repeat.x=-1;t.offset.x=1}return t}

function buildBook(c){
  const B=new THREE.Group(),T=c.thick||.3;
  const edgeCol=new THREE.Color(c.paper).multiplyScalar(c.dark?1.4:.93);
  const edgeM=std(edgeCol,{roughness:.95});
  const coverM=std(c.cover,{roughness:.6});
  const cover=mesh(new THREE.BoxGeometry(2*PW+.5,.12,PD+.4),coverM);cover.position.y=-T-.06;B.add(cover);
  const spine=mesh(new THREE.CylinderGeometry(.22,.22,PD+.4,20,1,false,0,PI),coverM);spine.rotation.x=PI/2;spine.rotation.z=PI;spine.position.y=-T-.06;B.add(spine);
  ['L','R'].forEach(side=>{
    const S=new THREE.Group();if(side==='L')S.scale.x=-1;B.add(S);
    let hole=null;
    if(side==='R'&&c.thick){hole=[1.25,3.65,1.6,4.0]; // x0,x1 from spine, z from far edge
      const z=v=>v-PD/2, [x0,x1,zf,zn]=hole;
      [[0,x0,0,PD],[x1,PW,0,PD],[x0,x1,0,zf],[x0,x1,zn,PD]].forEach(r=>S.add(mesh(blockGeo(r[0],r[1],z(r[2]),z(r[3]),T),edgeM)));
    }else S.add(mesh(blockGeo(0,PW,-PD/2,PD/2,T),edgeM));
    const tex=pageTexture(c,side,hole);
    const pm=new THREE.MeshStandardMaterial({map:tex,roughness:.9,side:THREE.DoubleSide,alphaTest:hole?.5:0,transparent:false});
    const pg=mesh(pageGeo(),pm);S.add(pg);
    if(hole)B.userData.hole={x0:hole[0],x1:hole[1],z0:hole[2]-PD/2,z1:hole[3]-PD/2,T};
  });
  B.position.y=T+.12;
  return B;
}

    x.fillStyle='#CDBB9C';x.beginPath();x.moveTo(0,h);x.quadraticCurveTo(w*.3,h*.62,w*.6,h*.8);x.quadraticCurveTo(w*.85,h*.95,w,h*.7);x.lineTo(w,h);x.fill()})}));

/* info panel & strip */
const strip=$('strip');
C.forEach((c,i)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=`<span class="sw" style="background:${c.sw}"></span><span><b>${c.name}</b><small>${c.subj}</small></span>`;b.onclick=()=>show(i);strip.appendChild(b)});
function renderInfo(){
  const c=C[cur];
  $('info').innerHTML=`
    <div class="num">${String(cur+1).padStart(2,'0')} / ${String(C.length).padStart(2,'0')}</div>
    <h1>${c.name}</h1>
    <span class="subj">${c.subj}</span>
    <p>${c.idea}</p>
    <dl>
      <div><dt>Ощущение</dt><dd>${c.feel}</dd></div>
      <div><dt>Подходит для</dt><dd>${c.fits}</dd></div>
      <div><dt>Сложность сделать</dt><dd class="diff">${[1,2,3].map(n=>`<b class="${n<=c.diff?'on':''}"></b>`).join('')}<span>${['','низкая','средняя','высокая'][c.diff]}</span></dd></div>
    </dl>
    <div class="tapline"><i></i><span>${c.tap}</span></div>
    <div class="acts"><button class="btn" id="tapBtn">Попробовать</button><button class="ghost" id="regrow">Вырастить заново</button></div>`;
  $('tapBtn').onclick=()=>S.tap();$('regrow').onclick=regrow;
  strip.querySelectorAll('.chip').forEach((b,i)=>{b.setAttribute('aria-current',i===cur?'true':'false');if(i===cur)strip.scrollTo({left:b.offsetLeft-strip.clientWidth/2+b.offsetWidth/2,behavior:'smooth'})});
}
$('prev').onclick=()=>show(cur-1);$('next').onclick=()=>show(cur+1);
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')show(cur+1);if(e.key==='ArrowLeft')show(cur-1)});

/* pointer: drag rotates, tap triggers */
let down=null,moved=false;
host.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};moved=false;host.setPointerCapture(e.pointerId);host.style.cursor='grabbing'});
host.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;if(Math.abs(dx)+Math.abs(dy)>5){moved=true;$('hint').classList.add('gone')}
  if(moved){tyaw=clamp(tyaw+dx*.006,-.9,.9);tpitch=clamp(tpitch+dy*.004,-.35,.5);down={x:e.clientX,y:e.clientY}}});
host.addEventListener('pointerup',()=>{if(down&&!moved)S.tap();down=null;host.style.cursor=''});

/* camera framing */
let panelW=0;
function resize(){
  const w=host.clientWidth,h=host.clientHeight;if(!w||!h)return;R.setSize(w,h,false);cam.aspect=w/h;
  const wide=w>820;panelW=wide?$('info').offsetWidth+18:0;
  if(wide)cam.setViewOffset(w,h,-panelW*.38,0,w,h);else cam.clearViewOffset();
  cam.updateProjectionMatrix()}
new ResizeObserver(resize).observe(host);

function frame(now){
  const t=now/1000,el=t-t0;
  yaw+=(tyaw-yaw)*.08;pitch+=(tpitch-pitch)*.08;
  if(S){
    S.items.forEach(it=>apply(it,clamp((el-it.d)/(it.dur||.7))));
    S.tick(t,Math.min(.05,(now-(frame.last||now))/1000));
  }
  frame.last=now;
  const c=C[cur]||{},T=(c.thick||.3);
  const narrow=host.clientWidth<=820, aspect=host.clientWidth/host.clientHeight;
  const dist=(narrow?(aspect<.8?20:17):15)+(c.thick?1:0);
  const ang=.78+pitch, r=dist;
  const tx=narrow&&aspect<1.1?1.7:0;
  cam.position.set(tx+Math.sin(yaw)*r*Math.cos(ang),Math.sin(ang)*r+T,.3+Math.cos(yaw)*r*Math.cos(ang));
  cam.lookAt(tx,T+.6,0.3);
  R.render(scene,cam);requestAnimationFrame(frame);
}
const start=parseInt((location.hash.match(/c(\d)/)||[])[1]||'1',10)-1;
show(isNaN(start)?0:start);resize();requestAnimationFrame(frame);
})();
</script>
