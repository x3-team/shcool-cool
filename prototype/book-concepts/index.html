<title>Подачи урока School Cool</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* One lesson (Мощность), seven different ways to present it. A shared 3D lab is moved into each layout. Blue = you can press it. */
:root{
  --bg:#ECEEEA; --surface:#FFFFFF; --ink:#1F2326; --muted:#6A706C; --line:#D8DCD6; --act:#2F62E8; --act-soft:#E8EEFF;
  --good:#1F8A5B; --good-soft:#E2F3EA; --a:#E39B37; --b:#6F93C4;
  --serif:"Literata",Georgia,serif; --sans:"Manrope","Segoe UI",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#191C1B;--surface:#242827;--ink:#ECEFEC;--muted:#A3AAA5;--line:#383F3B;--act:#7D9EFF;--act-soft:#27304A;--good:#5CC48F;--good-soft:#1E3A2B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#191C1B;--surface:#242827;--ink:#ECEFEC;--muted:#A3AAA5;--line:#383F3B;--act:#7D9EFF;--act-soft:#27304A;--good:#5CC48F;--good-soft:#1E3A2B;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;display:flex;flex-direction:column;overflow:hidden;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:0 14px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--act);outline-offset:2px;border-radius:10px}
.top{display:flex;align-items:center;gap:14px;padding-block:10px;flex:none;min-width:0}
.logo{font-weight:800;font-size:16px;white-space:nowrap}.logo span{color:var(--act)}
.tabs{display:flex;gap:4px;overflow-x:auto;min-width:0;scrollbar-width:none}
.tab{white-space:nowrap;padding:7px 12px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted)}
.tab b{font-family:var(--mono);font-weight:500;margin-right:6px;opacity:.6}
.tab[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line)}
#app{flex:1;min-height:0;position:relative;display:flex}
.btn{background:var(--act);color:#fff;font-weight:700;border-radius:11px;padding:10px 16px;white-space:nowrap}
.btn[disabled]{opacity:.4;cursor:default}
.ghost{color:var(--act);font-weight:700;padding:10px 8px;white-space:nowrap}
.slot{position:relative;overflow:hidden;min-height:0;min-width:0}
.slot canvas{display:block;width:100%;height:100%;position:absolute;inset:0;touch-action:none}
.labtag{position:absolute;transform:translate(-50%,-100%);pointer-events:none;background:var(--surface);color:var(--ink);border-radius:10px;padding:4px 9px 5px;box-shadow:0 2px 10px rgba(0,0,0,.12);text-align:center;font-size:12px;font-weight:700;line-height:1.25;white-space:nowrap}
.labtag i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:5px}
.labtag .t{display:block;font-family:var(--mono);font-size:15px}
.labtag.fin{box-shadow:0 0 0 2px var(--c)}
.labhint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;background:var(--surface);color:var(--muted);border-radius:99px;padding:5px 12px;font-size:12px;font-weight:700;pointer-events:none;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 14px;font-weight:700;font-size:14px;pointer-events:none;transition:opacity .4s;white-space:nowrap}
.toast.hide{opacity:0}
.stepper{display:inline-flex;align-items:center;gap:2px;background:var(--bg);border-radius:10px;padding:2px}
.stepper button{width:30px;height:30px;border-radius:8px;font-weight:800;color:var(--act)}
.stepper span{min-width:52px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:0}

/* 1 book */
.c-book{flex:1;display:flex;flex-direction:column;border-radius:20px;overflow:hidden}
.c-book .slot{flex:1}
.pill{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:16px;padding:6px;box-shadow:0 8px 30px -10px rgba(0,0,0,.3);max-width:calc(100% - 24px)}
.pill .nav{width:38px;height:38px;border-radius:11px;font-size:18px;font-weight:800}
.pill .nav:hover{background:var(--bg)}
.pill .lbl{padding:0 8px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pill .lbl small{color:var(--muted);font-weight:600;margin-right:6px;font-family:var(--mono)}

/* 2 lab */
.c-lab{flex:1;display:grid;grid-template-columns:240px minmax(0,1fr) 280px;grid-template-rows:minmax(0,1fr) auto;gap:10px}
.c-lab .slot{grid-column:2;grid-row:1;border-radius:18px}
.panel{background:var(--surface);border-radius:18px;padding:16px;overflow:auto;min-width:0}
.panel h3{margin:0 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.task{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-weight:600}
.task .ck{flex:none;width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;color:#fff;margin-top:1px}
.task.done .ck{background:var(--good);border-color:var(--good)}.task.done span{color:var(--muted);text-decoration:line-through}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{text-align:left;color:var(--muted);font-weight:700;padding:4px 4px 6px;border-bottom:1px solid var(--line)}
td{padding:6px 4px;border-bottom:1px solid var(--line)}
td:last-child,th:last-child{text-align:right}
.tools{grid-column:1/-1;grid-row:2;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;background:var(--surface);border-radius:16px;padding:10px 14px}
.tools .sp{margin-left:auto;display:flex;gap:6px}
.empty{color:var(--muted);font-size:13px;padding:8px 0}

/* 3 tutor */
.c-chat{flex:1;display:grid;grid-template-columns:minmax(300px,400px) minmax(0,1fr);gap:10px}
.chat{background:var(--surface);border-radius:18px;display:flex;flex-direction:column;min-height:0}
.chat .head{display:flex;gap:10px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.ava{width:34px;height:34px;border-radius:50%;background:var(--act-soft);display:grid;place-items:center;font-weight:800;color:var(--act)}
.chat .log{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:85%;padding:9px 12px;border-radius:14px 14px 14px 4px;background:var(--bg)}
.msg.me{align-self:flex-end;background:var(--act);color:#fff;border-radius:14px 14px 4px 14px}
.msg.sys{align-self:center;background:none;color:var(--muted);font-size:13px;font-weight:600}
.typing{color:var(--muted);font-size:13px}
.quick{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px 14px;border-top:1px solid var(--line)}
.quick button{background:var(--act-soft);color:var(--act);font-weight:700;border-radius:99px;padding:7px 13px}
.c-chat .slot{border-radius:18px}

/* 4 scroll story */
.c-story{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:10px;min-height:0}
.story{overflow:auto;background:var(--surface);border-radius:18px;padding:0 34px;scroll-behavior:smooth}
.story section{min-height:78%;padding:44px 0;display:flex;flex-direction:column;justify-content:center;gap:12px;max-width:52ch;opacity:.35;transition:opacity .4s}
.story section.on{opacity:1}
.story .k{font-family:var(--mono);font-size:12px;color:var(--muted)}
.story h2{font-family:var(--serif);font-weight:600;font-size:32px;line-height:1.1;margin:0;text-wrap:balance}
.story p{margin:0;font-size:17px}
.live{font-family:var(--mono);font-weight:700;color:var(--act)}
.story .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.story .end{min-height:30%}
.c-story .slot{border-radius:18px}

/* 5 mission */
.c-mission{flex:1;position:relative;border-radius:20px;overflow:hidden;background:#11151C}
.c-mission .slot{position:absolute;inset:0}
.hud{position:absolute;color:#EAF0FF}
.mcard{left:16px;top:16px;width:300px;max-width:calc(100% - 32px);background:rgba(18,24,36,.86);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:16px;backdrop-filter:blur(6px)}
.mcard .lv{font-family:var(--mono);font-size:12px;color:#8FA6D9;letter-spacing:.06em}
.mcard h2{margin:4px 0 6px;font-size:20px;line-height:1.2}
.mcard p{margin:0;color:#B9C5E0;font-size:14px}
.stars{right:16px;top:16px;display:flex;gap:4px;font-size:24px;letter-spacing:2px}
.stars span{color:#3A4560}.stars span.on{color:#FFC94D}
.motors{left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:8px;align-items:stretch;max-width:calc(100% - 24px);overflow-x:auto}
.mchip{background:rgba(18,24,36,.9);border:2px solid rgba(255,255,255,.12);color:#EAF0FF;border-radius:14px;padding:10px 14px;text-align:left;min-width:96px}
.mchip b{display:block;font-family:var(--mono);font-size:18px}.mchip small{color:#8FA6D9;font-weight:700}
.mchip[aria-pressed="true"]{border-color:#FFC94D}
.mgo{background:#FFC94D;color:#2A1F00;font-weight:800;border-radius:14px;padding:0 20px}
.result{left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(18,24,36,.94);border-radius:18px;padding:22px 26px;text-align:center;border:1px solid rgba(255,255,255,.12);min-width:260px}
.result h3{margin:0 0 4px;font-size:22px}.result p{margin:0 0 14px;color:#B9C5E0}

/* 6 cards */
.c-cards{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:0;perspective:1400px}
.deck{position:relative;width:min(520px,100%);flex:1;max-height:640px;min-height:0}
.cardx{position:absolute;inset:0;background:var(--surface);border-radius:24px;box-shadow:0 18px 50px -24px rgba(0,0,0,.4);display:flex;flex-direction:column;overflow:hidden;transition:transform .45s cubic-bezier(.3,1.2,.5,1),opacity .3s}
.cardx.behind{transform:translateY(14px) scale(.95);opacity:.6}
.cardx.behind2{transform:translateY(26px) scale(.9);opacity:.3}
.cardx .slot{height:52%;flex:none;background:var(--bg)}
.cardx .txt{padding:20px 24px;display:flex;flex-direction:column;gap:10px;flex:1;overflow:auto;touch-action:pan-y}
.cardx h2{font-family:var(--serif);font-weight:600;font-size:26px;margin:0;line-height:1.15}
.cardx p{margin:0}
.cardx .opts{display:flex;gap:8px;flex-wrap:wrap}
.cardx .opt{background:var(--act-soft);color:var(--act);font-weight:700;border-radius:12px;padding:9px 14px}
.cnav{display:flex;align-items:center;gap:12px}
.cdots{display:flex;gap:6px}.cdots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.cdots i.on{background:var(--ink)}
.flipback{background:var(--good-soft);color:var(--good);border-radius:12px;padding:10px 12px;font-weight:700}

/* 7 live formula */
.c-formula{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0}
.fbar{background:var(--surface);border-radius:18px;padding:18px 22px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 26px}
.eq{font-family:var(--serif);font-size:clamp(28px,4.4vw,52px);display:flex;align-items:baseline;gap:.25em;flex-wrap:wrap}
.scrub{font-family:var(--mono);font-size:.8em;color:var(--act);border-bottom:2px dashed var(--act);cursor:ew-resize;touch-action:none;user-select:none;padding:0 .1em}
.scrub:hover{background:var(--act-soft)}
.res{font-family:var(--mono);font-size:.8em;font-weight:700}
.fnote{color:var(--muted);font-size:14px;max-width:40ch}
.fnote b{color:var(--ink)}
.c-formula .slot{flex:1;border-radius:18px}
.c-formula .acts{display:flex;gap:8px;margin-left:auto}

.c-ex{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:10px;min-height:0}
.c-ex .slot{border-radius:18px;background:repeating-linear-gradient(0deg,transparent 0 31px,rgba(120,130,125,.12) 31px 32px),repeating-linear-gradient(90deg,transparent 0 31px,rgba(120,130,125,.12) 31px 32px)}
.bignum{position:absolute;left:22px;top:18px;pointer-events:none}
.bignum small{display:block;font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.08em}
.bignum b{font-family:var(--mono);font-weight:500;font-size:72px;line-height:1}
.exp{background:var(--surface);border-radius:18px;display:flex;flex-direction:column;min-height:0}
.exp .in{padding:20px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:12px}
.exp h2{margin:0;font-size:24px;line-height:1.15}
.exp .k{font-family:var(--mono);font-size:12px;color:var(--muted)}
.parts{display:grid;gap:6px}
.parts button{display:flex;justify-content:space-between;align-items:center;text-align:left;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-weight:700}
.parts button[aria-pressed="true"]{border-color:var(--act);background:var(--act-soft);color:var(--act)}
.parts button small{color:var(--muted);font-weight:600}
.exp .foot{border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:8px;align-items:center}
.exp .foot .sp{margin-left:auto}
.range label{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--muted)}
.range input{width:100%;accent-color:var(--act)}
.pw{font-family:var(--mono);font-weight:700}
@media (max-width:900px){
  .c-ex{display:flex;flex-direction:column}.c-ex .slot{height:52vh;min-height:300px;flex:none}
  body{overflow:auto;height:auto}
  #app{flex:none;display:block}
  .c-lab,.c-chat,.c-story{display:flex;flex-direction:column}
  .c-lab .slot,.c-chat .slot,.c-book .slot,.c-formula .slot{height:52vh;min-height:300px;flex:none}
  .c-story .slot{position:sticky;top:0;height:42vh;min-height:260px;z-index:2;order:-1}
  .story{overflow:visible;padding:0 18px}.story section{min-height:60vh}
  .c-book,.c-mission{height:72vh;min-height:460px}
  .c-cards{height:auto}.deck{height:600px;flex:none}
  .chat{max-height:none}.chat .log{max-height:340px}
  .c-chat .slot{order:-1}
  .c-lab .slot{order:-1}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="top">
  <div class="logo">school <span>cool</span></div>
  <nav class="tabs" id="tabs" aria-label="Концепции"></nav>
</header>
<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $=(s,r=document)=>r.querySelector(s), PI=Math.PI, clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const nf=(n,d=1)=>n.toLocaleString('ru-RU',{minimumFractionDigits:d,maximumFractionDigits:d});
const W=n=>(Math.abs(n-Math.round(n))<.05?Math.round(n).toLocaleString('ru-RU'):nf(n,1))+' Вт';
const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e};
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();

/* =================== shared 3D lab =================== */
const Lab=(()=>{
  const R=new THREE.WebGLRenderer({antialias:true,alpha:true});R.setPixelRatio(Math.min(2,devicePixelRatio));
  R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;R.outputEncoding=THREE.sRGBEncoding;
  const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(32,1,.1,200);
  const hemi=new THREE.HemisphereLight(0xffffff,0xbfc4bc,.8);scene.add(hemi);
  const sun=new THREE.DirectionalLight(0xffffff,.65);sun.position.set(-5,12,7);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
  Object.assign(sun.shadow.camera,{left:-8,right:8,top:8,bottom:-8,near:1,far:40});sun.shadow.bias=-.0004;scene.add(sun);
  const shadowFloor=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.ShadowMaterial({opacity:.13}));shadowFloor.rotation.x=-PI/2;shadowFloor.receiveShadow=true;scene.add(shadowFloor);
  const stageG=new THREE.Group();scene.add(stageG);
  const labG=new THREE.Group();scene.add(labG);
  const INK=0x2a2e33;
  const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.7},o));
  const mesh=(g,m,sh=true)=>{const x=new THREE.Mesh(g,m);x.castShadow=sh;x.receiveShadow=true;return x};
  const lineM=new THREE.LineBasicMaterial({color:INK,transparent:true,opacity:.55});
  const edged=(g,m)=>{const x=mesh(g,m);x.add(new THREE.LineSegments(new THREE.EdgesGeometry(g,30),lineM));return x};
  const Y0=.32,LIFT=1.9,TOP=2.62;
  function sprite(text,size,w,h,color){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle=color||'#2a2e33';x.font=`600 ${size}px Literata, Georgia, serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(text,w/2,h/2);
    const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return new THREE.Mesh(new THREE.PlaneGeometry(w/200,h/200),new THREE.MeshBasicMaterial({map:t,transparent:true}))}
  function rig(key,accent){
    const g=new THREE.Group();labG.add(g);const white=M(0xf8f8f5);
    [-.62,.62].forEach(x=>{const p=edged(new THREE.BoxGeometry(.1,TOP+.1,.1),white);p.position.set(x,(TOP+.1)/2,0);g.add(p)});
    const beam=edged(new THREE.BoxGeometry(1.5,.12,.32),white);beam.position.y=TOP+.1;g.add(beam);
    const motor=new THREE.Group();motor.position.y=TOP+.48;g.add(motor);
    const can=edged(new THREE.CylinderGeometry(.3,.3,.62,32),white);can.rotation.z=PI/2;motor.add(can);
    const band=mesh(new THREE.CylinderGeometry(.305,.305,.12,32),M(accent));band.rotation.z=PI/2;band.position.x=-.2;motor.add(band);
    const dial=new THREE.Group();dial.position.set(.12,0,.3);motor.add(dial);
    const disc=mesh(new THREE.CylinderGeometry(.19,.19,.06,32),M(accent,{roughness:.4}));disc.rotation.x=PI/2;dial.add(disc);
    const notch=mesh(new THREE.BoxGeometry(.035,.15,.03),M(INK));notch.position.set(0,.07,.04);dial.add(notch);
    const eyeM=new THREE.MeshBasicMaterial({color:INK});[-.21,-.09].forEach(x=>{const e=mesh(new THREE.SphereGeometry(.03,10,8),eyeM,false);e.position.set(x,.08,.29);motor.add(e)});
    const letter=sprite(key==='A'?'А':'Б',90,120,120);letter.position.set(-.15,.55,0);letter.scale.setScalar(.8);motor.add(letter);
    const spool=mesh(new THREE.CylinderGeometry(.12,.12,.36,16),white);spool.rotation.z=PI/2;spool.position.y=TOP-.05;g.add(spool);
    const rope=mesh(new THREE.CylinderGeometry(.012,.012,1,6),M(INK),false);g.add(rope);
    const crate=new THREE.Group();g.add(crate);
    const box=edged(new THREE.BoxGeometry(.56,.56,.56),M(0xEFE7D6));crate.add(box);
    const hook=mesh(new THREE.TorusGeometry(.06,.016,6,12),M(INK));hook.position.y=.33;crate.add(hook);
    const r={key,g,motor,dial,spool,rope,crate,box,lab:null,mass:5,power:key==='A'?50:25,p:0,state:'idle',t0:0,dur:0,visible:true,tag:null,res:null};
    setLabel(r);return r}
  function setLabel(r){if(r.lab){r.crate.remove(r.lab)}r.lab=sprite(r.mass+' кг',60,220,90);r.lab.scale.setScalar(.75);r.lab.position.z=.285;r.crate.add(r.lab)}
  const rigs={A:rig('A',0xE39B37),B:rig('B',0x6F93C4)};
  const ruler=new THREE.Group();labG.add(ruler);
  {const r=edged(new THREE.BoxGeometry(.14,LIFT+.1,.05),M(0xffffff));r.position.y=Y0+LIFT/2+.27;ruler.add(r);
   for(let i=0;i<=10;i++){const t=mesh(new THREE.BoxGeometry(i%5?.07:.13,.012,.012),M(INK),false);t.position.set(-.07+(i%5?.035:.065),Y0+.28+i*LIFT/10,.03);ruler.add(t)}
   const s=sprite('1 м',56,140,70);s.position.set(.32,Y0+LIFT+.3,0);s.scale.setScalar(.8);ruler.add(s)}
  ruler.position.z=-.4;

  Lab.on('finish',d=>{const A=Lab.rigs.A,B=Lab.rigs.B;if(A.state==='done'&&B.state==='done'){toast(root,A.res.t<B.res.t?'Первым был мотор А: он мощнее':B.res.t<A.res.t?'Первым был мотор Б: он мощнее':'Ничья: мощность одинаковая')}});
  draw(false);
}},
/* 2 ---------- LAB BENCH ---------- */
{name:'Лаборатория',build(){
  const root=el('div','c-lab');app.appendChild(root);
  const left=el('div','panel',`<h3>Задания</h3><div id="tasks"></div><p class="empty" style="margin-top:8px">Задания отмечаются сами, когда ты их делаешь.</p>`);
  const slot=el('div','slot');
  const right=el('div','panel',`<h3>Журнал измерений</h3><table><thead><tr><th>Кто</th><th>m</th><th>t</th><th>N</th></tr></thead><tbody id="log"></tbody></table><p class="empty" id="logEmpty">Пока пусто. Подними ящик или запусти моторы.</p>`);
  const tools=el('div','tools');
  root.append(left,slot,right,tools);
  Lab.setStage('bench');defaults();Lab.mount(slot);
  const tasks=[{id:'hand',t:'Подними ящик рукой'},{id:'run',t:'Запусти оба мотора'},{id:'heavy',t:'Поставь на А груз 10 кг и запусти'},{id:'beat',t:'Сделай мотор Б быстрее А'}],done={};
  const drawTasks=()=>$('#tasks',root).innerHTML=tasks.map(x=>`<div class="task ${done[x.id]?'done':''}"><span class="ck">${done[x.id]?'✓':''}</span><span>${x.t}</span></div>`).join('');
  const mark=id=>{if(!done[id]){done[id]=1;drawTasks();toast(slot,'Задание выполнено ✓')}};
  const addRow=(who,m,t,P)=>{$('#logEmpty',root).hidden=true;const tr=el('tr',null,`<td><span class="dot" style="--c:${who.c}"></span>${who.n}</td><td>${m} кг</td><td>${nf(t)} с</td><td>${W(P)}</td>`);$('#log',root).prepend(tr)};
  const drawTools=()=>{const A=Lab.rigs.A,B=Lab.rigs.B;tools.innerHTML=`
    <span><span class="dot" style="--c:var(--a)"></span><b>А</b> груз <span class="stepper"><button data-k="A" data-d="-1">−</button><span>${A.mass} кг</span><button data-k="A" data-d="1">+</button></span></span>
    <span><span class="dot" style="--c:var(--b)"></span><b>Б</b> груз <span class="stepper"><button data-k="B" data-d="-1">−</button><span>${B.mass} кг</span><button data-k="B" data-d="1">+</button></span></span>
    <span class="sp"><button class="ghost" id="rs">Сбросить</button><button class="btn" id="go">▶ Запустить моторы</button></span>`;
    tools.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{Lab.setMass(b.dataset.k,Lab.rigs[b.dataset.k].mass+ +b.dataset.d);drawTools()});
    $('#go',tools).onclick=()=>{Lab.reset();Lab.run()};$('#rs',tools).onclick=()=>Lab.reset()};
  Lab.on('hand',d=>{addRow({n:'Рука',c:'var(--ink)'},d.m,d.t,d.P);mark('hand')});
  let fin={};
  Lab.on('start',()=>fin={});
  Lab.on('finish',d=>{fin[d.key]=d;addRow({n:'Мотор '+(d.key==='A'?'А':'Б'),c:d.key==='A'?'var(--a)':'var(--b)'},d.m,d.t,d.P);
    if(fin.A&&fin.B){mark('run');if(fin.B.t<fin.A.t)mark('beat')}if(d.key==='A'&&d.m>=10)mark('heavy')});
  drawTasks();drawTools();
}},
/* 3 ---------- TUTOR CHAT ---------- */
{name:'Наставник',build(){
  const root=el('div','c-chat');app.appendChild(root);
  const chat=el('div','chat',`<div class="head"><div class="ava">В</div><div><b>Вера</b><div class="typing">наставник по физике</div></div></div><div class="log" id="log"></div><div class="quick" id="q"></div>`);
  const slot=el('div','slot');root.append(chat,slot);
  Lab.setStage('none');defaults();Lab.mount(slot);
  const log=$('#log',chat),q=$('#q',chat);let wait=null,timers=[];
  const say=(t,cls='')=>{const m=el('div','msg '+cls,t);log.appendChild(m);log.scrollTop=log.scrollHeight};
  const tutor=(lines,quick,after)=>{q.innerHTML='';let d=0;lines.forEach(l=>{d+=500+l.length*12;timers.push(setTimeout(()=>say(l),d))});timers.push(setTimeout(()=>{setQuick(quick);after&&after()},d+200))};
  const setQuick=list=>{q.innerHTML='';(list||[]).forEach(([l,f])=>{const b=el('button',null,l);b.onclick=()=>{say(l,'me');q.innerHTML='';f()};q.appendChild(b)})};
  const s1=()=>tutor(['Привет! Я Вера. Сегодня разберёмся, что такое мощность.','Справа два моторчика с ящиками. Всё там можно трогать.'],[['Поехали!',s2]]);
  const s2=()=>{wait='hand';tutor(['Сначала сам. Схвати ящик А мышкой и потяни вверх до самого конца.'],[['Покажи, как',()=>{Lab.demoHand('A');tutor(['Вот так. Теперь ты!'],[])}]])};
  const s3=d=>{wait=null;tutor([`Отлично! Ты поднял ${d.m} кг на 1 метр за ${nf(d.t)} с.`,`Значит, твоя мощность примерно ${W(d.P)}.`,'Теперь моторы: у А 50 Вт, у Б 25 Вт. Кто поднимет быстрее?'],[['Мотор А',()=>s4('A')],['Мотор Б',()=>s4('B')],['Одинаково',()=>s4('=')]])};
  const s4=g=>{wait='race';Lab.reset();Lab.run();say('Запускаю моторы…','sys');racePick=g};
  let racePick=null,fin={};
  const s5=()=>{wait=null;const ok=racePick==='A';tutor([ok?'Верно, первым был А.':'Смотри: первым был мотор А.','Работа у обоих одна: 5 кг · 10 · 1 м = 50 Дж. Но А сделал её за 1 с, а Б за 2 с.','Поэтому мощность N = A / t. Кто быстрее делает ту же работу, тот мощнее.','Хочешь сам? Потяни диск на моторе Б вверх, чтобы прибавить ему мощность.'],[['Запустить ещё',()=>{Lab.reset();Lab.run();wait='free'}],['Начать сначала',()=>{log.innerHTML='';defaults();s1()}]])};
  Lab.on('hand',d=>{if(wait==='hand')s3(d);else say(`Ты поднял ${d.m} кг за ${nf(d.t)} с: ${W(d.P)}`,'sys')});
  Lab.on('start',()=>fin={});
  Lab.on('finish',d=>{fin[d.key]=d;if(fin.A&&fin.B){if(wait==='race')s5();else if(wait==='free')tutor([fin.B.t<fin.A.t?`Ура, Б обогнал А! ${W(fin.B.P)} против ${W(fin.A.P)}.`:`Пока А быстрее. У Б ${W(fin.B.P)}, прибавь ещё.`],[['Запустить ещё',()=>{Lab.reset();Lab.run()}]])}});
  Lab.on('dial',d=>{if(d.key==='B')wait='free'});
  s1();
  return()=>timers.forEach(clearTimeout);
}},
/* 4 ---------- SCROLL STORY ---------- */
{name:'История',build(){
  const root=el('div','c-story');app.appendChild(root);
  const story=el('div','story');const slot=el('div','slot');root.append(story,slot);
  Lab.setStage('none');defaults();Lab.mount(slot);
  story.innerHTML=`
   <section data-s="0"><span class="k">01</span><h2>Почему один мотор «сильнее» другого?</h2><p>Листай вниз. Справа живая модель: её меняет текст, а ещё её можно трогать руками.</p></section>
   <section data-s="1"><span class="k">02</span><h2>Сначала подними сам</h2><p>Схвати ящик А и потяни вверх. Так ты совершаешь работу.</p><p>Твой результат: <span class="live" id="hres">ещё нет</span></p><div class="row"><button class="ghost" id="demo">Показать, как</button></div></section>
   <section data-s="2"><span class="k">03</span><h2>Работа зависит от груза</h2><p>Работа A = m · g · h. Сейчас ящик <span class="live" id="mv"></span>, значит работа <span class="live" id="av"></span>.</p><div class="row"><button class="btn" id="plus">+1 кг обоим</button><button class="ghost" id="minus">−1 кг</button></div></section>
   <section data-s="3"><span class="k">04</span><h2>А мощность зависит от времени</h2><p>Моторы делают одну и ту же работу. Тот, кто справится быстрее, мощнее.</p><div class="row"><button class="btn" id="race">▶ Запустить моторы</button></div><p id="rres" class="live"></p></section>
   <section data-s="4"><span class="k">05</span><h2>Твоя очередь</h2><p>Потяни диск на моторе Б вверх или вниз. Попробуй сделать Б ровно таким же быстрым, как А.</p><p>Мотор Б: <span class="live" id="pb"></span></p><div class="row"><button class="btn" id="race2">▶ Проверить</button></div></section>
   <div class="end"></div>`;
  const upd=()=>{const m=Lab.rigs.A.mass;$('#mv',story).textContent=m+' кг';$('#av',story).textContent=m*10+' Дж';$('#pb',story).textContent=W(Lab.rigs.B.power)};upd();
  $('#demo',story).onclick=()=>Lab.demoHand('A');
  $('#plus',story).onclick=()=>{Lab.setMass('A',Lab.rigs.A.mass+1);Lab.setMass('B',Lab.rigs.B.mass+1);upd()};
  $('#minus',story).onclick=()=>{Lab.setMass('A',Lab.rigs.A.mass-1);Lab.setMass('B',Lab.rigs.B.mass-1);upd()};
  $('#race',story).onclick=()=>{Lab.reset();Lab.run()};$('#race2',story).onclick=()=>{Lab.reset();Lab.run()};
  let fin={};Lab.on('start',()=>fin={});
  Lab.on('finish',d=>{fin[d.key]=d;if(fin.A&&fin.B)$('#rres',story).textContent=`А: ${nf(fin.A.t)} с, ${W(fin.A.P)} · Б: ${nf(fin.B.t)} с, ${W(fin.B.P)}`});
  Lab.on('hand',d=>{$('#hres',story).textContent=`${nf(d.t)} с, это ${W(d.P)}`});
  Lab.on('change',upd);
  const secs=[...story.querySelectorAll('section')];
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){secs.forEach(s=>s.classList.toggle('on',s===e.target))}}),{root:window.innerWidth>900?story:null,threshold:.55});
  secs.forEach(s=>io.observe(s));secs[0].classList.add('on');
  return()=>io.disconnect();
}},

{name:'Миссия',build(){
  const root=el('div','c-mission');app.appendChild(root);const slot=el('div','slot');root.appendChild(slot);
  Lab.setStage('dark');defaults();Lab.setVisible('B',false);Lab.mount(slot,{hint:'Крути диск, тяни ящик, вращай сцену'});
  const card=el('div','hud mcard'),stars=el('div','hud stars'),bar=el('div','hud motors');root.append(card,stars,bar);
  const L=[
    {t:'Подними 5 кг быстрее, чем за 3 секунды',m:5,goal:3,opts:[10,15,20],tip:'Нужна мощность больше 50 Дж / 3 с ≈ 17 Вт.'},
    {t:'Подними 10 кг за 2 секунды',m:10,goal:2,opts:[25,40,60],tip:'Работа 100 Дж. Сколько ватт нужно за 2 с?'},
    {t:'Обгони мотор 25 Вт рукой',m:5,goal:2,hand:true,tip:'Мотор поднимет 5 кг за 2 с. Тяни ящик быстрее!'},
  ];
  let lv=0,got=[0,0,0],sel=null;
  const draw=()=>{const l=L[lv];Lab.reset();Lab.setMass('A',l.m);
    card.innerHTML=`<div class="lv">МИССИЯ ${lv+1} / ${L.length}</div><h2>${l.t}</h2><p>${l.tip}</p>`;
    stars.innerHTML=got.map(g=>`<span class="${g?'on':''}">★</span>`).join('');
    if(l.hand){bar.innerHTML=`<div class="mchip"><small>Задача</small><b>тяни ящик ↑</b></div>`;Lab.setPower('A',25)}
    else{bar.innerHTML=l.opts.map(p=>`<button class="mchip" data-p="${p}" aria-pressed="${sel===p}"><small>мотор</small><b>${p} Вт</b></button>`).join('')+`<button class="mgo" id="go">Запустить</button>`;
      bar.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{sel=+b.dataset.p;Lab.setPower('A',sel);draw()});$('#go',bar).onclick=()=>{Lab.reset();Lab.run(['A'])}}};
  const result=(ok,text)=>{const r=el('div','hud result',`<h3>${ok?'Миссия выполнена!':'Пока не вышло'}</h3><p>${text}</p><button class="btn" id="nx">${ok&&lv<L.length-1?'Следующая миссия':'Ещё раз'}</button>`);root.appendChild(r);
    $('#nx',r).onclick=()=>{r.remove();if(ok&&lv<L.length-1){lv++;sel=null}draw()}};
  Lab.on('finish',d=>{const l=L[lv];if(l.hand)return;const ok=d.t<=l.goal+1e-6;if(ok)got[lv]=1;result(ok,`${W(d.P)}: ящик поднят за ${nf(d.t)} с. Цель: ${l.goal} с.`)});
  Lab.on('hand',d=>{const l=L[lv];if(!l.hand)return;const ok=d.t<l.goal;if(ok)got[lv]=1;result(ok,`Ты поднял за ${nf(d.t)} с, это ${W(d.P)}. Мотору нужно 2 с.`)});
  Lab.on('dial',d=>{sel=d.power;if(!L[lv].hand)bar.querySelectorAll('[data-p]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.p===sel))});
  draw();
  return()=>Lab.setVisible('B',true);
}},
/* 6 ---------- CARDS ---------- */
{name:'Карточки',build(){
  const root=el('div','c-cards');app.appendChild(root);
  const deck=el('div','deck'),nav=el('div','cnav');root.append(deck,nav);
  Lab.setStage('none');defaults();
  let i=0,flipped=false,hand=null;
  const C=[
    {t:'Что такое мощность?',p:'Это то, как быстро совершается работа. Внизу два мотора. Покрути сцену, чтобы рассмотреть.'},
    {t:'Подними ящик сам',p:()=>hand?`Ты поднял 5 кг за ${nf(hand.t)} с. Твоя мощность: <b>${W(hand.P)}</b>.`:'Схвати ящик А на картинке и потяни вверх.'},
    {t:'Угадай',p:'У мотора А 50 Вт, у мотора Б 25 Вт. Кто поднимет ящик первым?',opts:['А','Б','Одинаково']},
    {t:'Формула',p:'N = A / t. Мощность равна работе, делённой на время. Потяни диск на моторе Б, чтобы поменять его мощность, и запусти снова.',btn:'▶ Запустить'},
  ];
  let slot=null;
  const draw=()=>{deck.innerHTML='';
    C.slice(i,i+3).reverse().forEach((c,k,arr)=>{const depth=arr.length-1-k;const card=el('div','cardx'+(depth===1?' behind':depth===2?' behind2':''));
      if(depth===0){slot=el('div','slot');card.appendChild(slot);const tx=el('div','txt');
        const p=typeof c.p==='function'?c.p():c.p;
        tx.innerHTML=`<span class="k" style="font-family:var(--mono);font-size:12px;color:var(--muted)">${i+1} / ${C.length}</span><h2>${c.t}</h2><p>${p}</p>`;
        if(c.opts&&!flipped){const o=el('div','opts');c.opts.forEach(x=>{const b=el('button','opt',x);b.onclick=()=>{flipped=x;Lab.reset();Lab.run();draw()};o.appendChild(b)});tx.appendChild(o)}
        if(c.opts&&flipped)tx.appendChild(el('div','flipback',(flipped==='А'?'Верно! ':'Смотри: ')+'первым будет А. Та же работа за меньшее время значит большая мощность.'));
        if(c.btn){const b=el('button','btn',c.btn);b.style.alignSelf='flex-start';b.onclick=()=>{Lab.reset();Lab.run()};tx.appendChild(b)}
        card.appendChild(tx);
        let sx=null;tx.addEventListener('pointerdown',e=>sx=e.clientX);tx.addEventListener('pointerup',e=>{if(sx!=null&&Math.abs(e.clientX-sx)>60)go(e.clientX<sx?1:-1);sx=null});
      }else card.appendChild(el('div','txt',`<h2 style="opacity:.4">${c.t}</h2>`));
      deck.appendChild(card)});
    Lab.mount(slot,{hint:'Тяни ящик · крути диск'});
    nav.innerHTML=`<button class="ghost" id="cp">← Назад</button><span class="cdots">${C.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</span><button class="btn" id="cn">${i<C.length-1?'Дальше →':'Сначала'}</button>`;
    $('#cp',nav).onclick=()=>go(-1);$('#cn',nav).onclick=()=>i<C.length-1?go(1):(i=0,flipped=false,draw())};
  const go=d=>{const n=i+d;if(n<0||n>=C.length)return;i=n;Lab.reset();draw()};
  Lab.on('hand',d=>{hand=d;if(i===1)draw()});
  draw();
}},

{name:'Живая формула',build(){
  const root=el('div','c-formula');app.appendChild(root);
  const bar=el('div','fbar'),slot=el('div','slot');root.append(bar,slot);
  Lab.setStage('none');defaults();Lab.setVisible('B',false);Lab.mount(slot,{hint:'Тяни числа в формуле · крути диск · тяни ящик'});
  let m=5,t=2;
  bar.innerHTML=`<div class="eq">N =<span class="res" id="N"></span>=<span><span class="scrub" id="sm" title="Потяни влево-вправо"></span><span style="font-family:var(--mono);font-size:.8em"> ·10·1</span></span>/<span class="scrub" id="st" title="Потяни влево-вправо"></span></div>
    <p class="fnote">Потяни <b>синие числа</b> влево или вправо: масса и время. Мотор сразу получит нужную мощность. Или покрути диск на моторе, и формула пересчитает время.</p>
    <div class="acts"><button class="btn" id="go">▶ Проверить на моторе</button></div>`;
  const upd=(fromDial)=>{const A=m*10;if(fromDial)t=A/Lab.rigs.A.power;const N=A/t;$('#sm',bar).textContent=m+' кг';$('#st',bar).textContent=nf(t)+' с';$('#N',bar).textContent=W(N);
    if(!fromDial){Lab.rigs.A.power=N;}if(Lab.rigs.A.mass!==m)Lab.setMass('A',m)};
  const scrub=(id,fn)=>{const e=$(id,bar);let x=null;e.addEventListener('pointerdown',ev=>{x=ev.clientX;e.setPointerCapture(ev.pointerId)});
    e.addEventListener('pointermove',ev=>{if(x==null)return;const d=ev.clientX-x;if(Math.abs(d)>=8){fn(Math.sign(d));x=ev.clientX;Lab.reset();upd(false)}});e.addEventListener('pointerup',()=>x=null)};
  scrub('#sm',s=>m=clamp(m+s,1,20));scrub('#st',s=>t=Math.round(clamp(t+s*.1,.5,8)*10)/10);
  $('#go',bar).onclick=()=>{Lab.reset();Lab.run(['A'])};
  Lab.on('dial',()=>upd(true));
  Lab.on('finish',d=>toast(slot,`Мотор ${W(d.P)} поднял ${d.m} кг за ${nf(d.t)} с`));
  Lab.on('hand',d=>toast(slot,`Твоя мощность: ${W(d.P)} (${nf(d.t)} с)`));
  upd(false);
  return()=>Lab.setVisible('B',true);
}},
/* 8 ---------- ASSEMBLY GUIDE ---------- */
{name:'Разбор устройства',build(){
  const root=el('div','c-ex');app.appendChild(root);
  const slot=el('div','slot'),side=el('div','exp');root.append(slot,side);
  Lab.setStage('explode');Lab.mount(slot,{hint:'Нажми на деталь · вращай сцену'});
  const num=el('div','bignum');slot.appendChild(num);
  const info={'Корпус':'Прозрачная оболочка. Держит все детали вместе.','Магниты':'Два магнита: северный и южный. Между ними магнитное поле.','Катушка':'Медный провод на железном сердечнике. Когда по нему течёт ток, катушка становится магнитом и крутится.','Вал':'Стальная ось. Передаёт вращение наружу.','Щётки':'Подают ток на катушку и переключают его каждые пол-оборота.','Крышка':'Закрывает мотор с другой стороны.','Шкив':'Катушка для троса. На него наматывается трос с ящиком.'};
  const S=[
    {t:'Целый мотор',p:'Это мотор из урока про мощность. Снаружи он простой. Давай посмотрим, что внутри.',e:0,sel:-1,parts:[]},
    {t:'Корпус',p:'Сначала снимаем прозрачный корпус.',e:1,sel:0,parts:[0,5]},
    {t:'Магниты',p:'Внутри по бокам стоят два магнита. Они создают поле, в котором будет вращаться катушка.',e:1,sel:1,parts:[1]},
    {t:'Катушка',p:'В центре катушка из медного провода. Это главная деталь: она превращает электричество в вращение.',e:1,sel:2,parts:[2]},
    {t:'Щётки',p:'Щётки подают ток на катушку и меняют его направление, чтобы она крутилась без остановки.',e:1,sel:4,parts:[4]},
    {t:'Вал и шкив',p:'Катушка сидит на валу. На конце вала шкив, на него наматывается трос с ящиком.',e:1,sel:3,parts:[3,6]},
    {t:'Включаем ток',p:'Соберём мотор и подадим ток. Мотор мощностью 50 Вт каждую секунду выполняет 50 Дж работы.',e:0,sel:-1,parts:[],spin:true},
  ];
  let i=0,picked=null;
  const draw=()=>{const st=S[i];Lab.Ex.set(st.e);Lab.Ex.select(picked??st.sel);Lab.Ex.spin(!!st.spin||Lab.Ex.spinning&&picked!=null);
    num.innerHTML=`<small>ШАГ</small><b>${String(i+1).padStart(2,'0')}</b>`;
    const list=(picked!=null?[picked]:st.parts);
    side.innerHTML=`<div class="in"><span class="k">ШАГ ${i+1} ИЗ ${S.length}</span><h2>${picked!=null?Lab.Ex.names[picked]:st.t}</h2><p style="margin:0">${picked!=null?info[Lab.Ex.names[picked]]:st.p}</p>
      ${list.length?`<div class="k">ДЕТАЛИ</div><div class="parts">${list.map(k=>`<button data-i="${k}" aria-pressed="${(picked??st.sel)===k}">${Lab.Ex.names[k]}<small>смотреть</small></button>`).join('')}</div>`:''}
      <div class="range"><label for="exr"><span>Собран</span><span>Разобран</span></label><input type="range" id="exr" min="0" max="100" value="${Math.round(Lab.Ex.value*100)}"></div>
      <div style="display:flex;gap:8px;align-items:center"><button class="ghost" id="spin">${Lab.Ex.spinning?'■ Выключить ток':'⚡ Включить ток'}</button>${Lab.Ex.spinning?'<span class="pw">50 Вт → 50 Дж/с</span>':''}</div>
      ${picked!=null?'<button class="ghost" id="unpick" style="align-self:flex-start">← К шагу</button>':''}</div>
      <div class="foot"><button class="ghost" id="pv">← Назад</button><span class="sp"></span><button class="btn" id="nx">${i<S.length-1?'Дальше →':'Сначала'}</button></div>`;
    side.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{picked=+b.dataset.i;draw()});
    $('#exr',side).oninput=e=>Lab.Ex.set(e.target.value/100);
    $('#spin',side).onclick=()=>{Lab.Ex.spin(!Lab.Ex.spinning);draw()};
    const u=$('#unpick',side);if(u)u.onclick=()=>{picked=null;draw()};
    $('#pv',side).onclick=()=>{if(i>0){i--;picked=null;draw()}};$('#nx',side).onclick=()=>{i=i<S.length-1?i+1:0;picked=null;draw()}};
  Lab.on('part',d=>{picked=d.i;if(Lab.Ex.value<.5)Lab.Ex.set(1);draw()});
  draw();
  return()=>Lab.Ex.spin(false);
}},
];

/* =================== switcher =================== */
const tabs=$('#tabs');let cur=-1,cleanup=null;
concepts.forEach((c,i)=>{const b=el('button','tab',`<b>${i+1}</b>${c.name}`);b.onclick=()=>open(i);tabs.appendChild(b)});
function open(i){if(cleanup)cleanup();cleanup=null;Lab.clear();Lab.reset();app.innerHTML='';cur=i;
  tabs.querySelectorAll('.tab').forEach((b,k)=>b.setAttribute('aria-current',k===i?'true':'false'));
  cleanup=concepts[i].build()||null;try{history.replaceState(null,'','#v'+(i+1))}catch(e){}}
const h=parseInt((location.hash.match(/v(\d)/)||[])[1],10);
open(h>=1&&h<=concepts.length?h-1:0);
})();
</script>
