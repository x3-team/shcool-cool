<title>Библиотека School Cool</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&family=Noto+Sans+Arabic:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+SC:wght@400;600;700&display=swap">
<style>
/* Portal = a library. Every subject is a 3D book on a shelf; open one and it lies on the desk with its little scene growing from the page.
   Same tokens as the Book lesson. Blue always means "you can press this". */
:root{
  --bg:#ECEEEA; --surface:#FFFFFF; --ink:#1F2326; --muted:#6A706C; --line:#D8DCD6; --act:#2F62E8; --act-soft:#E8EEFF;
  --good:#1F8A5B; --good-soft:#E2F3EA; --shade:rgba(20,30,25,.10);
  --serif:"Literata","Noto Sans Arabic","Noto Sans Devanagari","Noto Sans SC",Georgia,serif;
  --sans:"Manrope","Noto Sans Arabic","Noto Sans Devanagari","Noto Sans SC","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#191C1B;--surface:#242827;--ink:#ECEFEC;--muted:#A3AAA5;--line:#383F3B;--act:#7D9EFF;--act-soft:#27304A;--good:#5CC48F;--good-soft:#1E3A2B;--shade:rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#191C1B;--surface:#242827;--ink:#ECEFEC;--muted:#A3AAA5;--line:#383F3B;--act:#7D9EFF;--act-soft:#27304A;--good:#5CC48F;--good-soft:#1E3A2B;--shade:rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 24px}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--act);outline-offset:2px;border-radius:10px}
.wrap{max-width:1240px;margin-inline:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{display:flex;align-items:center;gap:12px;padding-block:12px;position:relative;z-index:5}
.logo{font-weight:800;font-size:17px;white-space:nowrap;text-decoration:none;display:flex;align-items:center;gap:8px}
.logo i{width:22px;height:26px;border-radius:3px 6px 6px 3px;background:var(--act);position:relative;display:inline-block}
.logo i::after{content:"";position:absolute;inset:4px 4px 4px 7px;border-radius:2px;background:var(--surface);opacity:.9}
.logo span{color:var(--act)}
.search{flex:1;max-width:460px;margin-inline:auto;position:relative;min-width:0}
.search input{width:100%;border:0;background:var(--surface);border-radius:99px;padding:9px 16px 9px 40px;box-shadow:0 1px 0 var(--line);font-weight:600;outline:none}
[dir="rtl"] .search input{padding:9px 40px 9px 16px}
.search input::placeholder{color:var(--muted);font-weight:500}
.search input:focus{box-shadow:0 0 0 2px var(--act)}
.search svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.results{position:absolute;top:calc(100% + 8px);inset-inline:0;background:var(--surface);border-radius:16px;box-shadow:0 18px 50px -18px rgba(0,0,0,.35);padding:6px;max-height:60vh;overflow:auto}
.results button{display:flex;gap:10px;align-items:center;width:100%;text-align:start;padding:9px 10px;border-radius:10px}
.results button:hover,.results button.on{background:var(--act-soft)}
.results i{flex:none;width:8px;height:22px;border-radius:2px;background:var(--c)}
.results b{display:block;font-weight:700}
.results small{color:var(--muted);font-weight:600}
.results .empty{padding:10px;color:var(--muted)}
.pillbtn{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:99px;padding:7px 13px 7px 9px;font-weight:700;font-size:13px;box-shadow:0 1px 0 var(--line);white-space:nowrap}
.pillbtn svg{width:18px;height:18px;flex:none}
.pillbtn small{color:var(--muted);font-weight:600;font-family:var(--mono)}

/* home */
.intro{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px 28px;align-items:end;padding-block:20px 18px}
.greet h1{font-family:var(--serif);font-weight:600;font-size:clamp(28px,4vw,44px);line-height:1.08;margin:0 0 10px;text-wrap:balance;letter-spacing:-.01em}
.greet p{margin:0 0 16px;color:var(--muted);max-width:52ch;font-size:16px}
.grades{display:flex;align-items:center;gap:10px;min-width:0}
.grades>span{font-weight:700;font-size:13px;color:var(--muted);flex:none}
.gscroll{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;background:var(--surface);border-radius:12px;padding:4px;box-shadow:0 1px 0 var(--line);min-width:0}
.gscroll button{min-width:34px;height:32px;border-radius:9px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);flex:none;padding-inline:6px}
.gscroll button:hover{color:var(--act)}
.gscroll button[aria-checked="true"]{background:var(--act);color:#fff}
.cont{display:flex;gap:14px;align-items:center;background:var(--surface);border-radius:18px;padding:14px;text-decoration:none;box-shadow:0 1px 0 var(--line);transition:transform .2s}
.cont:hover{transform:translateY(-2px)}
.mini{flex:none;width:44px;height:56px;border-radius:4px 7px 7px 4px;background:var(--c);position:relative;box-shadow:inset 6px 0 0 rgba(0,0,0,.14)}
.mini::after{content:"";position:absolute;inset-inline:9px 5px;top:9px;height:2px;background:rgba(255,255,255,.55);box-shadow:0 5px 0 rgba(255,255,255,.35)}
.cont .tx{flex:1;min-width:0}
.cont small{display:block;color:var(--muted);font-weight:700;font-size:12px;letter-spacing:.04em}
.cont b{display:block;font-family:var(--serif);font-weight:600;font-size:20px;line-height:1.2}
.bar{height:5px;border-radius:9px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:50%;background:var(--act);border-radius:9px}
.go{flex:none;width:40px;height:40px;border-radius:12px;background:var(--act);color:#fff;display:grid;place-items:center}
.go svg{width:20px;height:20px}
[dir="rtl"] .go svg,[dir="rtl"] .back svg{transform:scaleX(-1)}

.shelf{position:relative;border-radius:22px;overflow:hidden;height:clamp(380px,56vh,580px);background:var(--surface)}
.shelf canvas,.desk canvas{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y}
.tag{position:absolute;transform:translate(-50%,calc(-100% - 6px));pointer-events:none;background:var(--surface);border-radius:12px;padding:6px 12px 7px;box-shadow:0 6px 24px -8px rgba(0,0,0,.35);text-align:center;white-space:nowrap;transition:opacity .2s}
.tag b{display:block;font-family:var(--serif);font-weight:600;font-size:16px;line-height:1.2}
.tag small{color:var(--act);font-weight:700;font-size:12px}
.hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--surface);color:var(--muted);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:700;pointer-events:none;white-space:nowrap;box-shadow:0 2px 10px rgba(0,0,0,.08);transition:opacity .4s;display:flex;gap:8px;align-items:center}
.hint i{width:8px;height:8px;border-radius:50%;background:var(--act);animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.6);opacity:.4}}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px;font-weight:600;padding-block:18px 0}

/* subject */
.subhead{display:flex;align-items:center;gap:12px;padding-block:14px 12px}
.back{display:flex;align-items:center;gap:6px;color:var(--act);font-weight:700;padding:8px 10px 8px 6px;border-radius:10px}
.back:hover{background:var(--act-soft)}
.back svg{width:20px;height:20px}
.subgrid{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:12px;align-items:start}
.desk{position:sticky;top:12px;height:min(640px,calc(100vh - 110px));min-height:380px;border-radius:22px;overflow:hidden;background:var(--surface)}
.toc{background:var(--surface);border-radius:22px;padding:22px 20px;min-width:0}
.toc h1{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.1;margin:0 0 4px;display:flex;align-items:center;gap:12px;text-wrap:balance}
.toc h1 i{flex:none;width:14px;height:28px;border-radius:3px;background:var(--c)}
.toc .meta{color:var(--muted);font-weight:600;margin:0 0 14px}
.ch{border-top:1px solid var(--line);padding-block:14px 6px}
.ch h2{margin:0 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.ch h2 span{font-family:var(--mono);letter-spacing:0;text-transform:none}
.ls{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:9px 8px;border-radius:12px;text-decoration:none}
.ls:hover{background:var(--bg)}
.ls .st{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:12px;color:var(--muted);border:1.5px solid var(--line)}
.ls.done .st{background:var(--good-soft);border-color:transparent;color:var(--good)}
.ls.done .st svg{width:15px;height:15px}
.ls.now{background:var(--act-soft)}
.ls.now .st{border-color:var(--act);color:var(--act);box-shadow:inset 0 0 0 3px var(--act-soft),inset 0 0 0 10px var(--act)}
.ls .nm{flex:1;min-width:0;font-weight:700}
.ls.done .nm{color:var(--muted);font-weight:600}
.ls .tm{color:var(--muted);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.ls .btn{background:var(--act);color:#fff;border-radius:10px;padding:6px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.ls.flash{animation:flash 1.4s 2}
@keyframes flash{50%{background:var(--act-soft)}}

/* dialog */
dialog{border:0;padding:0;border-radius:24px;background:var(--surface);color:var(--ink);width:min(760px,calc(100vw - 24px));max-height:calc(100vh - 40px);box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(15,20,18,.45)}
.dlg{display:flex;flex-direction:column;max-height:calc(100vh - 40px)}
.dlg header{padding:22px 24px 6px}
.dlg h2{font-family:var(--serif);font-weight:600;font-size:26px;margin:0 0 4px}
.dlg header p{margin:0;color:var(--muted)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;padding:12px 24px;overflow:auto;min-height:0}
.cols h3{margin:6px 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.list{display:grid;gap:2px}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:start;padding:8px 10px;border-radius:12px;border:1.5px solid transparent}
.opt:hover{background:var(--bg)}
.opt[aria-checked="true"]{border-color:var(--act);background:var(--act-soft)}
.opt .nm{flex:1;min-width:0}
.opt b{display:block;font-weight:700}
.opt small{color:var(--muted);font-weight:600;font-size:12px}
.opt .chip{flex:none;font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px;background:var(--bg);color:var(--muted)}
.opt .chip.full{background:var(--good-soft);color:var(--good)}
.code{flex:none;width:30px;height:22px;border-radius:5px;background:var(--bg);display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--muted)}
.find{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;margin-bottom:6px;outline:none}
.find:focus{border-color:var(--act)}
.dlg footer{display:flex;align-items:center;gap:12px;padding:14px 24px 20px;border-top:1px solid var(--line)}
.dlg footer p{margin:0;flex:1;color:var(--muted);font-size:13px}
.primary{background:var(--act);color:#fff;font-weight:700;border-radius:12px;padding:10px 20px;white-space:nowrap}

.detect{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--act-soft);color:var(--ink);border-radius:14px;padding:10px 14px;margin-top:4px;font-weight:600}
.detect span{flex:1;min-width:0}
.detect .ghost{color:var(--act);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 16px;font-weight:700;font-size:14px;transition:opacity .3s;max-width:calc(100% - 32px);text-align:center;z-index:20}
.toast.hide{opacity:0;pointer-events:none}

@media (max-width:900px){
  .intro{grid-template-columns:minmax(0,1fr);align-items:start}
  .subgrid{grid-template-columns:minmax(0,1fr)}
  .desk{position:relative;top:0;height:46vh;min-height:320px}
}
@media (max-width:640px){
  .top{flex-wrap:wrap}
  .search{order:3;flex-basis:100%;max-width:none}
  .pillbtn .lbl{display:none}
  .pillbtn{padding:8px}
  #langBtn{margin-inline-start:auto}
  .shelf{height:auto;aspect-ratio:.82;max-height:none}
  .cols{grid-template-columns:1fr}
  .toc{padding:18px 12px}
  .toc h1{font-size:28px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <a class="logo" href="#home"><i></i><span class="sr">School Cool</span><span aria-hidden="true" style="color:var(--ink)">school <span>cool</span></span></a>
    <div class="search" id="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off" data-ph="search" aria-label="Search">
      <div class="results" id="results" hidden></div>
    </div>
    <button class="pillbtn" id="langBtn" aria-haspopup="dialog"></button>
    <button class="pillbtn" id="themeBtn"></button>

  <div class="detect" id="detect" hidden><span id="detectTx"></span><button class="primary" id="detectYes"></button><button class="ghost" id="detectNo"></button></div>

  <main id="home">

      <div class="greet">

      </div>
      <a class="cont" id="cont" href="https://claude.ai/artifact/VoahneKwFUHf92JML4SMhg" target="_blank" rel="noopener" style="--c:#3E5D7E">
        <span class="mini"></span>
        <span class="tx"><small data-t="cont"></small><b id="contTitle"></b><small id="contSub" style="letter-spacing:0;font-weight:600"></small><span class="bar"><i></i></span></span>
        <span class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
      </a>
    </section>
    <section class="shelf" id="shelfSlot">
      <div class="tag" id="tag" style="opacity:0"><b></b><small></small></div>

    <ul class="sr" id="subjList"></ul>
    <footer class="foot"><span data-t="foot"></span><span id="footMeta"></span></footer>
  </main>

  <main id="subject" hidden>
    <div class="subhead"><button class="back" id="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg><span data-t="back"></span></button></div>
    <div class="subgrid">
      <section class="desk" id="deskSlot"></section>
      <section class="toc" id="toc"></section>
    </div>
  </main>
</div>

<dialog id="world"><form class="dlg" method="dialog" id="worldForm">
  <header><h2 data-t="where"></h2><p data-t="programNote"></p></header>
  <div class="cols">
    <div><h3 data-t="langL"></h3><div class="list" id="langList" role="radiogroup"></div></div>
    <div><h3 data-t="countryL"></h3><input class="find" id="findCountry" type="search" autocomplete="off" data-ph="findCountry"><div class="list" id="countryList" role="radiogroup"></div></div>
  </div>
  <footer><p id="dlgNote"></p><button class="primary" value="ok" data-t="ready"></button></footer>
</form></dialog>
<div class="toast hide" id="toast"></div>

        yaw+=(tyaw-yaw)*.08;pitch+=(tpitch-pitch)*.08;const asp=cam.aspect,dist=asp<.9?22:(asp<1.2?18:15.5),tx=0;
        cam.position.set(tx+Math.sin(yaw)*dist*Math.cos(pitch),.9+Math.sin(pitch)*dist,Math.cos(yaw)*dist*Math.cos(pitch));cam.lookAt(tx,.9,0);
        if(deskProp){const u=deskProp.userData;u.k=Math.min(1,u.k+dt*1.3);deskProp.scale.setScalar(2.5*Math.max(.001,outBack(u.k)));deskProp.children[0].rotation.y=Math.sin(now/1400)*.5-.2;spinProp(deskProp.children[0],now)}
      }
      R.render(scene,cam)}
    requestAnimationFrame(frame)}
  function spinProp(p,now){if(p.userData.spin)p.userData.spin.rotation.y=now/700;if(p.userData.bubbles)p.userData.bubbles.children.forEach(b=>{const k=((now/1600)+b.userData.o)%1;b.position.set(Math.sin(k*9)*.03,.62+k*.45,0);b.scale.setScalar(1-k*.6)})}
  requestAnimationFrame(frame);

  function setTheme(name){TH=THEMES[name];reg.forEach(r=>r.m.color.copy(lin(TH[r.key])));hemi.intensity=TH.hemi;hemi.groundColor.set(TH.hemiG);sun.intensity=TH.sun;R.toneMappingExposure=TH.exp;
    lineM.opacity=TH.line;lineM.color.set(name==='dark'?0x0c0e12:0x2a2e33);R.setClearColor(lin(TH.wall),1);
    if(deskPage&&deskInfo){const o=deskPage.material.map;deskPage.material.map=pageTex(deskInfo);deskPage.material.needsUpdate=true;o&&o.dispose()}}
  return{mount,setSubjects,setDesk,setTheme,setHover:sid=>setHover(books.find(b=>b.sid===sid)||null),get hovered(){return hovered&&hovered.sid},set onPick(f){onPick=f},set onHover(f){onHover=f}};
})();

/* ================= UI ================= */
const ICON={light:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',dark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>',
  globe:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastT;function toast(s){const e=$('#toast');e.textContent=s;e.classList.remove('hide');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.add('hide'),2800)}
const regionName=(code,lang)=>{try{return new Intl.DisplayNames([lang],{type:'region'}).of(code)}catch(e){return code}};
const langName=(code,lang)=>{try{return new Intl.DisplayNames([lang],{type:'language'}).of(code)}catch(e){return code}};

function applyText(){const tt=t();document.documentElement.lang=S.lang;document.documentElement.dir=tt.rtl?'rtl':'ltr';
  document.querySelectorAll('[data-t]').forEach(e=>{e.textContent=tt[e.dataset.t]});document.querySelectorAll('[data-ph]').forEach(e=>{e.placeholder=tt[e.dataset.ph]});
  const c=cdef();$('#langBtn').innerHTML=ICON.globe+`<span class="lbl">${esc(tt.native)}</span><small>${c[0]==='XX'?'—':c[0]}</small>`;$('#langBtn').setAttribute('aria-label',tt.langL+': '+tt.native);
  $('#contTitle').textContent=tt.power;$('#contSub').textContent=`${tt.s.physics} · ${tt.step(2,4)}`;
  $('#footMeta').textContent=(c[0]==='XX'?tt.none:regionName(c[0],S.lang))+' · '+tt.grade(S.grade);
  applyTheme()}
function renderGrades(){const N=cdef()[2];if(S.grade>N)S.grade=N;const g=$('#grades');g.innerHTML='';
  for(let i=1;i<=N;i++){const b=document.createElement('button');b.textContent=i;b.setAttribute('role','radio');b.setAttribute('aria-checked',i===S.grade);b.setAttribute('aria-label',t().grade(i));
    b.onclick=()=>{S.grade=i;store.set('grade',i);renderGrades();renderShelf();applyText()};g.appendChild(b)}
  const on=g.querySelector('[aria-checked="true"]');on&&on.scrollIntoView({block:'nearest',inline:'center'})}
function renderShelf(){const ids=subjectsFor(S.grade,cdef()[2]);World.setSubjects(ids);
  const ul=$('#subjList');ul.innerHTML='';ids.forEach(id=>{const li=document.createElement('li');const b=document.createElement('button');b.textContent=`${t().s[id]} — ${t().lessonsL}: ${count(id)}`;
    b.onfocus=()=>World.setHover(id);b.onblur=()=>World.setHover(null);b.onclick=()=>openSubject(id);li.appendChild(b);ul.appendChild(li)})}
World.onHover=sid=>{const tg=$('#tag');if(!sid)return;tg.querySelector('b').textContent=t().s[sid];tg.querySelector('small').textContent=`${t().lessonsL}: ${count(sid)} →`;$('#hint').style.opacity=0};
World.onPick=sid=>{setTimeout(()=>openSubject(sid),RM?0:380)};
function openSubject(sid){location.hash='s-'+sid}

function renderTOC(sid){const tt=t(),lg=ll(),col=hex(COLORS[sid]);let h=`<h1 style="--c:${col}"><i></i>${esc(tt.s[sid])}</h1><p class="meta">${esc(tt.grade(S.grade))} · ${esc(tt.lessonsL)}: ${count(sid)}</p>`;
  TOC[sid].forEach((ch,ci)=>{const done=ch.ls.filter((_,li)=>(DONE[sid]||[]).includes(ci+'.'+li)).length;
    h+=`<section class="ch"><h2>${esc(ch[lg])}<span>${done}/${ch.ls.length}</span></h2>`;
    ch.ls.forEach((l,li)=>{const key=ci+'.'+li,isDone=(DONE[sid]||[]).includes(key),isNow=NOW[sid]===key,ready=READY[sid]===key;
      const title=key==='2.1'&&sid==='physics'?tt.power:l[lg];
      const st=isDone?ICON.check:`${ci+1}.${li+1}`;const cls='ls'+(isDone?' done':'')+(isNow?' now':'');
      const inner=`<span class="st">${st}</span><span class="nm">${esc(title)}</span>${ready?`<span class="btn">${esc(isNow?tt.cont:tt.open)}</span>`:`<span class="tm">${mins(sid,ci,li)} ${esc(tt.min)}</span>`}`;
      h+=ready?`<a class="${cls}" data-k="${key}" href="${LESSON_URL}" target="_blank" rel="noopener">${inner}</a>`:`<button class="${cls}" data-k="${key}">${inner}</button>`});
    h+='</section>'});
  const el=$('#toc');el.innerHTML=h;el.querySelectorAll('button.ls').forEach(b=>b.onclick=()=>toast(t().soon))}

function route(){const m=location.hash.match(/^#s-([a-z]+)$/);const sid=m&&TOC[m[1]]?m[1]:null;S.sid=sid;
  $('#home').hidden=!!sid;$('#subject').hidden=!sid;
  if(sid){World.setDesk(sid);World.mount($('#deskSlot'),'desk');renderTOC(sid);window.scrollTo(0,0)}
  else{World.mount($('#shelfSlot'),'shelf');World.setHover(null)}}
window.addEventListener('hashchange',route);
$('#back').onclick=()=>{location.hash='home'};

/* search */
const q=$('#q'),res=$('#results');let sel=0,hits=[];
function doSearch(){const s=q.value.trim().toLowerCase();if(!s){res.hidden=true;return}const tt=t(),lg=ll();hits=[];
  Object.keys(TOC).forEach(sid=>{if(tt.s[sid].toLowerCase().includes(s))hits.push({sid,title:tt.s[sid],sub:`${tt.lessonsL}: ${count(sid)}`});
    TOC[sid].forEach((ch,ci)=>ch.ls.forEach((l,li)=>{const name=(sid==='physics'&&ci===2&&li===1)?tt.power:l[lg];if(name.toLowerCase().includes(s)||l.ru.toLowerCase().includes(s)||l.en.toLowerCase().includes(s))hits.push({sid,key:ci+'.'+li,title:name,sub:`${tt.s[sid]} · ${ch[lg]}`})}))});
  hits=hits.slice(0,7);sel=0;res.hidden=false;
  res.innerHTML=hits.length?hits.map((h,i)=>`<button data-i="${i}" class="${i===0?'on':''}" style="--c:${hex(COLORS[h.sid])}"><i></i><span><b>${esc(h.title)}</b><small>${esc(h.sub)}</small></span></button>`).join(''):`<div class="empty">${esc(tt.nothing)}</div>`;
  res.querySelectorAll('button').forEach(b=>b.onmousedown=e=>{e.preventDefault();go(hits[+b.dataset.i])})}
function go(h){if(!h)return;q.value='';res.hidden=true;q.blur();location.hash='s-'+h.sid;if(h.key)setTimeout(()=>{const r=$(`#toc [data-k="${h.key}"]`);if(r){r.scrollIntoView({block:'center',behavior:'smooth'});r.classList.add('flash')}},120)}
q.addEventListener('input',doSearch);q.addEventListener('blur',()=>setTimeout(()=>res.hidden=true,100));q.addEventListener('focus',doSearch);
q.addEventListener('keydown',e=>{const bs=res.querySelectorAll('button');if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();sel=(sel+(e.key==='ArrowDown'?1:-1)+bs.length)%Math.max(1,bs.length);bs.forEach((b,i)=>b.classList.toggle('on',i===sel))}
  else if(e.key==='Enter'){e.preventDefault();go(hits[sel])}else if(e.key==='Escape'){res.hidden=true}});

/* language & country dialog */
const dlg=$('#world');let draft={};
function renderDialog(){const tt=L[draft.lang];
  $('#langList').innerHTML=Object.keys(L).map(k=>`<button type="button" class="opt" role="radio" aria-checked="${k===draft.lang}" data-l="${k}"><span class="nm"><b>${esc(L[k].native)}</b><small>${esc(langName(k,draft.lang))}</small></span><span class="chip ${LESSON_LANGS.includes(k)?'full':''}">${esc(LESSON_LANGS.includes(k)?tt.full:tt.ui)}</span></button>`).join('');
  const f=$('#findCountry').value.trim().toLowerCase();
  $('#countryList').innerHTML=COUNTRIES.filter(c=>{if(!f)return true;const loc=c[0]==='XX'?tt.none:regionName(c[0],draft.lang);return(c[1]+' '+loc+' '+c[0]).toLowerCase().includes(f)}).map(c=>{
    const xx=c[0]==='XX',loc=xx?tt.none:regionName(c[0],draft.lang),nat=xx?tt.noneSub:c[1];
    return`<button type="button" class="opt" role="radio" aria-checked="${c[0]===draft.country}" data-c="${c[0]}"><span class="code">${xx?'∞':c[0]}</span><span class="nm"><b>${esc(loc)}</b><small>${esc(nat===loc?'':nat)}${nat===loc?'':' · '}${esc(tt.gradesN)}: ${c[2]}</small></span></button>`}).join('');
  $('#langList').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{draft.lang=b.dataset.l;renderDialogText();renderDialog()});
  $('#countryList').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{draft.country=b.dataset.c;renderDialog()})}
function renderDialogText(){const tt=L[draft.lang];dlg.setAttribute('dir',tt.rtl?'rtl':'ltr');dlg.querySelectorAll('[data-t]').forEach(e=>e.textContent=tt[e.dataset.t]);$('#findCountry').placeholder=tt.findCountry}
$('#langBtn').onclick=()=>{draft={lang:S.lang,country:S.country};$('#findCountry').value='';renderDialogText();renderDialog();dlg.showModal()};
$('#findCountry').addEventListener('input',renderDialog);$('#findCountry').addEventListener('keydown',e=>{if(e.key==='Enter')e.preventDefault()});
$('#worldForm').addEventListener('submit',e=>{if(e.submitter&&e.submitter.value==='ok'){setLang(draft.lang,draft.country)}});
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
function setLang(lang,country){const changed=lang!==S.lang||country!==S.country;S.lang=lang;if(country)S.country=country;store.set('lang',S.lang);store.set('country',S.country);
  applyText();renderGrades();if(changed){loadFonts().then(()=>{renderShelf();if(S.sid)route()})}}

/* detect browser language */
(function(){if(store.get('lang'))return;const nav=(navigator.language||'').slice(0,2).toLowerCase();if(!L[nav]||nav==='ru'||store.get('detect-no'))return;
  const d=$('#detect');$('#detectTx').textContent=L[nav].detect;$('#detectYes').textContent=L[nav].yes;$('#detectNo').textContent=L[nav].no;d.hidden=false;d.dir=L[nav].rtl?'rtl':'ltr';
  $('#detectYes').onclick=()=>{d.hidden=true;setLang(nav,S.country)};$('#detectNo').onclick=()=>{d.hidden=true;store.set('detect-no','1')}})();

/* theme */
const mq=matchMedia('(prefers-color-scheme: dark)');
const themeNow=()=>document.documentElement.getAttribute('data-theme')||(mq.matches?'dark':'light');
function applyTheme(){const th=themeNow();World.setTheme(th);$('#themeBtn').innerHTML=ICON[th]+`<span class="lbl">${esc(th==='dark'?t().dark:t().light)}</span>`}
{const p=store.get('theme');if(p)document.documentElement.setAttribute('data-theme',p)}
$('#themeBtn').onclick=()=>{const th=themeNow()==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',th);store.set('theme',th);applyTheme()};
mq.addEventListener&&mq.addEventListener('change',()=>{if(!document.documentElement.getAttribute('data-theme'))applyTheme()});

/* fonts: canvas textures need them loaded first */
function loadFonts(){const sample=Object.values(t().s).join('')+t().native;try{return Promise.race([Promise.all([document.fonts.load(`600 40px Literata`,sample),document.fonts.load(`600 40px "Noto Sans Arabic"`,sample),document.fonts.load(`600 40px "Noto Sans Devanagari"`,sample),document.fonts.load(`600 40px "Noto Sans SC"`,sample),document.fonts.load('700 30px Manrope')]),new Promise(r=>setTimeout(r,1500))])}catch(e){return Promise.resolve()}}

applyText();renderGrades();renderShelf();route();
loadFonts().then(()=>{renderShelf();if(S.sid)route()});
})();
</script>
