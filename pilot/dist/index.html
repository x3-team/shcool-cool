:"N/kg","unitCm":"cm","unitNm":"N/m","slices":"Porciones","clear":"Borrar","parts":"Partes","point":"Cuenta","mass":"Masa","weights":"Pesas","pull":"Tirón","friction":"Rozamiento","sliding":"se desliza","left":"Izquierda","dir_left":"hacia la izquierda","dir_right":"hacia la derecha","balanced":"Las fuerzas están equilibradas","resultant":"Fuerza resultante","planets":{"earth":"la Tierra","moon":"la Luna","mars":"Marte","jupiter":"Júpiter"},"surfaces":{"ice":"Hielo","wood":"Madera","rubber":"Goma"}},"curricula":{"ru-fgos":{"name":"Rusia · FGOS","grade":"{g}.º grado","units":{"math5-fractions":"Fracciones comunes","phys7-forces":"Interacción de los cuerpos"}},"us-ccss":{"name":"EE. UU. · Common Core y NGSS","grade":"Grado {g}","units":{"math5-fractions":"Números y operaciones: fracciones","phys7-forces":"Fuerzas e interacciones"}},"in-ncert":{"name":"India · NCERT","grade":"Clase {g}","units":{"math5-fractions":"Fracciones","phys7-forces":"Fuerza y presión, rozamiento"}}},"units":{"math5-fractions":{"title":"Fracciones"},"phys7-forces":{"title":"Fuerzas"}},"tasks":{"frac.read":{"prompt":"¿Qué parte del pastel está coloreada? Escríbela como fracción.","h1":"Cuenta en cuántas porciones iguales está cortado el pastel. Ese es el denominador, el número de abajo.","h2":"Ahora cuenta las porciones coloreadas. Ese es el numerador, el número de arriba.","h3":"El pastel está cortado en {n} porciones y hay {k} coloreadas.","sol":"Hay {n} porciones en total y {k} están coloreadas. Entonces está coloreado [[k/n]] del pastel.","err":{"flip":"El numerador y el denominador están intercambiados. Arriba va cuántas porciones tomamos; abajo, en cuántas porciones se cortó el entero.","unshaded":"Contaste las porciones sin colorear. Hay que contar las coloreadas."}},"frac.shade":{"prompt":"Colorea [[k/n]] del pastel. Si hace falta, cambia el número de porciones con los botones de debajo de la escena.","h1":"El denominador {n} indica en cuántas porciones iguales cortar el pastel.","h2":"El numerador {k} indica cuántas porciones colorear.","h3":"Haz {n} porciones y toca {k} de ellas.","sol":"Cortamos el pastel en {n} porciones iguales y coloreamos {k}. Eso es [[k/n]].","err":{"slices":"Revisa el número de porciones: para [[k/n]] el pastel se corta en {n} partes iguales.","count":"El número de porciones está bien, pero no hay {k} coloreadas. Vuelve a contarlas."}},"frac.numline":{"prompt":"¿Qué fracción marca la cuenta en la recta?","h1":"Mira en cuántas partes iguales está dividido el segmento de 0 a 1. Cuenta los espacios, no las rayitas.","h2":"El segmento de 0 a 1 está dividido en {n} partes. Ese es el denominador.","h3":"Cuenta cuántas de esas partes hay desde 0 hasta la cuenta.","sol":"Cada parte es [[1/n]]. De 0 a la cuenta hay {k} partes, así que es [[k/n]].","err":{"ticks":"Parece que contaste las rayitas y no los espacios entre ellas. Hay una parte menos que rayitas.","flip":"El numerador y el denominador están intercambiados."}},"frac.place":{"prompt":"Pon la cuenta en [[k/n]]. Arrástrala con el dedo o usa las flechas de debajo de la escena.","h1":"Primero haz que el segmento de 0 a 1 esté dividido en {n} partes.","h2":"Cada parte es [[1/n]].","h3":"Cuenta {k} partes desde el cero.","sol":"Dividimos el segmento de 0 a 1 en {n} partes iguales y contamos {k} desde el cero.","err":{"offByOne":"¡Casi! La cuenta está en la marca de al lado. Vuelve a contar las partes desde el cero."}},"frac.equiv":{"prompt":"¿Qué número va en lugar del signo de interrogación? [[a/b]] = ? / {bm}","h1":"¿Cuántas veces es {bm} mayor que {b}?","h2":"El denominador se multiplicó por {m}. Para que la fracción no cambie, el numerador se multiplica por el mismo número.","h3":"{a} · {m} = ?","sol":"{bm} = {b} · {m}, así que el numerador también se multiplica por {m}: {a} · {m} = {am}. Entonces [[a/b]] = [[am/bm]].","err":{"add":"Sumaste al numerador lo mismo que al denominador. Así la fracción cambia. Hay que multiplicar el numerador y el denominador por el mismo número.","same":"El denominador creció, así que las porciones son más pequeñas. Para que la cantidad sea la misma, el numerador también tiene que crecer."}},"frac.simplify":{"prompt":"Simplifica la fracción [[ag/bg]] todo lo posible.","h1":"Busca un número que divida a {ag} y a {bg}.","h2":"Prueba a dividir los dos números entre {g}.","h3":"{ag} : {g} = ?   {bg} : {g} = ?","sol":"{ag} y {bg} son divisibles entre {g}: [[ag/bg]] = [[a/b]]. Ya no se puede simplificar más.","err":{"notLowest":"La fracción es equivalente, pero todavía se puede simplificar. Busca un divisor común del numerador y el denominador."}},"frac.compare":{"prompt":"Compara las fracciones: [[a/b]] ? [[c/d]]","h1":"Si los denominadores son iguales, es mayor la fracción con el numerador mayor.","h2":"Si los numeradores son iguales, es mayor la fracción con el denominador menor: sus porciones son más grandes.","h3":"Si todo es distinto, pasa las dos al denominador común {l}: quedan [[al/l]] y [[cl/l]].","sol":"Pasamos al denominador {l}: [[a/b]] = [[al/l]], [[c/d]] = [[cl/l]]. Comparamos los numeradores {al} y {cl}.","err":{"bigDen":"Los numeradores son iguales y el denominador es mayor, así que las porciones son más pequeñas. Esa fracción es menor, no mayor."}},"frac.addSame":{"prompt":"Suma: [[a/n]] + [[b/n]]","h1":"Las porciones son iguales, de [[1/n]] cada una. Solo se suma cuántas porciones hay.","h2":"{a} + {b} = ?","h3":"El denominador sigue siendo {n}.","sol":"[[a/n]] + [[b/n]] = [[s/n]]: se suman los numeradores y el denominador no cambia.","err":{"addDen":"Los denominadores no se suman: el tamaño de la porción no cambia, solo cuántas hay."}},"frac.subSame":{"prompt":"Resta: [[a/n]] − [[b/n]]","h1":"Había {a} porciones de [[1/n]] y se quitaron {b}.","h2":"{a} − {b} = ?","h3":"El denominador sigue siendo {n}.","sol":"[[a/n]] − [[b/n]] = [[s/n]]: se restan los numeradores y el denominador no cambia.","err":{"subDen":"Los denominadores no se restan: el tamaño de la porción no cambia."}},"frac.lcd":{"prompt":"Halla el mínimo común denominador de dos fracciones con denominadores {b} y {d}.","h1":"El denominador común es divisible entre {b} y entre {d}.","h2":"Escribe los múltiplos de {b}: {b}, {b*2}, {b*3}… ¿Cuál es el primero que es divisible entre {d}?","h3":"El producto {b} · {d} = {p} siempre sirve, pero a veces hay un número menor.","sol":"El menor número divisible entre {b} y entre {d} es {l}.","err":{"product":"{p} sirve, pero no es el mínimo común denominador. Busca un número menor.","notLeast":"Es un denominador común, pero no el mínimo. Hay un número menor."}},"frac.addUnlike":{"prompt":"Calcula: [[a/b]] {op} [[c/d]]","h1":"Los denominadores son distintos, así que primero pasa las fracciones a un denominador común.","h2":"El denominador común es {l}: [[a/b]] = [[al/l]], [[c/d]] = [[cl/l]].","h3":"Ahora {al} {op} {cl} = ?","sol":"[[a/b]] {op} [[c/d]] = [[al/l]] {op} [[cl/l]] = [[s/l]]. Simplificada: [[sn/sd]].","err":{"addDen":"No se pueden sumar ni restar numeradores y denominadores por separado: las porciones son de distinto tamaño. Primero busca un denominador común.","noScale":"El denominador es común, pero también hay que multiplicar los numeradores: [[a/b]] = [[al/l]], [[c/d]] = [[cl/l]]."}},"frac.toImproper":{"prompt":"Escribe [[w a/n]] como fracción impropia. ¿Qué número va en el numerador? ? / {n}","h1":"En un entero hay {n} porciones de [[1/n]].","h2":"En {w} enteros: {w} · {n} = {wn} porciones.","h3":"Suma {a} más.","sol":"{w} · {n} + {a} = {t}, así que [[w a/n]] = [[t/n]].","err":{"wPlusA":"La parte entera hay que multiplicarla por el denominador, no solo sumarla.","forgotA":"No olvides sumar la parte fraccionaria: {a} porciones más."}},"frac.toMixed":{"prompt":"Escribe como número mixto: [[t/n]]","h1":"¿Cuántas veces enteras cabe {n} en {t}?","h2":"{t} : {n} = {w}, resto {a}.","h3":"La parte entera es el cociente, el numerador es el resto y el denominador es el mismo.","sol":"{t} : {n} = {w}, resto {a}. Entonces [[t/n]] = [[w a/n]].","err":{"swap":"La parte entera y el numerador están intercambiados. La parte entera es cuántas veces cabe el denominador en el numerador."}},"frac.ofNumber":{"prompt":"Halla [[a/b]] de {N}. Puedes partir tiras de la tableta de chocolate.","h1":"Primero halla una parte: divide {N} entre {b}.","h2":"[[1/b]] de {N} es {q}.","h3":"Ahora toma {a} de esas partes.","sol":"{N} : {b} = {q}, y luego {q} · {a} = {ans}.","err":{"divOnly":"Eso es solo [[1/b]]. Hay que tomar {a} de esas partes.","mulOnly":"Primero divide entre el denominador y luego multiplica por el numerador."}},"frac.toDecimal":{"prompt":"Escribe como número decimal: [[k/d]]","h1":"El denominador es {d}. ¿Cuántas cifras habrá después de la coma?","h2":"[[1/10]] = 0,1 y [[1/100]] = 0,01.","h3":"Escribe el numerador {k} de modo que su última cifra quede en el lugar correcto.","sol":"[[k/d]] = {x}.","err":{"place":"Las cifras están bien, pero no en su lugar. Las centésimas tienen dos cifras después de la coma; las décimas, una."}},"force.gravity":{"prompt":"Una caja de {m} kg de masa está sobre la Tierra. ¿Con qué fuerza la atrae la Tierra? Usa g = 10 N/kg.","h1":"Fuerza de gravedad: F = m · g.","h2":"m = {m} kg, g = 10 N/kg.","h3":"{m} · 10 = ?","sol":"F = m · g = {m} kg · 10 N/kg = {F} N.","err":{"noG":"Esa es la masa en kilogramos, pero se pide una fuerza en newtons. Multiplica la masa por g."}},"force.gravityGrams":{"prompt":"Un cuerpo tiene una masa de {mg} g. Halla la fuerza de gravedad que actúa sobre él. Usa g = 10 N/kg.","h1":"Primero pasa los gramos a kilogramos: 1 kg son 1000 g.","h2":"{mg} g = {m} kg.","h3":"F = {m} · 10 = ?","sol":"{mg} g = {m} kg. F = {m} kg · 10 N/kg = {F} N.","err":{"grams":"Hay que pasar la masa a kilogramos: {mg} g = {m} kg.","noG":"Se pide una fuerza en newtons: multiplica la masa en kilogramos por g."}},"force.planet":{"prompt":"Un vehículo explorador de {m} kg está en la superficie. Planeta: {planet}, g = {g} N/kg. ¿Con qué fuerza lo atrae?","h1":"La fórmula es la misma: F = m · g, solo cambia g.","h2":"Aquí g = {g} N/kg, no 10.","h3":"{m} · {g} = ?","sol":"F = {m} kg · {g} N/kg = {F} N.","err":{"earthG":"Usaste la g de la Tierra. Aquí g = {g} N/kg."}},"force.massFromWeight":{"prompt":"Sobre un cuerpo actúa una fuerza de gravedad de {P} N. ¿Cuál es su masa? Usa g = 10 N/kg.","h1":"F = m · g, así que m = F : g.","h2":"{P} : 10 = ?","h3":"La respuesta sale en kilogramos.","sol":"m = F : g = {P} N : 10 N/kg = {m} kg.","err":{"mult":"No hay que multiplicar, sino dividir: m = F : g."}},"force.hooke":{"prompt":"Un resorte tiene una constante de {k} N/m. Se estiró {cm} cm. ¿Qué fuerza elástica aparece?","h1":"Ley de Hooke: F = k · Δl.","h2":"Pasa los centímetros a metros: {cm} cm = {x} m.","h3":"{k} · {x} = ?","sol":"F = k · Δl = {k} N/m · {x} m = {F} N.","err":{"cm":"El estiramiento tiene que estar en metros: {cm} cm = {x} m."}},"force.stiffness":{"prompt":"Una fuerza de {F} N estiró un resorte {cm} cm. Halla su constante elástica.","h1":"De F = k · Δl se obtiene k = F : Δl.","h2":"Δl = {cm} cm = {x} m.","h3":"{F} : {x} = ?","sol":"k = F : Δl = {F} N : {x} m = {k} N/m.","err":{"cm":"El estiramiento tiene que estar en metros: {cm} cm = {x} m.","invert":"Hay que dividir la fuerza entre el estiramiento, no multiplicar."}},"force.springScene":{"prompt":"La constante del resorte es {k} N/m y cada pesa pesa 1 N. Cuelga las pesas necesarias para que el resorte se estire {cm} cm.","h1":"La fuerza necesaria para ese estiramiento: F = k · Δl.","h2":"Δl = {x} m, así que F = {k} · {x}.","h3":"Hace falta una fuerza de {F} N, y cada pesa da 1 N.","sol":"F = {k} N/m · {x} m = {F} N. Son {n} pesas de 1 N.","err":{"tooMany":"Demasiadas: el resorte se estiró de más. Quita una pesa.","tooFew":"Todavía faltan: el estiramiento es menor de lo necesario. Añade una pesa."}},"force.sumSame":{"prompt":"Dos niños tiran de un trineo en el mismo sentido con fuerzas de {a} N y {b} N. Halla la fuerza resultante.","h1":"Las fuerzas van en el mismo sentido y se ayudan.","h2":"Entonces hay que sumarlas.","h3":"{a} + {b} = ?","sol":"R = {a} N + {b} N = {R} N, en el mismo sentido.","err":{"diff":"Las fuerzas en el mismo sentido se suman, no se restan."}},"force.sumOpp":{"prompt":"Tiran de una caja hacia la izquierda con una fuerza de {a} N y hacia la derecha con una fuerza de {b} N. Halla la fuerza resultante.","h1":"Las fuerzas van en sentidos opuestos y se estorban.","h2":"A la fuerza mayor réstale la menor.","h3":"La caja se moverá hacia donde la fuerza es mayor: {side}.","sol":"R = {R} N (la fuerza mayor menos la menor), y la caja se moverá {side}.","err":{"sum":"Las fuerzas en sentidos opuestos no se suman: a la mayor se le resta la menor."}},"force.tugScene":{"prompt":"Tiran de la caja hacia la izquierda con una fuerza de {a} N. Elige la fuerza de la derecha para que la caja no se mueva.","h1":"La caja está en reposo si las fuerzas están equilibradas.","h2":"Equilibradas quiere decir iguales en tamaño y en sentidos opuestos.","h3":"A la derecha hace falta la misma fuerza que a la izquierda.","sol":"A la derecha hacen falta {a} N; así la fuerza resultante es cero.","err":{"tooMany":"La fuerza de la derecha es mayor y la caja se mueve a la derecha. Redúcela.","tooFew":"La fuerza de la derecha es menor y la caja se mueve a la izquierda. Auméntala."}},"force.friction":{"prompt":"Arrastran por el suelo una caja de {m} kg. El coeficiente de rozamiento es μ = {mu}. ¿Qué fuerza de rozamiento actúa sobre la caja? Usa g = 10 N/kg.","h1":"Fuerza de rozamiento: F = μ · N, donde N es la fuerza con la que la caja presiona el suelo.","h2":"En un suelo horizontal N = m · g = {N} N.","h3":"{mu} · {N} = ?","sol":"F = μ · m · g = {mu} · {m} kg · 10 N/kg = {F} N.","err":{"noG":"Multiplicaste μ por la masa. Hace falta la fuerza con la que presiona: N = m · g.","noMu":"Esa es la fuerza con la que presiona el suelo. Multiplícala por el coeficiente de rozamiento μ."}},"force.uniform":{"prompt":"Arrastran una caja por el suelo a velocidad constante. El dinamómetro marca {F} N. ¿Cuánto vale la fuerza de rozamiento?","h1":"Velocidad constante quiere decir que las fuerzas a lo largo del suelo están equilibradas.","h2":"A lo largo del suelo solo actúan el tirón y el rozamiento.","h3":"La fuerza de rozamiento es igual al tirón.","sol":"Con movimiento uniforme, el rozamiento es igual al tirón: {F} N.","err":{"zero":"La caja se desliza por el suelo, así que hay rozamiento. A velocidad constante es igual al tirón."}}},"lessons":{"math5.fr01-parts":{"title":"Partes y fracciones","hook":"¿Cómo repartir un pastel de forma justa entre cuatro?","page":"Si cortamos un entero en partes iguales, cada parte se llama porción.\nUna fracción dice cuántas de esas porciones tomamos. Abajo escribimos en cuántas porciones se cortó el entero: es el denominador. Arriba, cuántas porciones tomamos: es el numerador.","predict":{"q":"Una pizza se cortó en 8 trozos iguales y te comiste 2. ¿Qué parte de la pizza te comiste?","opts":["[[2/6]]","[[2/8]]","[[8/2]]"],"why":"Hay 8 trozos iguales en total: es el denominador. Tomaste 2: es el numerador. Sale [[2/8]]."},"explore":["Toca un trozo del pastel para colorearlo. Es un cuarto: [[1/4]].","Colorea dos trozos más. ¿Cuánto hay coloreado ahora? Es [[3/4]].","Con los botones «Porciones» de debajo de la escena, corta el pastel en 8 partes.","Colorea [[5/8]] del pastel."],"explain":"La fracción [[3/4]] se lee «tres cuartos».\nEl denominador (4) indica en cuántas partes **iguales** se dividió el entero. El numerador (3), cuántas de esas partes tomamos.\nSi las partes no son iguales, no se pueden llamar fracción.","formula":"[[3/4]]: se toman 3 porciones de 4","sandbox":"Corta pasteles en cualquier número de porciones y coloréalas. Intenta encontrar dos fracciones distintas que coloreen lo mismo."},"math5.fr02-number-line":{"title":"La fracción en la recta numérica","hook":"¿Dónde vive [[1/2]]? ¡Entre 0 y 1!","page":"Una fracción también es un número. Tiene su propio lugar en la recta numérica.\nPara encontrar [[3/4]], dividimos el segmento de 0 a 1 en 4 partes iguales y contamos tres desde el cero.","predict":{"q":"¿Dónde está [[1/2]] en el segmento de 0 a 1?","opts":["Más cerca de 0","Justo en el medio","Más cerca de 1"],"why":"La mitad divide el segmento en dos partes iguales, así que [[1/2]] está justo en el medio."},"explore":["Arrastra la cuenta hasta [[3/4]]. Con el dedo o con las flechas.","Pulsa «+» junto a «Partes» hasta que haya 8. La cuenta no se movió, pero ahora es [[6/8]].","Esta recta llega hasta 2. Pon la cuenta en [[4/3]], una fracción mayor que uno."],"explain":"Para marcar una fracción, dividimos el segmento de 0 a 1 en tantas partes iguales como indica el denominador y contamos desde el cero tantas partes como indica el numerador.\nSi el numerador es mayor que el denominador, la fracción es mayor que uno y está a la derecha del 1.","sandbox":"Mueve la cuenta y cambia el número de partes. Encuentra en la recta dos escrituras distintas del mismo número."},"math5.fr03-equivalent":{"title":"Fracciones equivalentes","hook":"Media pizza o dos cuartos: ¿qué es más?","page":"La misma parte de un entero se puede escribir con fracciones distintas.\nSi cortamos cada porción por la mitad, hay el doble de porciones, pero también el doble de porciones tomadas.","predict":{"q":"¿Qué es más: [[1/2]] de pastel o [[2/4]] de pastel?","opts":["[[1/2]] es más","Es lo mismo","[[2/4]] es más"],"why":"Dos cuartos forman justo una mitad. Es la misma parte del pastel."},"explore":["A la izquierda está coloreada la mitad. En el segundo pastel, colorea los cuartos necesarios para que haya lo mismo.","Ahora [[1/3]]. ¿Cuántos sextos hay que colorear para que sea lo mismo?","[[2/3]] = ? / 9. Colorea en el segundo pastel los novenos necesarios."],"explain":"Si multiplicamos el numerador y el denominador por el mismo número, la fracción no cambia.\n[[1/2]] = [[2/4]] = [[3/6]] = [[4/8]]. Esto se llama propiedad fundamental de las fracciones.","formula":"[[2/3]] = [[4/6]] = [[6/9]]","sandbox":"Corta pasteles en distinto número de porciones y busca fracciones equivalentes."},"math5.fr04-simplify":{"title":"Simplificar fracciones","hook":"[[6/8]] y [[3/4]] son lo mismo. ¿Cuál es más sencilla?","page":"La propiedad fundamental también funciona al revés: el numerador y el denominador se pueden dividir entre el mismo número.\nEsto se llama simplificar. La fracción se hace más corta, pero la parte del entero es la misma.","predict":{"q":"[[6/8]] de pastel, ¿cuántos cuartos son?","opts":["[[2/4]]","[[3/4]]","[[6/4]]"],"why":"Cada dos octavos forman un cuarto. Seis octavos son tres cuartos."},"explore":["Baja el número de porciones a 4 con el botón «−». Lo coloreado no cambia: [[6/8]] se convierte en [[3/4]].","[[4/10]]: simplifica a quintos, haz 5 porciones."],"explain":"Para simplificar una fracción, dividimos el numerador y el denominador entre un divisor común.\n[[6/8]]: los dos números son divisibles entre 2 y obtenemos [[3/4]]. 3 y 4 no tienen divisores comunes, así que la fracción es irreducible.","formula":"[[6/8]] = [[3/4]]","sandbox":"Intenta simplificar [[8/12]] de pastel bajando el número de porciones."},"math5.fr05-compare":{"title":"Comparar fracciones","hook":"¿Qué es mejor: [[1/3]] de tarta o [[1/5]] de tarta?","page":"Comparar fracciones es fácil si tienen el mismo denominador o el mismo numerador.\nSi todo es distinto, primero hacemos que las porciones sean iguales.","predict":{"q":"¿Qué es mayor: [[1/3]] o [[1/5]]?","opts":["[[1/3]]","Son iguales","[[1/5]]"],"why":"Cuantas más partes tiene el entero, más pequeña es cada una. Un tercio es mayor que un quinto."},"explore":["Los denominadores son iguales: [[2/6]] y [[5/6]]. Es mayor la fracción con más porciones coloreadas.","Los numeradores son iguales: [[1/3]] y [[1/5]]. Compara qué trozo es más grande.","[[2/3]] y [[3/4]]. Corta los dos pasteles en 12 porciones y compara dónde hay más coloreado."],"explain":"Mismo denominador: es mayor la fracción con el numerador mayor.\nMismo numerador: es mayor la fracción con el denominador menor.\nTodo distinto: pasamos a un denominador común y comparamos los numeradores. [[2/3]] = [[8/12]], [[3/4]] = [[9/12]], así que [[3/4]] es mayor.","sandbox":"Haz dos pasteles e intenta colorearlos de modo que las fracciones sean distintas pero lo coloreado sea igual."},"math5.fr06-add-same":{"title":"Suma y resta con el mismo denominador","hook":"Tres octavos más dos octavos, ¿cuántos octavos son?","page":"Cuando las porciones son iguales, sumarlas es fácil: contamos cuántas porciones hay.\nEl tamaño de la porción no cambia, así que el denominador se queda igual.","predict":{"q":"[[3/8]] + [[2/8]] = ?","opts":["[[5/16]]","[[5/8]]","[[6/8]]"],"why":"Sumamos porciones: 3 + 2 = 5 porciones de [[1/8]]. Las porciones no se hicieron más pequeñas, así que el denominador sigue siendo 8."},"explore":["En el primer pastel hay 3 porciones de 8; en el segundo, 2. ¿Cuántas porciones hay en total?","Súmalas en un solo pastel: colorea 3 + 2 porciones.","Resta: había [[5/6]] y se comieron [[3/6]]. Quita el color a tres porciones."],"explain":"Para sumar fracciones con el mismo denominador, sumamos los numeradores y dejamos el denominador.\nCon la resta es igual: restamos los numeradores y el denominador no cambia.","formula":"[[3/8]] + [[2/8]] = [[5/8]]","sandbox":"Inventa tu propia suma y muéstrala con pasteles."},"math5.fr07-common-denominator":{"title":"Denominador común","hook":"¿Cómo sumar una mitad y un tercio si los trozos son de distinto tamaño?","page":"Solo se pueden sumar porciones iguales. Por eso primero cortamos los dos enteros en porciones iguales.\nEl número de porciones que sirve para los dos se llama denominador común.","predict":{"q":"¿Cómo se suman [[1/2]] y [[1/3]]?","opts":["Sumando numeradores y denominadores: [[2/5]]","Cortando los dos pasteles en porciones iguales","No se puede, no se pueden sumar"],"why":"La mitad y el tercio se pueden cortar en sextos: [[1/2]] = [[3/6]], [[1/3]] = [[2/6]]. Ahora las porciones son iguales."},"explore":["Haz el mismo número de porciones en los dos pasteles sin cambiar lo coloreado. Prueba con 6.","[[1/4]] y [[1/6]]: 24 porciones sirven, pero hay un número menor. Encuéntralo."],"explain":"El denominador común es divisible entre los dos denominadores. Lo más cómodo es el menor.\nSe puede encontrar así: escribimos los múltiplos del denominador mayor hasta encontrar uno que también sea divisible entre el menor.\nPara 4 y 6: 6, 12, y sirve 12.","sandbox":"Elige dos fracciones cualesquiera y encuentra su denominador común con los pasteles."},"math5.fr08-add-unlike":{"title":"Suma con distinto denominador","hook":"¿Cuánto es [[1/2]] + [[1/4]]?","page":"Primero pasamos las fracciones a un denominador común y luego sumamos los numeradores.\nSi la respuesta se puede simplificar, la simplificamos.","predict":{"q":"[[1/2]] + [[1/4]] = ?","opts":["[[2/6]]","[[3/4]]","[[2/4]]"],"why":"La mitad son dos cuartos. [[2/4]] + [[1/4]] = [[3/4]]."},"explore":["Corta el primer pastel en cuartos. ¿Cuántos cuartos hay coloreados?","Súmalos en un solo pastel: [[2/4]] + [[1/4]].","[[2/3]] − [[1/2]]: pasa los dos pasteles a sextos y compara."],"explain":"1. Buscamos un denominador común.\n2. Multiplicamos el numerador y el denominador de cada fracción para obtener ese denominador.\n3. Sumamos o restamos los numeradores.\n4. Simplificamos la respuesta si se puede.","formula":"[[2/3]] − [[1/2]] = [[4/6]] − [[3/6]] = [[1/6]]","sandbox":"Compruébalo con los pasteles: ¿[[2/3]] + [[1/4]] = [[11/12]]?"},"math5.fr09-mixed":{"title":"Números mixtos","hook":"Un pastel y medio, ¿cuántas mitades son?","page":"Si hay más porciones de las que caben en un entero, sale una fracción impropia, por ejemplo [[7/4]].\nTambién se puede escribir con una parte entera y una fraccionaria: [[1 3/4]]. Es un número mixto.","predict":{"q":"¿Cuántos cuartos hay en [[1 3/4]]?","opts":["4","7","13"],"why":"En un entero hay 4 cuartos, y 3 más: 7 en total. [[1 3/4]] = [[7/4]]."},"explore":["Un pastel entero y [[3/4]] más. Es el número mixto [[1 3/4]], o [[7/4]].","Haz [[2 2/3]]: colorea en el tercer pastel las porciones necesarias. ¿Cuántos tercios hay en total?"],"explain":"De número mixto a fracción: multiplicamos la parte entera por el denominador y sumamos el numerador.\nDe fracción a número mixto: dividimos el numerador entre el denominador con resto. El cociente es la parte entera y el resto, el nuevo numerador.","formula":"[[2 2/3]] = [[8/3]]","sandbox":"Forma un número mixto con pasteles y escríbelo como fracción impropia."},"math5.fr10-of-number":{"title":"Fracción de un número","hook":"Una tableta de chocolate tiene 12 cuadritos. ¿Cuántos son dos tercios?","page":"Para hallar la fracción de un número, dividimos el número entre el denominador: así obtenemos una parte.\nLuego multiplicamos por el numerador: tomamos las partes necesarias.","predict":{"q":"Una tableta de chocolate tiene 12 cuadritos. ¿Cuántos cuadritos hay en [[2/3]] de la tableta?","opts":["6","8","9"],"why":"Un tercio de 12 son 4 cuadritos. Dos tercios son 8 cuadritos."},"explore":["La tableta está dividida en 3 tiras iguales. Parte [[2/3]]: toca 2 tiras.","20 cuadritos, 4 tiras. Parte [[3/4]]. ¿Cuántos cuadritos son?"],"explain":"Para hallar la fracción de un número, primero dividimos el número entre el denominador y luego multiplicamos por el numerador.\n[[2/3]] de 12: 12 : 3 = 4, 4 · 2 = 8.","formula":"[[2/3]] de 12 = 12 : 3 · 2 = 8","sandbox":"Parte tiras y cuenta: ¿qué parte de la tableta tienes y cuántos cuadritos son?"},"math5.fr11-decimals":{"title":"Números decimales","hook":"¡[[3/10]] se puede escribir más corto!","page":"Las fracciones con denominador 10, 100 o 1000 se escriben cómodamente con coma.\n[[3/10]] = 0,3: tres décimas. [[7/100]] = 0,07: siete centésimas.","predict":{"q":"¿De qué otra forma se puede escribir [[3/10]]?","opts":["3,10","0,3","0,03"],"why":"Las décimas se escriben en el primer lugar después de la coma: [[3/10]] = 0,3."},"explore":["El segmento de 0 a 1 está dividido en 10 partes. Pon la cuenta en 0,7, que es [[7/10]].","¿Dónde está 0,5? Fíjate: también es la mitad."],"explain":"La primera cifra después de la coma son las décimas; la segunda, las centésimas.\n[[45/100]] = 0,45. [[5/100]] = 0,05: el cero de las décimas es obligatorio.","formula":"[[7/10]] = 0,7   [[7/100]] = 0,07","sandbox":"Mueve la cuenta y mira cómo cambia la escritura decimal."},"math5.fr12-mission":{"title":"Misión final: fracciones","hook":"Seis ejercicios sobre todo lo que aprendiste de las fracciones.","page":"En esta misión hay ejercicios de distintas lecciones: leer una fracción, encontrarla en la recta, simplificar, comparar, sumar y hallar la fracción de un número.\nSi olvidaste algo, las pistas te ayudarán.","predict":{"q":"¿Qué fracción es mayor que uno?","opts":["[[7/8]]","[[8/8]]","[[9/8]]"],"why":"[[8/8]] es exactamente un pastel entero. [[9/8]] es un pastel entero y un octavo más."},"explore":["Calentamiento: colorea [[9/8]] con dos pasteles."],"explain":"Chuleta.\nEl numerador es cuántas porciones tomamos; el denominador, en cuántas porciones se dividió el entero.\nSe puede multiplicar o dividir el numerador y el denominador por el mismo número: la fracción no cambia.\nSolo se pueden sumar porciones iguales.","sandbox":"Juego libre con pasteles: inventa un ejercicio para un amigo."},"phys7.f01-force":{"title":"¿Qué es una fuerza?","hook":"¿Por qué una caja se mueve si tiras de ella y se queda quieta si tiran de los dos lados?","page":"Una fuerza es la acción de un cuerpo sobre otro. Una fuerza puede mover un cuerpo, detenerlo o cambiar su forma.\nLa fuerza se mide en newtons (N). En los dibujos la fuerza se representa con una flecha: la dirección de la flecha indica hacia dónde actúa la fuerza y su longitud, lo grande que es.","predict":{"q":"Dos personas tiran de una caja en sentidos opuestos con la misma fuerza. ¿Qué pasará?","opts":["Se moverá a la izquierda","Se quedará quieta","Se moverá a la derecha"],"why":"Fuerzas iguales en sentidos opuestos se equilibran. La caja se queda quieta."},"explore":["Tiran de la caja con 20 N a la izquierda y a la derecha. Las flechas miden lo mismo y la caja está quieta.","Aumenta la fuerza de la derecha a 40 N. ¿Hacia dónde se movió la caja?","Ahora equilibra la caja: haz que la fuerza de la izquierda sea igual."],"explain":"Una fuerza tiene tamaño y dirección.\nLa unidad de fuerza es el newton (N). La Tierra atrae una manzana de 100 g con una fuerza de aproximadamente 1 N.","sandbox":"Cambia las fuerzas de la izquierda y la derecha y mira hacia dónde va la caja."},"phys7.f02-gravity":{"title":"La fuerza de gravedad","hook":"¿Por qué todo cae hacia abajo y por qué en la Luna es más fácil saltar?","page":"La Tierra atrae hacia sí todos los cuerpos. Esta fuerza se llama fuerza de gravedad.\nCuanto mayor es la masa de un cuerpo, con más fuerza lo atrae la Tierra. En otros planetas la atracción es distinta.","predict":{"q":"¿Qué caja atrae la Tierra con más fuerza?","opts":["La de 1 kg","Las dos igual","La de 10 kg"],"why":"La fuerza de gravedad es proporcional a la masa: 10 kg se atraen 10 veces más que 1 kg."},"explore":["Aumenta la masa de la caja a 10 kg. Mira la flecha y el número.","Lleva la caja a la Luna. La masa es la misma, ¿y la fuerza?","Y ahora a Júpiter."],"explain":"Fuerza de gravedad: F = m · g.\nm es la masa en kilogramos; g, cuántos newtons corresponden a cada kilogramo. En la Tierra g ≈ 9,8 N/kg, y en los ejercicios se usa 10 N/kg.\nEn la Luna g ≈ 1,6 N/kg, por eso allí todo cuesta unas 6 veces menos levantarlo.","formula":"F = m · g","sandbox":"Elige la masa y el planeta. ¿Dónde te resultaría más fácil saltar?"},"phys7.f03-spring":{"title":"La fuerza elástica","hook":"¿Cómo sabe un resorte qué peso cuelga de él?","page":"Si estiramos o comprimimos un resorte, aparece en él una fuerza elástica. Esta fuerza intenta devolver al resorte su forma original.\nCuanto más se estira el resorte, mayor es la fuerza elástica. Así funciona el dinamómetro, un instrumento para medir fuerzas.","predict":{"q":"Con una pesa el resorte se estiró 2 cm. ¿Cuánto se estirará con tres pesas iguales?","opts":["3 cm","6 cm","9 cm"],"why":"El estiramiento es proporcional a la fuerza: el triple de peso da el triple de estiramiento, 6 cm."},"explore":["Cuelga una pesa de 100 g: sobre ella actúa una fuerza de gravedad de 1 N. Toca la pila de pesas de la mesa.","Añade dos pesas más. ¿Cuántas veces creció el estiramiento?","Toma un resorte más rígido: 100 N/m. ¿Qué pasó con el estiramiento?"],"explain":"Ley de Hooke: la fuerza elástica es proporcional al estiramiento.\nF = k · Δl, donde Δl es el estiramiento en metros y k es la constante elástica del resorte en N/m.\nUn resorte rígido se estira menos con la misma fuerza.","formula":"F = k · Δl","sandbox":"Cuelga pesas y cambia de resorte. Haz tu propio dinamómetro: recuerda cuántos centímetros da 1 N."},"phys7.f04-weight":{"title":"El peso","hook":"¿La masa y el peso son lo mismo?","page":"El peso es la fuerza con la que un cuerpo presiona sobre su apoyo o estira aquello de lo que cuelga. El peso se mide en newtons, y la masa, en kilogramos.\nSi el cuerpo y el apoyo están quietos, el peso es igual a la fuerza de gravedad: P = m · g.","predict":{"q":"Una manzana tiene una masa de 200 g. ¿Cuál es su peso en la Tierra?","opts":["200 N","2 N","0,2 N"],"why":"200 g = 0,2 kg. P = 0,2 kg · 10 N/kg = 2 N."},"explore":["Pon 1 kg sobre el apoyo. El peso es la fuerza con la que la caja presiona el apoyo.","Lleva la caja a la Luna. La masa es la misma, pero el peso es unas 6 veces menor."],"explain":"La masa indica cuánta materia hay en un cuerpo y no depende del planeta.\nEl peso es una fuerza y depende de g: P = m · g.\nEn la Luna tu masa es la misma, pero tu peso es 6 veces menor.","formula":"P = m · g","sandbox":"Compara el peso de la misma caja en distintos planetas."},"phys7.f05-friction":{"title":"La fuerza de rozamiento","hook":"¿Por qué cuesta tanto mover un armario pesado?","page":"Cuando un cuerpo se desliza sobre otro, aparece una fuerza de rozamiento. Va en contra del movimiento.\nEl rozamiento depende de las superficies y de lo fuerte que el cuerpo presiona sobre su apoyo.","predict":{"q":"Alguien tira de una caja, pero no se mueve. ¿Por qué?","opts":["El tirón es mayor que el rozamiento","El rozamiento equilibra el tirón","Sobre la caja no actúa nada"],"why":"Mientras la caja está quieta, el rozamiento estático es igual al tirón y lo equilibra."},"explore":["Tira del anillo azul del dinamómetro o pulsa «+». ¿Con qué fuerza empieza a moverse la caja?","Pon la caja sobre hielo. ¿Cuánta fuerza hace falta ahora para moverla?","Aumenta la masa a 10 kg. ¿Cómo cambió el rozamiento?"],"explain":"Rozamiento por deslizamiento: F = μ · N.\nN es la fuerza con la que el cuerpo presiona su apoyo. En un suelo horizontal N = m · g.\nμ es el coeficiente de rozamiento: en el hielo es pequeño y en la goma, grande.","formula":"F = μ · m · g","sandbox":"Prueba todas las superficies y distintas masas. ¿Dónde es menor el rozamiento?"},"phys7.f06-sum":{"title":"Suma de fuerzas","hook":"Si tiran dos personas, ¿la fuerza es el doble?","page":"Si sobre un cuerpo actúan varias fuerzas, se pueden sustituir por una sola: la fuerza resultante.\nLas fuerzas en el mismo sentido se suman. Las fuerzas en sentidos opuestos se restan, y la resultante va hacia el lado de la mayor.","predict":{"q":"Dos personas tiran de una caja hacia la derecha: una con 30 N y otra con 20 N. ¿Con qué fuerza tiran juntas?","opts":["10 N","50 N","600 N"],"why":"Las fuerzas van en el mismo sentido, así que se suman: 30 + 20 = 50 N."},"explore":["Ahora tiran de la caja hacia la derecha con 30 N. Añade otros 20 N a la derecha.","30 N a la izquierda y 50 N a la derecha. La resultante es 20 N hacia la derecha: la mayor menos la menor.","Aumenta la fuerza de la izquierda a 50 N. ¿Qué pasó con la resultante?"],"explain":"Fuerzas sobre una misma recta:\nen el mismo sentido: R = F₁ + F₂;\nen sentidos opuestos: R = mayor − menor, hacia el lado de la mayor.\nSi R = 0, el cuerpo se comporta como si no hubiera fuerzas.","sandbox":"Elige las fuerzas para que la resultante sea 10 N hacia la izquierda."},"phys7.f07-balance":{"title":"Equilibrio","hook":"¿Por qué no se cae una lámpara colgada?","page":"Un cuerpo está en equilibrio si todas las fuerzas que actúan sobre él se equilibran. Entonces la resultante es cero.\nUn cuerpo en reposo sigue en reposo, y uno en movimiento se mueve a velocidad constante.","predict":{"q":"Una caja está quieta. Eso significa que sobre ella…","opts":["No actúa ninguna fuerza","Actúan fuerzas equilibradas","Solo actúa la gravedad"],"why":"Sobre la caja siempre actúa la gravedad. Está quieta porque el apoyo la equilibra."},"explore":["60 N a la izquierda y 20 N a la derecha. Equilibra la caja añadiendo fuerza a la derecha.","Una pesa cuelga quieta de un resorte: la fuerza elástica hacia arriba es igual a la gravedad hacia abajo."],"explain":"Equilibrio: la resultante de todas las fuerzas es cero.\nPara una pesa en un resorte: k · Δl = m · g.\nPara una caja de la que tiran por los dos lados: F izquierda = F derecha.","sandbox":"Consigue el equilibrio de la caja con distintas fuerzas."},"phys7.f08-mission":{"title":"Misión final: fuerzas","hook":"Seis ejercicios para una ingeniera o un ingeniero de verdad.","page":"En la misión aparecen la gravedad, los resortes, el rozamiento y la suma de fuerzas.\nEn todos los ejercicios g = 10 N/kg, salvo que se diga otra cosa. Las pistas están a mano.","predict":{"q":"Una astronauta levanta una pesa en la Luna. ¿Qué cambió en comparación con la Tierra?","opts":["La masa de la pesa","El peso de la pesa","La masa y el peso"],"why":"La masa no depende del planeta. Cambia el peso, porque en la Luna g es menor."},"explore":["Lleva una pesa de 20 kg a Marte y mira la fuerza de gravedad."],"explain":"Chuleta.\nF = m · g: fuerza de gravedad.\nF = k · Δl: fuerza elástica (Δl en metros).\nF = μ · m · g: rozamiento por deslizamiento.\nLas fuerzas en el mismo sentido se suman; en sentidos opuestos, se restan.","sandbox":"Laboratorio libre: arrastra la caja por hielo y por goma."}}},"ar":{"ui":{"langName":"العربية","appTitle":"School Cool — نسخة تجريبية","hello":"تعلَّم بيديك","pilotIntro":"نسخة School Cool التجريبية: وحدتان و20 درسًا. في كل درس صفحة من كتاب وتجربة ثلاثية الأبعاد وقاعدة وتمارين مع تلميحات.","pilotNote":"هذه نسخة تجريبية. أعدّ الذكاء الاصطناعي الدروس والمشاهد الثلاثية الأبعاد والترجمات؛ وقبل عرضها على الأطفال سيراجع معلمون ومتحدثون أصليون عيّنة منها.","curriculum":"المنهج","noMap":"لا يوجد ربط بهذا المنهج","sparks":"شرارات مقابل التمارين المحلولة","language":"اللغة","theme":"مظهر فاتح أو داكن","scene":"مشهد ثلاثي الأبعاد","steps":"خطوات الدرس","step":{"page":"الصفحة","predict":"توقَّع","explore":"استكشف","explain":"افهم","tasks":"تمارين","sandbox":"مختبر حر"},"next":"التالي","back":"رجوع","reset":"من البداية","toCatalog":"الدرس التالي","predictRight":"صحيح!","predictCheck":"هيا نتحقق","goalTodo":"افعل ذلك في المشهد","goalDone":"أحسنت!","summary":"التمارين المحلولة: {s} من {n}.","answer":"الإجابة","whole":"العدد الصحيح","numerator":"البسط","denominator":"المقام","sceneAnswer":"أجب مباشرة في المشهد الثلاثي الأبعاد، ثم اضغط «تحقَّق».","check":"تحقَّق","hint":"تلميح {n}","hintN":"تلميح {n}","noMoreHints":"لا توجد تلميحات أخرى","solution":"شرح الحل","another":"تمرين آخر","typeAnswer":"اكتب إجابتك أولًا.","right":"اليمين","correct":"إجابة صحيحة!","sparkPlus":"+1 شرارة","nextTask":"التمرين التالي","notYet":"ليس بعد","wrong":"تحقَّق مرة أخرى. التلميح سيساعدك.","level1":"مبتدئ","level2":"متوسط","level3":"متقدم","unitN":"N","unitKg":"kg","unitNkg":"N/kg","unitCm":"cm","unitNm":"N/m","slices":"القطع","clear":"مسح","parts":"الأجزاء","point":"الخرزة","mass":"الكتلة","weights":"الأثقال","pull":"قوة السحب","friction":"الاحتكاك","sliding":"ينزلق","left":"اليسار","dir_left":"نحو اليسار","dir_right":"نحو اليمين","balanced":"القوى متوازنة","resultant":"القوة المحصلة","planets":{"earth":"الأرض","moon":"القمر","mars":"المريخ","jupiter":"المشتري"},"surfaces":{"ice":"جليد","wood":"خشب","rubber":"مطاط"}},"curricula":{"ru-fgos":{"name":"روسيا · FGOS","grade":"الصف {g}","units":{"math5-fractions":"الكسور العادية","phys7-forces":"تفاعل الأجسام"}},"us-ccss":{"name":"الولايات المتحدة · Common Core وNGSS","grade":"الصف {g}","units":{"math5-fractions":"الأعداد والعمليات: الكسور","phys7-forces":"القوى والتفاعلات"}},"in-ncert":{"name":"الهند · NCERT","grade":"الصف {g}","units":{"math5-fractions":"الكسور","phys7-forces":"القوة والضغط، الاحتكاك"}}},"units":{"math5-fractions":{"title":"الكسور"},"phys7-forces":{"title":"القوى"}},"tasks":{"frac.read":{"prompt":"ما الجزء الملوَّن من الفطيرة؟ اكتبه على صورة كسر.","h1":"عُدّ القطع المتساوية التي قُسِّمت إليها الفطيرة. هذا هو المقام، العدد الذي تحت الخط.","h2":"الآن عُدّ القطع الملوّنة. هذا هو البسط، العدد الذي فوق الخط.","h3":"الفطيرة مقسّمة إلى {n} قطع، والملوّن منها {k}.","sol":"عدد القطع كلها {n}، والملوّن منها {k}. إذن الملوّن هو [[k/n]] من الفطيرة.","err":{"flip":"تبادل البسط والمقام مكانيهما. في الأعلى نكتب عدد القطع التي أخذناها، وفي الأسفل عدد القطع التي قُسِّم إليها الكل.","unshaded":"لقد عددت القطع غير الملوّنة. المطلوب عدّ القطع الملوّنة."}},"frac.shade":{"prompt":"لوِّن [[k/n]] من الفطيرة. إذا احتجت، غيِّر عدد القطع بالأزرار تحت المشهد.","h1":"المقام {n} يخبرك بعدد القطع المتساوية التي تُقسَّم إليها الفطيرة.","h2":"البسط {k} يخبرك بعدد القطع التي تُلوَّن.","h3":"اجعل الفطيرة {n} قطع واضغط على {k} منها.","sol":"نقسّم الفطيرة إلى {n} قطع متساوية ونلوّن {k}. هذا هو [[k/n]].","err":{"slices":"تحقَّق من عدد القطع: من أجل [[k/n]] تُقسَّم الفطيرة إلى {n} أجزاء متساوية.","count":"عدد القطع صحيح، لكن الملوّن ليس {k}. أعد عدّ القطع الملوّنة."}},"frac.numline":{"prompt":"ما الكسر الذي تشير إليه الخرزة على المستقيم؟","h1":"انظر إلى عدد الأجزاء المتساوية التي قُسِّمت إليها القطعة من 0 إلى 1. عُدّ المسافات لا العلامات.","h2":"القطعة من 0 إلى 1 مقسّمة إلى {n} أجزاء. هذا هو المقام.","h3":"عُدّ كم جزءًا من هذه الأجزاء يوجد من 0 حتى الخرزة.","sol":"كل جزء يساوي [[1/n]]. من 0 حتى الخرزة {k} أجزاء، إذن هذا [[k/n]].","err":{"ticks":"يبدو أنك عددت العلامات لا المسافات بينها. عدد الأجزاء أقل من عدد العلامات بواحد.","flip":"تبادل البسط والمقام مكانيهما."}},"frac.place":{"prompt":"ضع الخرزة على [[k/n]]. اسحبها بإصبعك أو استخدم الأسهم تحت المشهد.","h1":"أولًا اجعل القطعة من 0 إلى 1 مقسّمة إلى {n} أجزاء.","h2":"كل جزء يساوي [[1/n]].","h3":"عُدّ {k} أجزاء بدءًا من الصفر.","sol":"نقسّم القطعة من 0 إلى 1 إلى {n} أجزاء متساوية ونعدّ {k} منها بدءًا من الصفر.","err":{"offByOne":"اقتربت! الخرزة على العلامة المجاورة. أعد عدّ الأجزاء من الصفر."}},"frac.equiv":{"prompt":"ما العدد الذي يوضع مكان علامة الاستفهام؟ [[a/b]] = ? / {bm}","h1":"كم مرة يكون {bm} أكبر من {b}؟","h2":"ضُرِب المقام في {m}. لكي لا يتغيّر الكسر، نضرب البسط في العدد نفسه.","h3":"{a} × {m} = ?","sol":"{bm} = {b} × {m}، لذلك نضرب البسط أيضًا في {m}: {a} × {m} = {am}. إذن [[a/b]] = [[am/bm]].","err":{"add":"أضفت إلى البسط ما أضفته إلى المقام. بهذا يتغيّر الكسر. يجب ضرب البسط والمقام في العدد نفسه.","same":"كبر المقام، أي أن القطع صارت أصغر. لكي يبقى الجزء نفسه، يجب أن يكبر البسط أيضًا."}},"frac.simplify":{"prompt":"اختصر الكسر [[ag/bg]] إلى أبسط صورة.","h1":"ابحث عن عدد يقسم {ag} و{bg} كليهما.","h2":"جرِّب قسمة العددين على {g}.","h3":"{ag} ÷ {g} = ?   {bg} ÷ {g} = ?","sol":"{ag} و{bg} يقبلان القسمة على {g}: [[ag/bg]] = [[a/b]]. لا يمكن الاختصار أكثر.","err":{"notLowest":"الكسر مساوٍ للمطلوب، لكن يمكن اختصاره أكثر. ابحث عن قاسم مشترك للبسط والمقام."}},"frac.compare":{"prompt":"قارن بين الكسرين: [[a/b]] ? [[c/d]]","h1":"إذا تساوى المقامان، فالكسر الأكبر هو صاحب البسط الأكبر.","h2":"إذا تساوى البسطان، فالكسر الأكبر هو صاحب المقام الأصغر: قطعه أكبر.","h3":"إذا اختلف كل شيء، فوحِّد المقامين إلى {l}: تحصل على [[al/l]] و[[cl/l]].","sol":"نوحّد المقام إلى {l}: [[a/b]] = [[al/l]]، [[c/d]] = [[cl/l]]. نقارن البسطين {al} و{cl}.","err":{"bigDen":"البسطان متساويان والمقام أكبر، أي أن القطع أصغر. هذا الكسر أصغر لا أكبر."}},"frac.addSame":{"prompt":"اجمع: بسطان متساويان: الكسر الأكبر صاحب المقام الأصغر.\nكل شيء مختلف: نوحّد المقامين ونقارن البسطين. [[2/3]] = [[8/12]]، [[3/4]] = [[9/12]]، إذن [[3/4]] أكبر.","sandbox":"اصنع فطيرتين وحاول تلوينهما بحيث يختلف الكسران ويتساوى الملوّن."},"math5.fr06-add-same":{"title":"الجمع والطرح بمقامات متساوية","hook":"ثلاثة أثمان زائد ثُمنين، كم ثُمنًا؟","page":"عندما تكون الحصص متساوية، يكون جمعها سهلًا: نعدّ كم حصة أصبح لدينا.\nحجم الحصة لا يتغيّر، لذلك يبقى المقام كما هو.","predict":{"q":"[[3/8]] + [[2/8]] = ?","opts":["[[5/16]]","[[5/8]]","[[6/8]]"],"why":"نجمع الحصص: 3 + 2 = 5 حصص من [[1/8]]. الحصص لم تصغر، لذلك يبقى المقام 8."},"explore":["في الفطيرة الأولى 3 حصص من 8، وفي الثانية 2. كم حصة معًا؟","اجمعها في فطيرة واحدة: لوِّن 3 + 2 حصص.","الطرح: كان لدينا [[5/6]]، وأُكل [[3/6]]. أزِل التلوين عن ثلاث حصص."],"explain":"لجمع كسور لها المقام نفسه، نجمع البسوط ونُبقي المقام.\nوالطرح كذلك: نطرح البسوط ولا يتغيّر المقام.","formula":"[[3/8]] + [[2/8]] = [[5/8]]","sandbox":"اخترع مسألة جمع خاصة بك واعرضها بالفطائر."},"math5.fr07-common-denominator":{"title":"المقام المشترك","hook":"كيف نجمع نصفًا وثلثًا إذا كانت القطع مختلفة الحجم؟","page":"لا يمكن جمع إلا الحصص المتساوية. لذلك نقسم الكلّين أولًا إلى حصص متساوية.\nعدد الحصص الذي يناسب الاثنين يسمّى المقام المشترك.","predict":{"q":"كيف نجمع [[1/2]] و[[1/3]]؟","opts":["نجمع البسطين والمقامين: [[2/5]]","نقسم الفطيرتين إلى حصص متساوية","لا يمكن جمعهما"],"why":"يمكن تقسيم النصف والثلث إلى أسداس: [[1/2]] = [[3/6]]، [[1/3]] = [[2/6]]. الآن الحصص متساوية."},"explore":["اجعل عدد القطع في الفطيرتين متساويًا دون أن يتغيّر الملوّن. جرِّب 6.","[[1/4]] و[[1/6]]: 24 قطعة تصلح، لكن يوجد عدد أصغر. اعثر عليه."],"explain":"المقام المشترك يقبل القسمة على المقامين كليهما. الأنسب هو الأصغر.\nيمكن إيجاده هكذا: نكتب مضاعفات المقام الأكبر حتى نجد عددًا يقبل القسمة على الأصغر أيضًا.\nللعددين 4 و6: ‏6، 12، ويصلح 12.","sandbox":"اختر أي كسرين وأوجد لهما مقامًا مشتركًا بالفطائر."},"math5.fr08-add-unlike":{"title":"الجمع بمقامات مختلفة","hook":"كم يساوي [[1/2]] + [[1/4]]؟","page":"أولًا نوحّد مقامات الكسور، ثم نجمع البسوط.\nإذا أمكن اختصار الناتج، نختصره.","predict":{"q":"[[1/2]] + [[1/4]] = ?","opts":["[[2/6]]","[[3/4]]","[[2/4]]"],"why":"النصف ربعان. [[2/4]] + [[1/4]] = [[3/4]]."},"explore":["قسِّم الفطيرة الأولى إلى أرباع. كم ربعًا ملوّنًا؟","اجمع في فطيرة واحدة: [[2/4]] + [[1/4]].","[[2/3]] − [[1/2]]: اجعل الفطيرتين أسداسًا وقارن."],"explain":"1. نوجد المقام المشترك.\n2. نضرب بسط كل كسر ومقامه لنحصل على هذا المقام.\n3. نجمع البسوط أو نطرحها.\n4. نختصر الناتج إذا أمكن.","formula":"[[2/3]] − [[1/2]] = [[4/6]] − [[3/6]] = [[1/6]]","sandbox":"تحقَّق بالفطائر: هل [[2/3]] + [[1/4]] = [[11/12]]؟"},"math5.fr09-mixed":{"title":"الأعداد الكسرية","hook":"فطيرة ونصف، كم نصفًا؟","page":"إذا كانت الحصص أكثر مما يتّسع له الكل الواحد، نحصل على كسر غير فعلي، مثل [[7/4]].\nيمكن كتابته بطريقة أخرى: عدد صحيح وجزء كسري، [[1 3/4]]. هذا عدد كسري.","predict":{"q":"كم ربعًا في [[1 3/4]]؟","opts":["4","7","13"],"why":"في الواحد الصحيح 4 أرباع، وثلاثة أخرى: المجموع 7. [[1 3/4]] = [[7/4]]."},"explore":["فطيرة كاملة و[[3/4]] أخرى. هذا العدد الكسري [[1 3/4]]، أو [[7/4]].","اصنع [[2 2/3]]: لوِّن في الفطيرة الثالثة العدد المطلوب من القطع. كم ثلثًا في المجموع؟"],"explain":"من عدد كسري إلى كسر: نضرب العدد الصحيح في المقام ونضيف البسط.\nمن كسر إلى عدد كسري: نقسم البسط على المقام مع باقٍ. ناتج القسمة هو العدد الصحيح، والباقي هو البسط الجديد.","formula":"[[2 2/3]] = [[8/3]]","sandbox":"كوِّن عددًا كسريًا من الفطائر واكتبه على صورة كسر غير فعلي."},"math5.fr10-of-number":{"title":"كسر من عدد","hook":"في لوح الشوكولاتة 12 مربعًا. كم مربعًا في ثلثيه؟","page":"لإيجاد كسر من عدد، نقسم العدد على المقام فنحصل على حصة واحدة.\nثم نضرب في البسط لنأخذ العدد المطلوب من الحصص.","predict":{"q":"في لوح الشوكولاتة 12 مربعًا. كم مربعًا في [[2/3]] اللوح؟","opts":["6","8","9"],"why":"ثلث 12 يساوي 4 مربعات. والثلثان 8 مربعات."},"explore":["لوح الشوكولاتة مقسّم إلى 3 شرائط متساوية. اكسر [[2/3]]: اضغط على شريطين.","20 مربعًا، 4 شرائط. اكسر [[3/4]]. كم مربعًا هذا؟"],"explain":"لإيجاد كسر من عدد، نقسم العدد على المقام أولًا، ثم نضرب في البسط.\n[[2/3]] من 12: ‏12 ÷ 3 = 4، ‏4 × 2 = 8.","formula":"[[2/3]] من 12 = 12 ÷ 3 × 2 = 8","sandbox":"اكسر الشرائط وعُدّ: ما الجزء الذي لديك من اللوح، وكم مربعًا فيه؟"},"math5.fr11-decimals":{"title":"الكسور العشرية","hook":"يمكن كتابة [[3/10]] بشكل أقصر!","page":"الكسور التي مقامها 10 أو 100 أو 1000 يسهل كتابتها بفاصلة عشرية.\n[[3/10]] = 0.3، ثلاثة أعشار. [[7/100]] = 0.07، سبعة أجزاء من مئة.","predict":{"q":"كيف يمكن كتابة [[3/10]] بطريقة أخرى؟","opts":["3.10","0.3","0.03"],"why":"الأعشار تُكتب في المنزلة الأولى بعد الفاصلة: [[3/10]] = 0.3."},"explore":["القطعة من 0 إلى 1 مقسّمة إلى 10 أجزاء. ضع الخرزة على 0.7، أي [[7/10]].","أين 0.5؟ لاحظ: إنه النصف أيضًا."],"explain":"الرقم الأول بعد الفاصلة للأعشار، والثاني للأجزاء من مئة.\n[[45/100]] = 0.45. [[5/100]] = 0.05: الصفر في منزلة الأعشار ضروري.","formula":"[[7/10]] = 0.7   [[7/100]] = 0.07","sandbox":"حرِّك الخرزة وشاهد كيف تتغيّر الكتابة العشرية."},"math5.fr12-mission":{"title":"المهمة الختامية: الكسور","hook":"ست مسائل في كل ما تعلّمته عن الكسور.","page":"في هذه المهمة مسائل من دروس مختلفة: قراءة كسر، وإيجاده على المستقيم، واختصاره، ومقارنته، وجمعه، وإيجاد كسر من عدد.\nإذا نسيت شيئًا، فالتلميحات ستساعدك.","predict":{"q":"أي كسر أكبر من الواحد؟","opts":["[[7/8]]","[[8/8]]","[[9/8]]"],"why":"[[8/8]] فطيرة كاملة تمامًا. و[[9/8]] فطيرة كاملة وثُمن آخر."},"explore":["تمرين إحماء: لوِّن [[9/8]] في فطيرتين."],"explain":"ملخّص سريع.\nالبسط عدد الحصص التي أخذناها، والمقام عدد الحصص التي قُسِّم إليها الكل.\nيجوز ضرب البسط والمقام أو قسمتهما على العدد نفسه: الكسر لا يتغيّر.\nلا يمكن جمع إلا الحصص المتساوية.","sandbox":"لعب حر بالفطائر: اخترع مسألة لصديقك."},"phys7.f01-force":{"title":"ما القوة؟","hook":"لماذا يتحرك الصندوق إذا سحبناه، ويبقى مكانه إذا سُحب من الجهتين؟","page":"القوة هي تأثير جسم في جسم آخر. يمكن للقوة أن تحرّك الجسم أو توقفه أو تغيّر شكله.\nتُقاس القوة بالنيوتن. في الرسوم تُمثَّل القوة بسهم: اتجاه السهم يبيّن اتجاه تأثير القوة، وطوله يبيّن مقدارها.","predict":{"q":"شخصان يسحبان صندوقًا في اتجاهين متعاكسين بالقوة نفسها. ماذا سيحدث؟","opts":["سيتحرك نحو اليسار","سيبقى في مكانه","سيتحرك نحو اليمين"],"why":"القوى المتساوية في اتجاهين متعاكسين توازن بعضها. الصندوق يبقى ساكنًا."},"explore":["يُسحب الصندوق من اليسار ومن اليمين بقوة 20 N. السهمان بالطول نفسه، والصندوق ساكن.","زِد القوة من اليمين إلى 40 N. إلى أين تحرّك الصندوق؟","الآن وازن الصندوق: اجعل القوة من اليسار مساوية لها."],"explain":"للقوة مقدار واتجاه.\nوحدة القوة هي النيوتن. تجذب الأرض تفاحة كتلتها 100 g بقوة تقارب 1 N.","sandbox":"غيِّر القوتين من اليسار واليمين وشاهد إلى أين يتحرك الصندوق."},"phys7.f02-gravity":{"title":"قوة الجاذبية","hook":"لماذا يسقط كل شيء إلى الأسفل، ولماذا القفز على القمر أسهل؟","page":"تجذب الأرض جميع الأجسام نحوها. تسمّى هذه القوة قوة الجاذبية.\nكلما زادت كتلة الجسم، زادت قوة جذب الأرض له. وعلى الكواكب الأخرى يختلف الجذب.","predict":{"q":"أي صندوق تجذبه الأرض بقوة أكبر؟","opts":["الذي كتلته 1 kg","بالقوة نفسها","الذي كتلته 10 kg"],"why":"قوة الجاذبية تتناسب مع الكتلة: 10 kg تُجذب بقوة أكبر بعشر مرات من 1 kg."},"explore":["زِد كتلة الصندوق إلى 10 kg. انظر إلى السهم والعدد.","انقل الصندوق إلى القمر. الكتلة نفسها، فماذا عن القوة؟","والآن إلى المشتري."],"explain":"قوة الجاذبية: F = m · g.\nm الكتلة بالكيلوغرام، وg عدد النيوتنات لكل كيلوغرام. على الأرض g ≈ 9.8 N/kg، وفي المسائل نأخذ 10 N/kg.\nعلى القمر g ≈ 1.6 N/kg، لذلك يسهل رفع كل شيء هناك بنحو 6 مرات.","formula":"F = m · g","sandbox":"اختر الكتلة والكوكب. أين سيكون القفز أسهل عليك؟"},"phys7.f03-spring":{"title":"قوة المرونة","hook":"كيف يعرف النابض أي ثقل معلَّق به؟","page":"إذا شددنا نابضًا أو ضغطناه، تنشأ فيه قوة مرونة تسعى إلى إعادته إلى شكله الأصلي.\nكلما زادت استطالة النابض، زادت قوة المرونة. وعلى هذا يعمل الدينامومتر، وهو أداة لقياس القوة.","predict":{"q":"مع ثقل واحد استطال النابض 2 cm. كم سيستطيل مع ثلاثة أثقال مماثلة؟","opts":["3 cm","6 cm","9 cm"],"why":"الاستطالة تتناسب مع القوة: ثلاثة أضعاف الثقل تعطي ثلاثة أضعاف الاستطالة، 6 cm."},"explore":["علِّق ثقلًا كتلته 100 g، تؤثر فيه قوة جاذبية 1 N. اضغط على كومة الأثقال على الطاولة.","أضِف ثقلين آخرين. كم مرة زادت الاستطالة؟","خذ نابضًا أكثر صلابة: 100 N/m. ماذا حدث للاستطالة؟"],"explain":"قانون هوك: قوة المرونة تتناسب مع الاستطالة.\nF = k · Δl، حيث Δl الاستطالة بالمتر وk ثابت مرونة النابض بوحدة N/m.\nالنابض الصلب يستطيل أقل تحت القوة نفسها.","formula":"F = k · Δl","sandbox":"علِّق الأثقال وبدِّل النوابض. اصنع دينامومترك الخاص: تذكَّر كم سنتيمترًا يعطي 1 N."},"phys7.f04-weight":{"title":"وزن الجسم","hook":"هل الكتلة والوزن شيء واحد؟","page":"الوزن هو القوة التي يضغط بها الجسم على ما يرتكز عليه أو يشدّ بها ما يُعلَّق به. يُقاس الوزن بالنيوتن، والكتلة بالكيلوغرام.\nإذا كان الجسم والسطح الذي يرتكز عليه ساكنين، فالوزن يساوي قوة الجاذبية: P = m · g.","predict":{"q":"كتلة تفاحة 200 g. ما وزنها على الأرض؟","opts":["200 N","2 N","0.2 N"],"why":"200 g = 0.2 kg. P = 0.2 kg × 10 N/kg = 2 N."},"explore":["ضع 1 kg على السطح. الوزن هو القوة التي يضغط بها الصندوق على السطح.","انقل الصندوق إلى القمر. الكتلة نفسها، لكن الوزن أصغر بنحو 6 مرات."],"explain":"الكتلة تبيّن كمية المادة في الجسم ولا تتعلّق بالكوكب.\nالوزن قوة، ويتعلّق بـ g: ‏P = m · g.\nعلى القمر كتلتك نفسها، لكن وزنك أصغر بست مرات.","formula":"P = m · g","sandbox":"قارن وزن الصندوق نفسه على كواكب مختلفة."},"phys7.f05-friction":{"title":"قوة الاحتكاك","hook":"لماذا يصعب تحريك خزانة ثقيلة من مكانها؟","page":"عندما ينزلق جسم على آخر، تنشأ قوة احتكاك تعاكس اتجاه الحركة.\nيتعلّق الاحتكاك بنوع السطحين وبمقدار ضغط الجسم على السطح.","predict":{"q":"يُسحب صندوق لكنه لا يتحرك. لماذا؟","opts":["قوة السحب أكبر من الاحتكاك","الاحتكاك يوازن قوة السحب","لا تؤثر في الصندوق أي قوة"],"why":"ما دام الصندوق ساكنًا، فقوة الاحتكاك السكوني تساوي قوة السحب وتوازنها."},"explore":["اسحب الحلقة الزرقاء للدينامومتر أو اضغط «+». عند أي قوة يبدأ الصندوق بالتحرك؟","ضع الصندوق على الجليد. كم قوة تلزم الآن لتحريكه؟","زِد الكتلة إلى 10 kg. كيف تغيّر الاحتكاك؟"],"explain":"قوة الاحتكاك الانزلاقي: F = μ · N.\nN القوة التي يضغط بها الجسم على السطح. على أرضية أفقية N = m · g.\nμ معامل الاحتكاك: صغير للجليد وكبير للمطاط.","formula":"F = μ · m · g","sandbox":"جرِّب كل الأسطح وكتلًا مختلفة. أين يكون الاحتكاك أصغر؟"},"phys7.f06-sum":{"title":"جمع القوى","hook":"إذا سحب شخصان معًا، هل تصبح القوة الضعف؟","page":"إذا أثّرت في جسم عدة قوى، يمكن استبدالها بقوة واحدة هي القوة المحصلة.\nالقوى في الاتجاه نفسه تُجمع. والقوى في اتجاهين متعاكسين تُطرح، وتتجه المحصلة نحو القوة الأكبر.","predict":{"q":"شخصان يسحبان صندوقًا نحو اليمين: أحدهما بقوة 30 N والآخر 20 N. بأي قوة يسحبان معًا؟","opts":["10 N","50 N","600 N"],"why":"القوتان في الاتجاه نفسه، لذلك تُجمعان: 30 + 20 = 50 N."},"explore":["الآن يُسحب الصندوق نحو اليمين بقوة 30 N. أضِف من اليمين 20 N أخرى.","من اليسار 30 N ومن اليمين 50 N. المحصلة 20 N نحو اليمين: الكبرى ناقص الصغرى.","زِد القوة من اليسار إلى 50 N. ماذا حدث للمحصلة؟"],"explain":"قوى على مستقيم واحد:\nفي الاتجاه نفسه: R = F₁ + F₂؛\nفي اتجاهين متعاكسين: R = الكبرى − الصغرى، باتجاه الكبرى.\nإذا كانت R = 0، يتصرف الجسم كأنه لا توجد قوى.","sandbox":"اختر القوى بحيث تكون المحصلة 10 N نحو اليسار."},"phys7.f07-balance":{"title":"الاتزان","hook":"لماذا لا يسقط المصباح المعلَّق؟","page":"يكون الجسم في حالة اتزان إذا كانت جميع القوى المؤثرة فيه متوازنة. عندها تكون المحصلة صفرًا.\nالجسم الساكن يبقى ساكنًا، والجسم المتحرك يتحرك بسرعة ثابتة.","predict":{"q":"الصندوق ساكن في مكانه. هذا يعني أنه…","opts":["لا تؤثر فيه أي قوى","تؤثر فيه قوى متوازنة","تؤثر فيه قوة الجاذبية فقط"],"why":"قوة الجاذبية تؤثر في الصندوق دائمًا. وهو ساكن لأن السطح يوازنها."},"explore":["من اليسار 60 N ومن اليمين 20 N. وازن الصندوق بإضافة قوة من اليمين.","ثقل معلَّق بنابض وساكن: قوة المرونة إلى الأعلى تساوي قوة الجاذبية إلى الأسفل."],"explain":"الاتزان: محصلة جميع القوى تساوي صفرًا.\nلثقل معلَّق بنابض: k · Δl = m · g.\nلصندوق يُسحب من الجهتين: F من اليسار = F من اليمين.","sandbox":"حقِّق اتزان الصندوق بقوى مختلفة."},"phys7.f08-mission":{"title":"المهمة الختامية: القوى","hook":"ست مسائل لمهندس حقيقي.","page":"في هذه المهمة ستقابل قوة الجاذبية والنوابض والاحتكاك وجمع القوى.\nفي كل مسألة g = ge":"10, 100, 1000 हर वाली भिन्नों को दशमलव बिंदु के साथ लिखना आसान है।\n[[3/10]] = 0.3, तीन दशांश। [[7/100]] = 0.07, सात शतांश।","predict":{"q":"[[3/10]] को और कैसे लिख सकते हैं?","opts":["3.10","0.3","0.03"],"why":"दशांश दशमलव बिंदु के बाद पहले स्थान पर लिखे जाते हैं: [[3/10]] = 0.3।"},"explore":["0 से 1 तक का रेखाखंड 10 भागों में बँटा है। मनके को 0.7 पर रखो, यह [[7/10]] है।","0.5 कहाँ है? ध्यान दो: यह आधा भी है।"],"explain":"दशमलव बिंदु के बाद पहला अंक दशांश है, दूसरा शतांश।\n[[45/100]] = 0.45। [[5/100]] = 0.05: दशांश के स्थान पर शून्य ज़रूरी है।","formula":"[[7/10]] = 0.7   [[7/100]] = 0.07","sandbox":"मनके को खिसकाओ और देखो कि दशमलव रूप कैसे बदलता है।"},"math5.fr12-mission":{"title":"अंतिम मिशन: भिन्न","hook":"भिन्नों के बारे में जो कुछ सीखा, उस पर छह प्रश्न।","page":"इस मिशन में अलग-अलग पाठों के प्रश्न हैं: भिन्न पढ़ना, उसे रेखा पर खोजना, सरल करना, तुलना करना, जोड़ना और किसी संख्या की भिन्न ज्ञात करना।\nयदि कुछ भूल जाओ, तो संकेत मदद करेंगे।","predict":{"q":"कौन-सी भिन्न एक से बड़ी है?","opts":["[[7/8]]","[[8/8]]","[[9/8]]"],"why":"[[8/8]] ठीक एक पूरी पाई है। [[9/8]] एक पूरी पाई और एक आठवाँ भाग है।"},"explore":["वार्म-अप: दो पाई पर [[9/8]] रंगो।"],"explain":"याद रखने के लिए।\nअंश बताता है कि कितने हिस्से लिए, हर बताता है कि पूरे को कितने हिस्सों में बाँटा।\nअंश और हर को एक ही संख्या से गुणा या भाग कर सकते हैं: भिन्न नहीं बदलती।\nकेवल बराबर हिस्सों को ही जोड़ सकते हैं।","sandbox":"पाई के साथ खुला खेल: किसी दोस्त के लिए प्रश्न बनाओ।"},"phys7.f01-force":{"title":"बल क्या है","hook":"बक्सा खींचने पर क्यों चलता है, और दोनों ओर से खींचने पर क्यों रुका रहता है?","page":"बल एक वस्तु की दूसरी वस्तु पर क्रिया है। बल किसी वस्तु को चला सकता है, रोक सकता है या उसका आकार बदल सकता है।\nबल को न्यूटन (N) में मापते हैं। चित्रों में बल को तीर से दिखाते हैं: तीर की दिशा बताती है कि बल किधर लगता है, और उसकी लंबाई बताती है कि बल कितना बड़ा है।","predict":{"q":"दो लोग एक बक्से को विपरीत दिशाओं में बराबर बल से खींचते हैं। क्या होगा?","opts":["बाईं ओर जाएगा","अपनी जगह पर रहेगा","दाईं ओर जाएगा"],"why":"विपरीत दिशाओं में बराबर बल एक-दूसरे को संतुलित करते हैं। बक्सा रुका रहता है।"},"explore":["बक्से को बाईं और दाईं ओर 20 N बल से खींचा जा रहा है। तीर बराबर लंबे हैं, बक्सा रुका है।","दाईं ओर का बल 40 N करो। बक्सा किधर गया?","अब बक्से को संतुलित करो: बाईं ओर का बल भी उतना ही करो।"],"explain":"बल का परिमाण और दिशा होती है।\nबल का मात्रक न्यूटन (N) है। पृथ्वी 100 g के सेब को लगभग 1 N बल से खींचती है।","sandbox":"बाएँ और दाएँ बल बदलो और देखो कि बक्सा किधर जाता है।"},"phys7.f02-gravity":{"title":"गुरुत्व बल","hook":"सब कुछ नीचे क्यों गिरता है, और चंद्रमा पर कूदना आसान क्यों है?","page":"पृथ्वी सभी वस्तुओं को अपनी ओर खींचती है। इस बल को गुरुत्व बल कहते हैं।\nवस्तु का द्रव्यमान जितना ज़्यादा, पृथ्वी उसे उतने ज़्यादा बल से खींचती है। दूसरे ग्रहों पर खिंचाव अलग होता है।","predict":{"q":"पृथ्वी किस बक्से को ज़्यादा बल से खींचती है?","opts":["1 kg वाले को","बराबर","10 kg वाले को"],"why":"गुरुत्व बल द्रव्यमान के समानुपाती है: 10 kg को 1 kg से 10 गुना ज़्यादा बल से खींचा जाता है।"},"explore":["बक्से का द्रव्यमान 10 kg करो। तीर और संख्या देखो।","बक्से को चंद्रमा पर ले जाओ। द्रव्यमान वही है, और बल?","और अब बृहस्पति पर।"],"explain":"गुरुत्व बल: F = m · g।\nm किलोग्राम में द्रव्यमान है, g बताता है कि हर किलोग्राम पर कितने न्यूटन लगते हैं। पृथ्वी पर g ≈ 9.8 N/kg, प्रश्नों में 10 N/kg लेते हैं।\nचंद्रमा पर g ≈ 1.6 N/kg, इसलिए वहाँ हर चीज़ उठाना लगभग 6 गुना आसान है।","formula":"F = m · g","sandbox":"द्रव्यमान और ग्रह चुनो। तुम्हारे लिए कहाँ कूदना सबसे आसान होगा?"},"phys7.f03-spring":{"title":"प्रत्यास्थ बल","hook":"स्प्रिंग को कैसे पता चलता है कि उस पर कौन-सा भार लटका है?","page":"यदि स्प्रिंग को खींचें या दबाएँ, तो उसमें प्रत्यास्थ बल उत्पन्न होता है। यह स्प्रिंग को उसके पहले आकार में लौटाने की कोशिश करता है।\nस्प्रिंग जितनी ज़्यादा खिंचती है, प्रत्यास्थ बल उतना बड़ा होता है। कमानीदार तुला, यानी बल मापने का उपकरण, इसी पर काम करती है।","predict":{"q":"एक बाट से स्प्रिंग 2 cm खिंची। ऐसे तीन बाटों से कितनी खिंचेगी?","opts":["3 cm","6 cm","9 cm"],"why":"खिंचाव बल के समानुपाती है: तीन गुना भार से तीन गुना खिंचाव, 6 cm।"},"explore":["100 g का एक बाट लटकाओ, उस पर 1 N गुरुत्व बल लगता है। मेज़ पर रखे बाटों के ढेर पर टैप करो।","दो बाट और जोड़ो। खिंचाव कितने गुना बढ़ा?","ज़्यादा कड़ी स्प्रिंग लो: 100 N/m। खिंचाव का क्या हुआ?"],"explain":"हुक का नियम: प्रत्यास्थ बल खिंचाव के समानुपाती है।\nF = k · Δl, जहाँ Δl मीटर में खिंचाव है और k स्प्रिंग नियतांक है, N/m में।\nकड़ी स्प्रिंग उसी बल से कम खिंचती है।","formula":"F = k · Δl","sandbox":"बाट लटकाओ और स्प्रिंग बदलो। अपनी कमानीदार तुला बनाओ: याद रखो कि 1 N से कितने सेंटीमीटर खिंचाव होता है।"},"phys7.f04-weight":{"title":"वस्तु का भार","hook":"क्या द्रव्यमान और भार एक ही चीज़ हैं?","page":"भार वह बल है जिससे वस्तु अपने आधार को दबाती है या जिससे लटकी हो उसे खींचती है। भार को न्यूटन में और द्रव्यमान को किलोग्राम में मापते हैं।\nयदि वस्तु और आधार स्थिर हैं, तो भार गुरुत्व बल के बराबर है: P = m · g।","predict":{"q":"एक सेब का द्रव्यमान 200 g है। पृथ्वी पर उसका भार कितना है?","opts":["200 N","2 N","0.2 N"],"why":"200 g = 0.2 kg। P = 0.2 kg × 10 N/kg = 2 N।"},"explore":["आधार पर 1 kg रखो। भार वह बल है जिससे बक्सा आधार को दबाता है।","बक्से को चंद्रमा पर ले जाओ। द्रव्यमान वही है, पर भार लगभग 6 गुना कम है।"],"explain":"द्रव्यमान बताता है कि वस्तु में कितना पदार्थ है, और यह ग्रह पर निर्भर नहीं करता।\nभार एक बल है, यह g पर निर्भर करता है: P = m · g।\nचंद्रमा पर तुम्हारा द्रव्यमान वही रहता है, पर भार 6 गुना कम हो जाता है।","formula":"P = m · g","sandbox":"एक ही बक्से का भार अलग-अलग ग्रहों पर तुलना करो।"},"phys7.f05-friction":{"title":"घर्षण बल","hook":"भारी अलमारी को खिसकाना इतना कठिन क्यों है?","page":"जब एक वस्तु दूसरी पर फिसलती है, तो घर्षण बल उत्पन्न होता है। यह गति के विपरीत दिशा में लगता है।\nघर्षण सतहों पर और इस पर निर्भर करता है कि वस्तु आधार पर कितनी ज़ोर से दबी है।","predict":{"q":"बक्से को खींचा जा रहा है, पर वह नहीं चलता। क्यों?","opts":["खिंचाव घर्षण से बड़ा है","घर्षण खिंचाव को संतुलित करता है","बक्से पर कोई बल नहीं लगता"],"why":"जब तक बक्सा रुका है, स्थैतिक घर्षण खिंचाव के बराबर है और उसे संतुलित करता है।"},"explore":["कमानीदार तुला की नीली अंगूठी खींचो या «+» दबाओ। किस बल पर बक्सा चलने लगता है?","बक्से को बर्फ़ पर रखो। अब उसे खिसकाने के लिए कितना बल चाहिए?","द्रव्यमान 10 kg करो। घर्षण कैसे बदला?"],"explain":"सर्पी घर्षण बल: F = μ · N।\nN वह बल है जिससे वस्तु आधार को दबाती है। समतल फ़र्श पर N = m · g।\nμ घर्षण गुणांक है: बर्फ़ के लिए छोटा, रबर के लिए बड़ा।","formula":"F = μ · m · g","sandbox":"सभी सतहें और अलग-अलग द्रव्यमान आज़माओ। घर्षण सबसे कम कहाँ है?"},"phys7.f06-sum":{"title":"बलों का योग","hook":"यदि दो लोग खींचें, तो क्या बल दुगुना होगा?","page":"यदि किसी वस्तु पर कई बल लगें, तो उन्हें एक बल से बदला जा सकता है, जिसे परिणामी बल कहते हैं।\nएक ही दिशा के बल जुड़ते हैं। विपरीत दिशाओं के बल घटते हैं, और परिणामी बल बड़े बल की दिशा में होता है।","predict":{"q":"दो लोग एक बक्से को दाईं ओर खींचते हैं: एक 30 N से, दूसरा 20 N से। वे मिलकर कितने बल से खींचते हैं?","opts":["10 N","50 N","600 N"],"why":"बल एक ही दिशा में हैं, इसलिए जुड़ते हैं: 30 + 20 = 50 N।"},"explore":["अभी बक्से को दाईं ओर 30 N से खींचा जा रहा है। दाईं ओर 20 N और जोड़ो।","बाईं ओर 30 N, दाईं ओर 50 N। परिणामी बल 20 N दाईं ओर है: बड़ा घटा छोटा।","बाईं ओर का बल 50 N करो। परिणामी बल का क्या हुआ?"],"explain":"एक ही रेखा पर बल:\nएक ही दिशा में: R = F₁ + F₂;\nविपरीत दिशाओं में: R = बड़ा − छोटा, बड़े की दिशा में।\nयदि R = 0, तो वस्तु ऐसे व्यवहार करती है मानो कोई बल न हो।","sandbox":"बल ऐसे चुनो कि परिणामी बल 10 N बाईं ओर हो।"},"phys7.f07-balance":{"title":"संतुलन","hook":"लटका हुआ झूमर क्यों नहीं गिरता?","page":"वस्तु संतुलन में होती है, यदि उस पर लगने वाले सभी बल संतुलित हों। तब परिणामी बल शून्य होता है।\nविराम में वस्तु विराम में रहती है, और चलती वस्तु एकसमान चाल से चलती रहती है।","predict":{"q":"बक्सा अपनी जगह पर रुका है। इसका अर्थ है कि उस पर…","opts":["कोई बल नहीं लगता","संतुलित बल लगते हैं","केवल गुरुत्व बल लगता है"],"why":"बक्से पर गुरुत्व बल हमेशा लगता है। वह इसलिए रुका है क्योंकि आधार उसे संतुलित करता है।"},"explore":["बाईं ओर 60 N, दाईं ओर 20 N। दाईं ओर बल जोड़कर बक्से को संतुलित करो।","स्प्
