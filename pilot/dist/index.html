N/m × {x} m = {F} N。","err":{"cm":"伸长量要用米作单位：{cm} cm = {x} m。"}},"force.stiffness":{"prompt":"在 {F} N 的力作用下，弹簧伸长了 {cm} cm。求它的劲度系数。","h1":"由 F = k · Δl 得 k = F ÷ Δl。","h2":"Δl = {cm} cm = {x} m。","h3":"{F} ÷ {x} = ?","sol":"k = F ÷ Δl = {F} N ÷ {x} m = {k} N/m。","err":{"cm":"伸长量要用米作单位：{cm} cm = {x} m。","invert":"要用力除以伸长量，而不是相乘。"}},"force.springScene":{"prompt":"弹簧的劲度系数是 {k} N/m，每个钩码重 1 N。挂上适量的钩码，使弹簧伸长 {cm} cm。","h1":"产生这个伸长量需要的力：F = k · Δl。","h2":"Δl = {x} m，所以 F = {k} × {x}。","h3":"需要 {F} N 的力，每个钩码提供 1 N。","sol":"F = {k} N/m × {x} m = {F} N。也就是 {n} 个 1 N 的钩码。","err":{"tooMany":"太多了：弹簧伸长得太多。取下一个钩码。","tooFew":"还不够：伸长量还不够。再挂一个钩码。"}},"force.sumSame":{"prompt":"两个孩子沿同一方向拉雪橇，拉力分别为 {a} N 和 {b} N。求合力。","h1":"两个力方向相同，互相帮助。","h2":"所以要把它们相加。","h3":"{a} + {b} = ?","sol":"R = {a} N + {b} N = {R} N，方向不变。","err":{"diff":"方向相同的力要相加，而不是相减。"}},"force.sumOpp":{"prompt":"一个箱子受到向左 {a} N 和向右 {b} N 的拉力。求合力。","h1":"两个力方向相反，互相抵消。","h2":"用较大的力减去较小的力。","h3":"箱子会朝力大的一方移动：{side}。","sol":"R = {R} N（大力减小力），箱子会{side}移动。","err":{"sum":"方向相反的力不相加：用大的减去小的。"}},"force.tugScene":{"prompt":"箱子受到向左 {a} N 的拉力。选择右边的拉力，使箱子保持不动。","h1":"如果力是平衡的，箱子就保持静止。","h2":"平衡的意思是大小相等、方向相反。","h3":"右边需要和左边一样大的力。","sol":"右边需要 {a} N，这时合力为零。","err":{"tooMany":"右边的力更大，箱子会向右移动。把它减小。","tooFew":"右边的力更小，箱子会向左移动。把它加大。"}},"force.friction":{"prompt":"沿地面拉动一个质量为 {m} kg 的箱子。动摩擦因数 μ = {mu}。箱子受到的滑动摩擦力是多少？取 g = 10 N/kg。","h1":"摩擦力：F = μ · N，其中 N 是箱子压在地面上的力。","h2":"在水平地面上 N = m · g = {N} N。","h3":"{mu} × {N} = ?","sol":"F = μ · m · g = {mu} × {m} kg × 10 N/kg = {F} N。","err":{"noG":"你用 μ 乘了质量。需要的是压力：N = m · g。","noMu":"这是对地面的压力。再乘上动摩擦因数 μ。"}},"force.uniform":{"prompt":"沿地面匀速拉动一个箱子。弹簧测力计的示数是 {F} N。摩擦力是多少？","h1":"匀速说明沿地面方向的力是平衡的。","h2":"沿地面方向只有拉力和摩擦力。","h3":"摩擦力等于拉力。","sol":"匀速运动时，摩擦力等于拉力：{F} N。","err":{"zero":"箱子在地面上滑动，所以有摩擦力。匀速时它等于拉力。"}}},"lessons":{"math5.fr01-parts":{"title":"等份与分数","hook":"怎样把一个派公平地分给四个人？","page":"把一个整体切成相等的几部分，每一部分叫作一份。\n分数告诉我们取了几份。分数线下面写整体被切成几份，这是分母。分数线上面写取了几份，这是分子。","predict":{"q":"一个比萨被切成 8 块相等的，你吃了 2 块。你吃了比萨的几分之几？","opts":["[[2/6]]","[[2/8]]","[[8/2]]"],"why":"一共 8 块相等的，这是分母。你吃了 2 块，这是分子。结果是 [[2/8]]。"},"explore":["点一下派的一块，给它涂色。这是四分之一：[[1/4]]。","再涂两块。现在涂了多少？这是 [[3/4]]。","用场景下方的“份数”按钮，把派切成 8 块。","把派的 [[5/8]] 涂上颜色。"],"explain":"分数 [[3/4]] 读作“四分之三”。\n分母（4）表示把整体平均分成了几份，每份必须**相等**。分子（3）表示取了几份。\n如果各部分不相等，就不能用分数表示。","formula":"[[3/4]]：4 份中取 3 份","sandbox":"把派切成任意份数并涂色。试着找出两个不同的分数，它们涂色的部分一样多。"},"math5.fr02-number-line":{"title":"数轴上的分数","hook":"[[1/2]] 住在哪里？在 0 和 1 之间！","page":"分数也是数。它在数轴上有自己的位置。\n要找到 [[3/4]]，就把从 0 到 1 的线段平均分成 4 份，从 0 开始数三份。","predict":{"q":"在从 0 到 1 的线段上，[[1/2]] 在哪里？","opts":["靠近 0","正好在中间","靠近 1"],"why":"二分之一把线段分成两个相等的部分，所以 [[1/2]] 正好在中间。"},"explore":["把珠子拖到 [[3/4]]。可以用手指，也可以用箭头。","点击“等份”旁边的“+”，直到变成 8 份。珠子没动，但现在它是 [[6/8]]。","这条数轴一直到 2。把珠子放到 [[4/3]]，这是一个大于 1 的分数。"],"explain":"要标出一个分数，就把从 0 到 1 的线段平均分成分母那么多份，再从 0 开始数分子那么多份。\n如果分子比分母大，分数就大于 1，位于 1 的右边。","sandbox":"移动珠子，改变份数。在数轴上找出同一个数的两种不同写法。"},"math5.fr03-equivalent":{"title":"相等的分数","hook":"半个比萨和两个四分之一，哪个多？","page":"整体的同一部分可以用不同的分数表示。\n如果把每一份再切成两半，份数变成原来的两倍，取的份数也变成原来的两倍。","predict":{"q":"哪个多：派的 [[1/2]] 还是派的 [[2/4]]？","opts":["[[1/2]] 多","一样多","[[2/4]] 多"],"why":"两个四分之一正好合成一半。它们是派的同一部分。"},"explore":["左边的派涂了一半。在第二个派上涂几个四分之一，使涂色部分一样多。","现在是 [[1/3]]。要涂几个六分之一才一样多？","[[2/3]] = ? / 9。在第二个派上涂上正确数量的九分之一。"],"explain":"分子和分母同时乘同一个数，分数的大小不变。\n[[1/2]] = [[2/4]] = [[3/6]] = [[4/8]]。这叫作分数的基本性质。","formula":"[[2/3]] = [[4/6]] = [[6/9]]","sandbox":"把派切成不同的份数，寻找相等的分数。"},"math5.fr04-simplify":{"title":"约分","hook":"[[6/8]] 和 [[3/4]] 是一样的。哪种写法更简单？","page":"分数的基本性质反过来也成立：分子和分母可以同时除以同一个数。\n这叫作约分。分数写起来更简单，表示的部分不变。","predict":{"q":"派的 [[6/8]] 是几个四分之一？","opts":["[[2/4]]","[[3/4]]","[[6/4]]"],"why":"每两个八分之一合成一个四分之一。六个八分之一就是三个四分之一。"},"explore":["用“−”按钮把份数减到 4。涂色部分不变：[[6/8]] 变成了 [[3/4]]。","[[4/10]]：约分成五分之几，切成 5 份。"],"explain":"约分时，用分子和分母的公因数同时去除它们。\n[[6/8]]：两个数都能被 2 整除，得到 [[3/4]]。3 和 4 没有公因数，所以这是最简分数。","formula":"[[6/8]] = [[3/4]]","sandbox":"试着通过减少份数，把派的 [[8/12]] 约分。"},"math5.fr05-compare":{"title":"比较分数","hook":"哪个更好：[[1/3]] 个蛋糕还是 [[1/5]] 个蛋糕？","page":"如果分母相同或者分子相同，比较分数很容易。\n如果都不同，先让每份变得一样大。","predict":{"q":"哪个大：[[1/3]] 还是 [[1/5]]？","opts":["[[1/3]]","一样大","[[1/5]]"],"why":"整体被分得越多，每份就越小。三分之一比五分之一大。"},"explore":["分母相同：[[2/6]] 和 [[5/6]]。涂色块数多的分数大。","分子相同：[[1/3]] 和 [[1/5]]。比一比哪一块更大。","[[2/3]] 和 [[3/4]]。把两个派都切成 12 份，比一比哪个涂得多。"],"explain":"分母相同：分子大的分数大。\n分子相同：分母小的分数大。\n都不同：先通分，再比较分子。[[2/3]] = [[8/12]]，[[3/4]] = [[9/12]]，所以 [[3/4]] 大。","sandbox":"做两个派，试着让它们的分数不同，但涂色部分一样多。"},"math5.fr06-add-same":{"title":"同分母分数的加减法","hook":"八分之三加八分之二，是几个八分之一？","page":"每份一样大时，相加很简单：数一数现在有几份。\n每份的大小不变，所以分母不变。","predict":{"q":"[[3/8]] + [[2/8]] = ?","opts":["[[5/16]]","[[5/8]]","[[6/8]]"],"why":"把份数相加：3 + 2 = 5 个 [[1/8]]。每份没有变小，所以分母还是 8。"},"explore":["第一个派有 8 份中的 3 份，第二个有 2 份。合起来有几份？","在一个派上把它们加起来：涂上 3 + 2 份。","减法：原来有 [[5/6]]，吃掉了 [[3/6]]。取消三份的涂色。"],"explain":"同分母分数相加，分子相加，分母不变。\n减法也一样：分子相减，分母不变。","formula":"[[3/8]] + [[2/8]] = [[5/8]]","sandbox":"自己编一道加法题，用派表示出来。"},"math5.fr07-common-denominator":{"title":"公分母","hook":"块的大小不同，怎样把二分之一和三分之一加起来？","page":"只有一样大的份才能相加。所以先把两个整体切成一样大的份。\n对两个分数都适用的份数叫作公分母。","predict":{"q":"怎样计算 [[1/2]] 加 [[1/3]]？","opts":["分子加分子，分母加分母：[[2/5]]","把两个派都切成一样大的份","没办法，它们不能相加"],"why":"二分之一和三分之一都可以切成六分之一：[[1/2]] = [[3/6]]，[[1/3]] = [[2/6]]。现在每份一样大了。"},"explore":["在不改变涂色部分的情况下，让两个派的份数相同。试试 6。","[[1/4]] 和 [[1/6]]：24 份可以，但还有更小的数。把它找出来。"],"explain":"公分母能被两个分母整除。最方便的是最小的那个。\n可以这样找：写出较大分母的倍数，直到找到一个也能被较小分母整除的数。\n4 和 6：6、12，12 可以。","sandbox":"任选两个分数，用派找出它们的公分母。"},"math5.fr08-add-unlike":{"title":"异分母分数的加法","hook":"[[1/2]] + [[1/4]] 等于多少？","page":"先通分，再把分子相加。\n如果结果可以约分，就约分。","predict":{"q":"[[1/2]] + [[1/4]] = ?","opts":["[[2/6]]","[[3/4]]","[[2/4]]"],"why":"二分之一就是两个四分之一。[[2/4]] + [[1/4]] = [[3/4]]。"},"explore":["把第一个派切成四份。涂色的有几个四分之一？","在一个派上相加：[[2/4]] + [[1/4]]。","[[2/3]] − [[1/2]]：把两个派都切成六份，比一比。"],"explain":"1. 找出公分母。\n2. 把每个分数的分子和分母同乘一个数，得到这个分母。\n3. 分子相加或相减。\n4. 能约分就约分。","formula":"[[2/3]] − [[1/2]] = [[4/6]] − [[3/6]] = [[1/6]]","sandbox":"用派验证：[[2/3]] + [[1/4]] = [[11/12]] 对吗？"},"math5.fr09-mixed":{"title":"带分数","hook":"一个半派是几个二分之一？","page":"如果份数比一个整体还多，就得到假分数，例如 [[7/4]]。\n它也可以写成整数部分加分数部分：[[1 3/4]]。这就是带分数。","predict":{"q":"[[1 3/4]] 里有几个四分之一？","opts":["4","7","13"],"why":"一个整体有 4 个四分之一，再加 3 个：一共 7 个。[[1 3/4]] = [[7/4]]。"},"explore":["一个完整的派再加 [[3/4]]。这是带分数 [[1 3/4]]，也就是 [[7/4]]。","做出 [[2 2/3]]：在第三个派上涂上正确的份数。一共有几个三分之一？"],"explain":"带分数化成假分数：用整数部分乘分母，再加上分子。\n假分数化成带分数：用分子除以分母，求出商和余数。商是整数部分，余数是新的分子。","formula":"[[2 2/3]] = [[8/3]]","sandbox":"用派拼出一个带分数，再把它写成假分数。"},"math5.fr10-of-number":{"title":"求一个数的几分之几","hook":"一块巧克力有 12 小块。它的三分之二是几小块？","page":"求一个数的几分之几，先用这个数除以分母，得到一份。\n再乘分子，取需要的份数。","predict":{"q":"一块巧克力有 12 小块。这块巧克力的 [[2/3]] 是几小块？","opts":["6","8","9"],"why":"12 的三分之一是 4 小块。三分之二是 8 小块。"},"explore":["巧克力被分成 3 条相等的条块。掰下 [[2/3]]：点 2 条。","20 小块，4 条。掰下 [[3/4]]。这是几小块？"],"explain":"求一个数的几分之几，先用这个数除以分母，再乘分子。\n12 的 [[2/3]]：12 ÷ 3 = 4，4 × 2 = 8。","formula":"12 的 [[2/3]] = 12 ÷ 3 × 2 = 8","sandbox":"掰下条块数一数：你有巧克力的几分之几，是几小块？"},"math5.fr11-decimals":{"title":"小数","hook":"[[3/10]] 可以写得更简短！","page":"分母是 10、100、1000 的分数，用小数点来写很方便。\n[[3/10]] = 0.3，读作零点三，表示三个十分之一。[[7/100]] = 0.07，表示七个百分之一。","predict":{"q":"[[3/10]] 还可以怎样写？","opts":["3.10","0.3","0.03"],"why":"十分位写在小数点后第一位：[[3/10]] = 0.3。"},"explore":["从 0 到 1 的线段被分成 10 份。把珠子放到 0.7，也就是 [[7/10]]。","0.5 在哪里？注意：它也是二分之一。"],"explain":"小数点后第一位是十分位，第二位是百分位。\n[[45/100]] = 0.45。[[5/100]] = 0.05：十分位上的 0 不能省略。","formula":"[[7/10]] = 0.7   [[7/100]] = 0.07","sandbox":"移动珠子，看看小数的写法怎样变化。"},"math5.fr12-mission":{"title":"最终任务：分数","hook":"六道题，涵盖你学过的所有分数知识。","page":"这个任务里有来自不同课的题目：读分数、在数轴上找分数、约分、比较、加法，以及求一个数的几分之几。\n如果忘了什么，提示会帮助你。","predict":{"q":"哪个分数大于 1？","opts":["[[7/8]]","[[8/8]]","[[9/8]]"],"why":"[[8/8]] 正好是一个完整的派。[[9/8]] 是一个完整的派再加八分之一。"},"explore":["热身：用两个派涂出 [[9/8]]。"],"explain":"小抄。\n分子表示取了几份，分母表示整体被分成了几份。\n分子和分母可以同时乘或除以同一个数：分数大小不变。\n只有一样大的份才能相加。","sandbox":"用派自由玩耍：给朋友出一道题。"},"phys7.f01-force":{"title":"什么是力","hook":"为什么拉箱子它会动，两边一起拉它却不动？","page":"力是一个物体对另一个物体的作用。力可以使物体运动、停止，或者改变它的形状。\n力的单位是牛顿（N）。在图中用箭头表示力：箭头的方向表示力的方向，长度表示力的大小。","predict":{"q":"两个人用同样大的力向相反方向拉一个箱子。会发生什么？","opts":["向左移动","保持不动","向右移动"],"why":"大小相等、方向相反的力互相平衡。箱子保持不动。"},"explore":["箱子左右两边各受到 20 N 的拉力。箭头一样长，箱子不动。","把右边的力增加到 40 N。箱子往哪边动了？","现在让箱子平衡：把左边的力也调成一样大。"],"explain":"力有大小和方向。\n力的单位是牛顿（N）。地球对一个 100 g 的苹果的吸引力大约是 1 N。","sandbox":"改变左右两边的力，观察箱子往哪边移动。"},"phys7.f02-gravity":{"title":"重力","hook":"为什么东西都会往下掉？为什么在月球上跳起来更容易？","page":"地球吸引所有物体。这个力叫作重力。\n物体的质量越大，地球对它的吸引力越大。在其他星球上，吸引力不一样。","predict":{"q":"地球对哪个箱子的吸引力更大？","opts":["1 kg 的箱子","一样大","10 kg 的箱子"],"why":"重力与质量成正比：10 kg 受到的吸引力是 1 kg 的 10 倍。"},"explore":["把箱子的质量增加到 10 kg。看看箭头和数字。","把箱子搬到月球上。质量不变，那么力呢？","再搬到木星上。"],"explain":"重力：F = m · g。\nm 是以千克为单位的质量，g 表示每千克受到多少牛顿的力。在地球上 g ≈ 9.8 N/kg，做题时取 10 N/kg。\n在月球上 g ≈ 1.6 N/kg，所以在那里举起东西要轻松大约 6 倍。","formula":"F = m · g","sandbox":"选择质量和星球。你在哪里跳起来最容易？"},"phys7.f03-spring":{"title":"弹力","hook":"弹簧怎么知道挂在它上面的是多重的东西？","page":"拉伸或压缩弹簧时，弹簧中会产生弹力。弹力总是想让弹簧恢复原来的形状。\n弹簧伸长得越多，弹力越大。弹簧测力计就是利用这一点来测量力的工具。","predict":{"q":"挂一个钩码时弹簧伸长了 2 cm。挂三个同样的钩码会伸长多少？","opts":["3 cm","6 cm","9 cm"],"why":"伸长量与力成正比：重量变成 3 倍，伸长量也变成 3 倍，即 6 cm。"},"explore":["挂上一个 100 g 的钩码，它受到 1 N 的重力。点一下桌上的那摞钩码。","再挂两个钩码。伸长量变成了原来的几倍？","换一根更硬的弹簧：100 N/m。伸长量怎样了？"],"explain":"胡克定律：弹力与伸长量成正比。\nF = k · Δl，其中 Δl 是以米为单位的伸长量，k 是弹簧的劲度系数，单位是 N/m。\n受同样的力，硬弹簧伸长得更少。","formula":"F = k · Δl","sandbox":"挂钩码、换弹簧。做一个你自己的测力计：记住 1 N 能让弹簧伸长几厘米。"},"phys7.f04-weight":{"title":"物体的重量","hook":"质量和重量是一回事吗？","page":"重量是物体压在支撑面上或拉紧悬挂物的力。重量的单位是牛顿，质量的单位是千克。\n如果物体和支撑面都静止，重量就等于重力：P = m · g。","predict":{"q":"一个苹果的质量是 200 g。它在地球上的重量是多少？","opts":["200 N","2 N","0.2 N"],"why":"200 g = 0.2 kg。P = 0.2 kg × 10 N/kg = 2 N。"},"explore":["在支撑面上放 1 kg。重量就是箱子压在支撑面上的力。","把箱子搬到月球上。质量不变，但重量大约变成原来的六分之一。"],"explain":"质量表示物体中物质的多少，与星球无关。\n重量是一种力，它与 g 有关：P = m · g。\n在月球上，你的质量不变，但重量只有地球上的六分之一。","formula":"P = m · g","sandbox":"比较同一个箱子在不同星球上的重量。"},"phys7.f05-friction":{"title":"摩擦力","hook":"为什么很难推动一个沉重的柜子？","page":"一个物体在另一个物体上滑动时，会产生摩擦力。摩擦力的方向与运动方向相反。\n摩擦力与接触面有关，也与物体压在支撑面上的力有关。","predict":{"q":"有人在拉箱子，但箱子没动。为什么？","opts":["拉力大于摩擦力","摩擦力与拉力平衡","箱子不受任何力"],"why":"箱子静止时，静摩擦力等于拉力，与拉力平衡。"},"explore":["拉动测力计上的蓝色圆环，或者点击“+”。拉力多大时箱子开始移动？","把箱子放到冰面上。现在需要多大的力才能拉动它？","把质量增加到 10 kg。摩擦力怎样变化？"],"explain":"滑动摩擦力：F = μ · N。\nN 是物体压在支撑面上的力。在水平地面上 N = m · g。\nμ 是动摩擦因数：冰面的很小，橡胶的很大。","formula":"F = μ · m · g","sandbox":"试试所有的表面和不同的质量。在哪里摩擦力最小？"},"phys7.f06-sum":{"title":"力的合成","hook":"两个人一起拉，力会变成两倍吗？","page":"如果一个物体受到几个力，可以用一个力来代替它们，这个力叫作合力。\n方向相同的力相加。方向相反的力相减，合力的方向与较大的力相同。","predict":{"q":"两个人向右拉一个箱子：一个用 30 N，另一个用 20 N。他们一起拉的力是多少？","opts":["10 N","50 N","600 N"],"why":"两个力方向相同，所以相加：30 + 20 = 50 N。"},"explore":["现在箱子受到向右 30 N 的拉力。在右边再加 20 N。","左边 30 N，右边 50 N。合力是向右 20 N：大的减小的。","把左边的力增加到 50 N。合力怎样了？"],"explain":"在同一直线上的力：\n方向相同：R = F₁ + F₂；\n方向相反：R = 较大的力 − 较小的力，方向与较大的力相同。\n如果 R = 0，物体就像没有受力一样。","sandbox":"调节各个力，使合力为向左 10 N。"},"phys7.f07-balance":{"title":"平衡","hook":"为什么挂着的吊灯不会掉下来？","page":"如果作用在物体上的所有力相互平衡，物体就处于平衡状态。这时合力为零。\n静止的物体保持静止，运动的物体保持匀速运动。","predict":{"q":"箱子静止不动。这说明它……","opts":["不受任何力","受到平衡力","只受到重力"],"why":"箱子总是受到重力。它静止是因为支撑面的力与重力平衡。"},"explore":["左边 60 N，右边 20 N。在右边加力，让箱子平衡。","钩码静止地挂在弹簧上：向上的弹力等于向下的重力。"],"explain":"平衡：所有力的合力为零。\n挂在弹簧上的钩码：k · Δl = m · g。\n两边受拉的箱子：左边的 F = 右边的 F。","sandbox":"用不同的力让箱子保持平衡。"},"phys7.f08-mission":{"title":"最终任务：力","hook":"给真正的工程师的六道题。","page":"在这个任务中，你会遇到重力、弹簧、摩擦力和力的合成。\n除非另有说明，每道题都取 g = 10 N/kg。提示就在旁边。","predict":{"q":"一名宇航员在月球上举起一个哑铃。和在地球上相比，什么变了？","opts":["哑铃的质量","哑铃的重量","质量和重量都变了"],"why":"质量与星球无关。重量变了，因为月球上的 g 更小。"},"explore":["把一个 20 kg 的哑铃搬到火星上，看看重力是多少。"],"explain":"小抄。\nF = m · g：重力。\nF = k · Δl：弹力（Δl 以米为单位）。\nF = μ · m · g：滑动摩擦力。\n方向相同的力相加，方向相反的力相减。","sandbox":"自由实验室：在冰面和橡胶上拉动箱子。"}}}}};</script>
<script>/* core.js */
/* School Cool pilot · core helpers shared by the engine, task generators and the validator.
   Works both in the browser (window.SC) and in Node (require). */
(function (root) {
  const SC = root.SC || (root.SC = {});

  /* ---------- seeded random ---------- */
  SC.rng = function (seed) {
    let a = (seed >>> 0) || 1;
    const next = () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    return {
      next,
      int: (lo, hi) => lo + Math.floor(next() * (hi - lo + 1)),
      pick: (arr) => arr[Math.floor(next() * arr.length)],
    };
  };

  /* ---------- fractions ---------- */
  const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
  const lcm = (a, b) => Math.abs(a * b) / gcd(a, b);
  SC.gcd = gcd; SC.lcm = lcm;
  SC.frac = {
    simplify: (n, d) => { const g = gcd(n, d); return { num: n / g, den: d / g }; },
    equal: (a, b) => a.num * b.den === b.num * a.den,
    isLowest: (f) => gcd(f.num, f.den) === 1,
    value: (f) => f.num / f.den,
  };

  /* ---------- numbers & text ---------- */
  SC.fmtNumber = function (x, lang) {
    const r = Math.round(x * 1000) / 1000;
    try { return new Intl.NumberFormat(SC.numberLocale(lang), { maximumFractionDigits: 3 }).format(r); }
    catch (e) { return String(r); }
  };
  /* Western digits everywhere in the pilot; decimal separator follows the language. */
  SC.numberLocale = (lang) => ({ ru: 'ru-RU', en: 'en-US', es: 'es-ES', ar: 'ar-u-nu-latn', hi: 'hi-IN-u-nu-latn', zh: 'zh-CN' }[lang] || 'en-US');

  /* Parse a typed number: accepts "2,5", "2.5", " 12 ", "-3". Returns NaN when not a number. */
  SC.parseNumber = function (s) {
    if (typeof s === 'number') return s;
    const t = String(s || '').trim().replace(/\s+/g, '').replace(',', '.').replace('−', '-');
    if (!/^-?\d+(\.\d+)?$/.test(t)) return NaN;
    return parseFloat(t);
  };

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  SC.esc = esc;

  /* Template language used in every text string:
       {x}        -> value of variable x, formatted as a number
       [[a/b]]    -> stacked fraction with numerator a and denominator b (variables or digits)
       [[w a/b]]  -> mixed number
       **bold**   -> bold
     Variables may be expressions of the form x*y, x+y, x-y. */
  SC.evalVar = function (expr, vars) {
    expr = String(expr).trim();
    if (/^-?\d+(\.\d+)?$/.test(expr)) return parseFloat(expr);
    const m = expr.match(/^(\w+)\s*([*+\-\/])\s*(\w+)$/);
    if (m) {
      const a = SC.evalVar(m[1], vars), b = SC.evalVar(m[3], vars);
      return m[2] === '*' ? a * b : m[2] === '+' ? a + b : m[2] === '-' ? a - b : a / b;
    }
    if (!(expr in vars)) throw new Error('Unknown variable "' + expr + '"');
    return vars[expr];
  };
  SC.fracHTML = (n, d, w) => (w ? '<span class="mixw">' + w + '</span>' : '') + '<span class="frac"><i>' + n + '</i><i>' + d + '</i></span>';
  /* Right-to-left languages. In them, formulas and calculations are kept left-to-right
     (Western digits and Latin symbols), so each math run is wrapped in a bidi isolate. */
  SC.RTL = ['ar', 'he', 'fa', 'ur'];
  SC.isRTL = (lang) => SC.RTL.includes(lang);
  SC.ltr = (s) => '\u2066' + s + '\u2069';
  const MATH_TOKEN = "[A-Za-z0-9{}\\[\\]_*+\\-−·×÷=\\/.,?≈()μΔ₁₂%]+";
  const MATH_RUN = new RegExp(MATH_TOKEN + '(?:[ \u00A0]+' + MATH_TOKEN + ')+', 'g');
  SC.isolateMath = function (tpl) {
    return tpl.replace(MATH_RUN, (m) => {
      const lead = m.match(/^[.,:]*\s*/)[0], trail = m.match(/\s*[.,:]*$/)[0];
      const core = m.slice(lead.length, m.length - trail.length);
      return core.includes(' ') ? lead + SC.ltr(core) + trail : m;
    });
  };
  SC.render = function (tpl, vars, lang) {
    vars = vars || {};
    let s = esc(SC.isRTL(lang) ? SC.isolateMath(tpl) : tpl);
    s = s.replace(/\[\[\s*(?:([\w*+\-]+)\s+)?([\w*+\-]+)\s*\/\s*([\w*+\-]+)\s*\]\]/g, (_, w, a, b) =>
      SC.fracHTML(SC.fmtNumber(SC.evalVar(a, vars), lang), SC.fmtNumber(SC.evalVar(b, vars), lang), w ? SC.fmtNumber(SC.evalVar(w, vars), lang) : ''));
    s = s.replace(/\{([\w*+\-\/ ]+)\}/g, (_, e) => { const v = SC.evalVar(e, vars); return typeof v === 'string' ? esc(v) : SC.fmtNumber(v, lang); });
    s = s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    /* Isolate chars around atomic inlines (stacked fractions) are not reliable, so use real elements. */
    s = s.replace(/\u2066/g, '<span dir="ltr">').replace(/\u2069/g, '</span>');
    return s;
  };
  /* The set of placeholders used by a template, for cross-language validation. */
  SC.placeholders = function (tpl) {
    const out = new Set();
    String(tpl).replace(/\[\[\s*(?:([\w*+\-]+)\s+)?([\w*+\-]+)\s*\/\s*([\w*+\-]+)\s*\]\]/g, (m) => { out.add(m.replace(/\s+/g, '')); return m; })
      .replace(/\{([\w*+\-\/ ]+)\}/g, (m) => { out.add(m.replace(/\s+/g, '')); return m; });
    return [...out].sort();
  };

  /* Look up "a.b.c" in nested objects whose own keys may contain dots (lesson ids, task types). */
  SC.lookup = function (obj, path) {
    if (obj == null) return undefined;
    if (path === '') return obj;
    if (Object.prototype.hasOwnProperty.call(obj, path)) return obj[path];
    const parts = path.split('.');
    for (let i = parts.length - 1; i >= 1; i--) {
      const head = parts.slice(0, i).join('.');
      if (obj[head] != null && typeof obj[head] === 'object') {
        const r = SC.lookup(obj[head], parts.slice(i).join('.'));
        if (r !== undefined) return r;
      }
    }
    return undefined;
  };

  if (typeof module !== 'undefined') module.exports = SC;
})(typeof window !== 'undefined' ? window : globalThis);

/* tasks.js */
/* School Cool pilot · task generators.
   Every task type knows how to make a fresh variant from a seed, what kind of answer it takes,
   how to check it and which typical mistakes it can recognise. All texts live in i18n files
   under tasks.<type> (prompt, h1, h2, h3, sol, err.<id>). Numbers are never written into texts. */
(function (root) {
  const SC = root.SC;
  const F = SC.frac;
  const near = (x, y) => Math.abs(x - y) <= 1e-6 + 0.005 * Math.abs(y);
  const G = 10; // N/kg, stated in every physics prompt

  const T = {};
  SC.taskTypes = T;

  /* input kinds: fraction {num,den} · number · mixed {w,num,den} · choice (value from options) · scene (instrument state) */

  T['frac.read'] = {
    input: 'fraction',
    gen(r, p) {
      const n = r.pick(p.dens || [2, 3, 4, 5, 6, 8]);
      const k = r.int(1, n - 1);
      return { vars: { k, n, u: n - k }, answer: { num: k, den: n }, scene: { instrument: 'fraction-pie', state: { pies: [{ n, k }], locked: true, labels: false } } };
    },
    check(v, t) {
      const a = t.answer;
      if (F.equal(v, a)) return { ok: true };
      if (v.num === a.den && v.den === a.num) return { ok: false, err: 'flip' };
      if (v.num === t.vars.u && v.den === a.den) return { ok: false, err: 'unshaded' };
      return { ok: false };
    },
  };

  T['frac.shade'] = {
    input: 'scene',
    gen(r, p) {
      const n = r.pick(p.dens || [3, 4, 5, 6, 8]);
      const k = r.int(1, n - 1);
      return { vars: { k, n }, answer: { num: k, den: n }, scene: { instrument: 'fraction-pie', state: { pies: [{ n: p.fixedSlices ? n : 2, k: 0 }], locked: false } } };
    },
    check(state, t) {
      const pie = state && state.pies && state.pies[0];
      if (!pie) return { ok: false };
      if (pie.k === t.answer.num && pie.n === t.answer.den) return { ok: true };
      if (pie.n !== t.answer.den && pie.k * t.answer.den === pie.n * t.answer.num) return { ok: true };
      if (pie.n !== t.answer.den) return { ok: false, err: 'slices' };
      return { ok: false, err: 'count' };
    },
  };

  T['frac.numline'] = {
    input: 'fraction',
    gen(r, p) {
      const n = r.pick(p.dens || [2, 3, 4, 5, 6, 8]);
      const max = p.max || 1;
      const k = r.int(1, n * max - 1);
      return { vars: { k, n }, answer: { num: k, den: n }, scene: { instrument: 'number-line', state: { n, max, point: k, locked: true, labels: false } } };
    },
    check(v, t) {
      const a = t.answer;
      if (F.equal(v, a)) return { ok: true };
      if (v.num === a.num && v.den === a.den + 1) return { ok: false, err: 'ticks' };
      if (v.num === a.den && v.den === a.num) return { ok: false, err: 'flip' };
      return { ok: false };
    },
  };

  T['frac.place'] = {
    input: 'scene',
    gen(r, p) {

    app.appendChild(topBar(t('units.' + unit.id + '.title') + ' · ' + tl(id, 'title')));
    const wrap = h('main', { class: 'lesson' });
    const book = h('div', { class: 'book' });
    const page = h('section', { class: 'page', 'aria-live': 'polite' });
    const scene = h('section', { class: 'scene', 'aria-label': t('ui.scene') });
    book.appendChild(page); book.appendChild(scene); wrap.appendChild(book);
    const steps = h('nav', { class: 'steps', 'aria-label': t('ui.steps') });
    STEPS.forEach((s, i) => {
      const b = h('button', { 'aria-current': s === step ? 'step' : 'false' }, '<b>' + (i + 1) + '</b><span>' + t('ui.step.' + s) + '</span>');
      b.onclick = () => go(id, s); steps.appendChild(b);
    });
    wrap.appendChild(steps);
    app.appendChild(wrap);
    ensureKit(scene);
    lp(id).seen = true; saveProgress();
    const ctx = { id, L, page, unit };
    ({ page: stepPage, predict: stepPredict, explore: stepExplore, explain: stepExplain, tasks: stepTasks, sandbox: stepSandbox })[step](ctx);
  }
  const go = (id, step) => { location.hash = '#/l/' + id + '/' + step; };
  const next = (ctx, step) => { const i = STEPS.indexOf(step); const b = h('button', { class: 'btn' }, i < STEPS.length - 1 ? t('ui.next') + ' · ' + t('ui.step.' + STEPS[i + 1]) : t('ui.toCatalog')); b.onclick = () => (i < STEPS.length - 1 ? go(ctx.id, STEPS[i + 1]) : nextLesson(ctx)); return b; };
  function nextLesson(ctx) { const list = ctx.unit.lessons; const i = list.indexOf(ctx.id); location.hash = i < list.length - 1 ? '#/l/' + list[i + 1] : '#/'; }
  function head(ctx, step) { ctx.page.appendChild(h('div', { class: 'k' }, t('ui.step.' + step))); ctx.page.appendChild(h('h1', null, tl(ctx.id, 'title'))); }

  function stepPage(ctx) {
    head(ctx, 'page');
    ctx.page.appendChild(h('p', { class: 'lead' }, tl(ctx.id, 'hook')));
    tl(ctx.id, 'page').split('\n').forEach((p) => ctx.page.appendChild(h('p', null, p)));
    const r = h('div', { class: 'row' }); r.appendChild(next(ctx, 'page')); ctx.page.appendChild(r);
    onSceneChange = null; showScene(ctx.L.scene.instrument, ctx.L.scene.state);
  }

  function stepPredict(ctx) {
    head(ctx, 'predict');
    ctx.page.appendChild(h('p', { class: 'prompt' }, tl(ctx.id, 'predict.q')));
    const opts = h('div', { class: 'opts' }); const res = h('div');
    const n = ctx.L.predict.options;
    for (let i = 0; i < n; i++) {
      const b = h('button', { class: 'opt' }, tl(ctx.id, 'predict.opts.' + i));
      b.onclick = () => {
        [...opts.children].forEach((x, j) => { x.disabled = true; if (j === ctx.L.predict.correct) x.classList.add('right'); });
        if (i !== ctx.L.predict.correct) b.classList.add('wrong');
        res.innerHTML = '';
        res.appendChild(h('div', { class: 'box ' + (i === ctx.L.predict.correct ? 'good' : 'info') }, '<div class="h">' + t(i === ctx.L.predict.correct ? 'ui.predictRight' : 'ui.predictCheck') + '</div>' + tl(ctx.id, 'predict.why')));
        const r = h('div', { class: 'row' }); r.appendChild(next(ctx, 'predict')); res.appendChild(r);
        if (ctx.L.predict.state) showScene(ctx.L.predict.instrument || ctx.L.scene.instrument, ctx.L.predict.state);
      };
      opts.appendChild(b);
    }
    ctx.page.appendChild(opts); ctx.page.appendChild(res);
    onSceneChange = null; showScene(ctx.L.scene.instrument, ctx.L.scene.state);
  }

  function goalMet(goal, s) { return Object.keys(goal).every((path) => JSON.stringify(lookup(s, path)) === JSON.stringify(goal[path])); }

  function stepExplore(ctx, i) {
    i = i || 0;
    ctx.page.innerHTML = '';
    head(ctx, 'explore');
    const E = ctx.L.explore; const st = E[i];
    ctx.page.appendChild(h('div', { class: 'explore-n' }, (i + 1) + ' / ' + E.length));
    ctx.page.appendChild(h('p', { class: 'prompt' }, tl(ctx.id, 'explore.' + i)));
    const goal = st.goal ? h('div', { class: 'goal' }, '<i></i>' + t('ui.goalTodo')) : null;
    if (goal) ctx.page.appendChild(goal);
    const r = h('div', { class: 'row' });
    if (i > 0) { const b = h('button', { class: 'ghost' }, t('ui.back')); b.onclick = () => stepExplore(ctx, i - 1); r.appendChild(b); }
    if (st.state) { const s = h('button', { class: 'ghost' }, t('ui.reset')); s.onclick = () => showScene(st.instrument || ctx.L.scene.instrument, st.state); r.appendChild(s); }
    r.appendChild(h('div', { class: 'spacer' }));
    const nb = i < E.length - 1 ? h('button', { class: 'btn' }, t('ui.next')) : next(ctx, 'explore');
    if (i < E.length - 1) nb.onclick = () => stepExplore(ctx, i + 1);
    r.appendChild(nb);
    ctx.page.appendChild(r);
    const mark = (ok) => { if (!goal) return; goal.classList.toggle('ok', ok); goal.innerHTML = '<i>' + (ok ? '✓' : '') + '</i>' + t(ok ? 'ui.goalDone' : 'ui.goalTodo'); };
    onSceneChange = (s) => { if (st.goal && goalMet(st.goal, s)) mark(true); };
    if (st.state) showScene(st.instrument || ctx.L.scene.instrument, st.state);
    else if (!inst) showScene(ctx.L.scene.instrument, ctx.L.scene.state);
    if (st.goal && inst && goalMet(st.goal, inst.get())) mark(true);
  }

  function stepExplain(ctx) {
    head(ctx, 'explain');
    const box = h('div', { class: 'rule' });
    tl(ctx.id, 'explain').split('\n').forEach((p) => box.appendChild(h('p', null, p)));
    ctx.page.appendChild(box);
    const f = lookup(dict(), 'lessons.' + ctx.id + '.formula');
    if (f) ctx.page.appendChild(h('div', { class: 'formula' }, SC.render(f, {}, lang)));
    const r = h('div', { class: 'row' }); r.appendChild(next(ctx, 'explain')); ctx.page.appendChild(r);
    onSceneChange = null; const s = ctx.L.explainScene || ctx.L.scene; showScene(s.instrument, s.state);
  }

  function stepSandbox(ctx) {
    head(ctx, 'sandbox');
    ctx.page.appendChild(h('p', { class: 'lead' }, tl(ctx.id, 'sandbox')));
    const P = lp(ctx.id);
    ctx.page.appendChild(h('div', { class: 'box info' }, t('ui.summary', { s: P.solved.length, n: ctx.L.tasks.length })));
    const r = h('div', { class: 'row' }); r.appendChild(next(ctx, 'sandbox')); ctx.page.appendChild(r);
    onSceneChange = null; const s = ctx.L.sandbox || ctx.L.scene; showScene(s.instrument, Object.assign({}, s.state, { locked: false, labels: true }));
  }

  /* ---------- tasks ---------- */
  function seedFor(id, i, n) { let x = 2166136261; const s = id + ':' + i + ':' + n; for (let j = 0; j < s.length; j++) { x ^= s.charCodeAt(j); x = Math.imul(x, 16777619); } return x >>> 0; }
  function stepTasks(ctx, i, variant) {
    i = i || 0; variant = variant || 0;
    const P = lp(ctx.id);
    ctx.page.innerHTML = '';
    head(ctx, 'tasks');
    const nav = h('div', { class: 'tasknav' });
    ctx.L.tasks.forEach((_, j) => { const b = h('button', { 'aria-current': j === i ? 'true' : 'false', class: P.solved.includes(j) ? 'ok' : '' }, String(j + 1)); b.onclick = () => stepTasks(ctx, j); nav.appendChild(b); });
    ctx.page.appendChild(nav);
    const spec = ctx.L.tasks[i];
    const task = SC.makeTask(spec, seedFor(ctx.id, i, variant));
    const vars = Object.assign({}, task.vars);
    if (task.planet) vars.planet = t('ui.planets.' + task.planet);
    if (task.side) vars.side = t('ui.dir_' + task.side);
    const base = 'tasks.' + task.type + '.';
    ctx.page.appendChild(h('div', { class: 'level' }, '<i>' + [1, 2, 3].map((l) => '<b class="' + (l <= spec.level ? 'on' : '') + '"></b>').join('') + '</i>' + t('ui.level' + spec.level)));
    ctx.page.appendChild(h('p', { class: 'prompt' }, t(base + 'prompt', vars)));

    /* answer input */
    const ans = h('div', { class: 'answer' });
    let read;
    if (task.input === 'number') {
      const inp = h('input', { inputmode: 'decimal', 'aria-label': t('ui.answer'), autocomplete: 'off' }); ans.appendChild(inp);
      if (task.unit) ans.appendChild(h('span', { class: 'unit-l' }, t('ui.unit' + task.unit.replace('/', ''))));
      read = () => { const v = SC.parseNumber(inp.value); return isNaN(v) ? null : v; };
      inp.onkeydown = (e) => { if (e.key === 'Enter') check(); };
    } else if (task.input === 'fraction' || task.input === 'mixed') {
      let w = null;
      if (task.input === 'mixed') { w = h('input', { inputmode: 'numeric', 'aria-label': t('ui.whole') }); ans.appendChild(w); }
      const fin = h('div', { class: 'fin' }); const a = h('input', { inputmode: 'numeric', 'aria-label': t('ui.numerator') }); const b = h('input', { inputmode: 'numeric', 'aria-label': t('ui.denominator') });
      fin.appendChild(a); fin.appendChild(h('hr')); fin.appendChild(b); ans.appendChild(fin);
      read = () => { const n = SC.parseNumber(a.value), d = SC.parseNumber(b.value); if (isNaN(n) || isNaN(d) || d === 0) { if (!isNaN(n) && d === 0) return { num: n, den: 0 }; return null; } const r = { num: n, den: d }; if (w) { const wv = SC.parseNumber(w.value); if (isNaN(wv)) return null; r.w = wv; } return r; };
      [a, b, w].forEach((x) => x && (x.onkeydown = (e) => { if (e.key === 'Enter') check(); }));
    } else if (task.input === 'choice') {
      let sel = null; const ch = h('div', { class: 'choice' });
      task.options.forEach((o) => { const b = h('button', { 'aria-label': o }, SC.esc(o)); b.onclick = () => { sel = o; [...ch.children].forEach((x) => x.classList.toggle('sel', x === b)); }; ch.appendChild(b); });
      ans.appendChild(ch); read = () => sel;
    } else {
      ans.appendChild(h('div', { class: 'box info' }, t('ui.sceneAnswer')));
      read = () => (inst ? inst.get() : null);
    }
    ctx.page.appendChild(ans);

    const fb = h('div'); const hintsEl = h('div', { class: 'opts' });
    const row = h('div', { class: 'row' });
    const cb = h('button', { class: 'btn' }, t('ui.check')); cb.onclick = () => check();
    let hints = 0, usedSolution = false, tries = 0;
    const hb = h('button', { class: 'ghost' }, t('ui.hint', { n: 1 }));
    hb.onclick = () => { if (hints >= 3) return; hints++; hintsEl.appendChild(h('div', { class: 'box hint' }, '<div class="h">' + t('ui.hintN', { n: hints }) + '</div>' + t(base + 'h' + hints, vars))); hb.innerHTML = hints < 3 ? t('ui.hint', { n: hints + 1 }) : t('ui.noMoreHints'); hb.disabled = hints >= 3; if (hints >= 3) sb.hidden = false; };
    const sb = h('button', { class: 'ghost', hidden: '' }, t('ui.solution'));
    sb.onclick = () => { usedSolution = true; fb.innerHTML = ''; fb.appendChild(h('div', { class: 'box info' }, '<div class="h">' + t('ui.solution') + '</div>' + t(base + 'sol', vars))); };
    const another = h('button', { class: 'ghost' }, t('ui.another')); another.onclick = () => stepTasks(ctx, i, variant + 1);
    row.appendChild(cb); row.appendChild(hb); row.appendChild(sb); row.appendChild(h('div', { class: 'spacer' })); row.appendChild(another);
    ctx.page.appendChild(row); ctx.page.appendChild(hintsEl); ctx.page.appendChild(fb);

    function check() {
      const v = read();
      fb.innerHTML = '';
      if (v == null) { fb.appendChild(h('div', { class: 'box info' }, t('ui.typeAnswer'))); return; }
      tries++;
      const r = SC.checkTask(task, v);
      if (r.ok) {
        if (!P.solved.includes(i)) { P.solved.push(i); if (!usedSolution) sparks += 1; saveProgress(); }
        fb.appendChild(h('div', { class: 'box good' }, '<div class="h">' + t('ui.correct') + '</div>' + (usedSolution ? '' : t('ui.sparkPlus'))));
        nav.children[i].classList.add('ok');
        const nr = h('div', { class: 'row' });
        if (i < ctx.L.tasks.length - 1) { const nb = h('button', { class: 'btn' }, t('ui.nextTask')); nb.onclick = () => stepTasks(ctx, i + 1); nr.appendChild(nb); }
        else nr.appendChild(next(ctx, 'tasks'));
        fb.appendChild(nr);
      } else {
        const msg = r.err ? t(base + 'err.' + r.err, vars) : t('ui.wrong');
        fb.appendChild(h('div', { class: 'box bad' }, '<div class="h">' + t('ui.notYet') + '</div>' + msg));
        sb.hidden = false;
      }
    }

    onSceneChange = null;
    if (task.scene) showScene(task.scene.instrument, task.scene.state);
    else showScene(ctx.L.scene.instrument, Object.assign({}, ctx.L.scene.state, { locked: false }));
    if (row.closest) { /* keep focus friendly */ const first = ans.querySelector('input'); if (first && matchMedia('(pointer:fine)').matches) first.focus({ preventScroll: true }); }
  }

  /* ---------- router ---------- */
  function route() {
    applyLang();
    const m = location.hash.match(/^#\/l\/([^/]+)(?:\/(\w+))?/);
    if (m) showLesson(decodeURIComponent(m[1]), m[2]); else showCatalog();
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (kit) kit.setTheme(resolvedTheme()); });
  route();
})();
</script>
</body>
</html>
