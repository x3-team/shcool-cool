<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>School Cool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,600&family=Manrope:wght@400;600;700;800&family=JetBrains+Mono:wght@500&family=Noto+Sans+Arabic:wght@400;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;600;700&display=swap">
<style>:root{
  --bg:#ECEEEA; --surface:#FFFFFF; --page:#FBFAF6; --ink:#1F2326; --muted:#646B67; --line:#D8DCD6;
  --act:#2F62E8; --act-soft:#E8EEFF; --good:#1F8A5B; --good-soft:#E2F3EA; --bad:#C2462F; --bad-soft:#FBE9E5; --shade:#E39B37; --shade-soft:#FBEFD9;
  --sans:"Manrope","Noto Sans","Noto Sans Arabic","Noto Sans Devanagari","Noto Sans SC",system-ui,sans-serif;
  --serif:"Literata","Noto Serif",Georgia,serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171A19;--surface:#222625;--page:#1D2120;--ink:#ECEFEC;--muted:#A3AAA5;--line:#363C39;--act:#7D9EFF;--act-soft:#26304A;--good:#5CC48F;--good-soft:#1C3729;--bad:#F07A63;--bad-soft:#3D221D;--shade:#F0A94A;--shade-soft:#3A2D18;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171A19;--surface:#222625;--page:#1D2120;--ink:#ECEFEC;--muted:#A3AAA5;--line:#363C39;--act:#7D9EFF;--act-soft:#26304A;--good:#5CC48F;--good-soft:#1C3729;--bad:#F07A63;--bad-soft:#3D221D;--shade:#F0A94A;--shade-soft:#3A2D18;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
#app{height:100%;display:flex;flex-direction:column}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--act);outline-offset:2px;border-radius:10px}
[hidden]{display:none!important}

/* top bar */
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;min-width:0}
.logo{font-weight:800;font-size:17px;white-space:nowrap;text-decoration:none;color:inherit}.logo span{color:var(--act)}
.crumb{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.top select{background:var(--surface);border:0;border-radius:99px;padding:7px 12px;font-weight:700;font-size:14px;box-shadow:0 1px 0 var(--line);max-width:42vw}
.iconbtn{background:var(--surface);border-radius:99px;width:36px;height:36px;display:grid;place-items:center;box-shadow:0 1px 0 var(--line);flex:none}
.sparks{display:flex;align-items:center;gap:6px;font-weight:800;color:var(--shade);white-space:nowrap}

/* catalog */
.catalog{flex:1;min-height:0;max-width:1040px;width:100%;margin:0 auto;padding:8px 16px 48px;overflow:auto}
.hello{font-family:var(--serif);font-weight:600;font-size:clamp(28px,4vw,40px);line-height:1.1;margin:18px 0 6px}
.sub{color:var(--muted);margin:0 0 22px;max-width:60ch}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.filters select{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-weight:700;font-size:15px;color:var(--ink);min-width:200px}
.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:16px}
.unit{background:var(--surface);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px}
.unit .tint{display:flex;align-items:center;gap:12px}
.unit .badge{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex:none}
.unit h2{margin:0;font-size:21px;line-height:1.2}
.unit .map{color:var(--muted);font-size:14px;font-weight:600}
.lessons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.lessons a{display:flex;align-items:center;gap:12px;padding:9px 6px;border-radius:12px;color:inherit;text-decoration:none;font-weight:600}
.lessons a:hover{background:var(--bg)}
.lessons .num{font-family:var(--mono);color:var(--muted);font-size:13px;width:24px;flex:none}
.lessons .t{flex:1;min-width:0}
.lessons .st{font-size:13px;color:var(--muted);white-space:nowrap}
.lessons .st.done{color:var(--good);font-weight:800}
.note{color:var(--muted);font-size:13px;margin-top:28px;max-width:70ch}

/* lesson */
.lesson{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 16px 14px;gap:10px}
.book{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);gap:0;background:var(--page);border-radius:22px;overflow:hidden;box-shadow:0 1px 0 var(--line),0 18px 40px -28px rgba(0,0,0,.35)}
.page{padding:26px 26px 18px;overflow:auto;display:flex;flex-direction:column;gap:14px;border-inline-end:1px solid var(--line);min-height:0}
.page .k{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.page h1{font-family:var(--serif);font-weight:600;font-size:clamp(24px,2.6vw,32px);line-height:1.12;margin:0;text-wrap:balance}
.page p{margin:0}
.page .lead{font-size:18px}
.scene{position:relative;min-height:0;min-width:0;display:flex;flex-direction:column}
.stage3d{position:relative;flex:1;min-height:0}
.stage3d canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;background:var(--surface);color:var(--ink);border-radius:10px;padding:3px 9px 4px;font-weight:700;font-size:13px;white-space:nowrap;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.tag.big{font-size:16px;padding:5px 11px}
.tag.soft{background:transparent;box-shadow:none;color:var(--muted);font-size:12px}
.tag.mid{font-size:14px}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:8px 10px 12px;min-height:12px}
.stepper{display:inline-flex;align-items:center;gap:2px;background:var(--surface);border-radius:12px;padding:3px;box-shadow:0 1px 0 var(--line)}
.stepper .cap{font-size:12px;color:var(--muted);font-weight:700;padding:0 8px}
.stepper button{min-width:32px;height:32px;border-radius:9px;font-weight:800;color:var(--act);font-size:16px}
.stepper button:hover{background:var(--act-soft)}
.stepper b{min-width:44px;text-align:center;font-variant-numeric:tabular-nums;padding:0 4px}
.chips{display:inline-flex;gap:4px;flex-wrap:wrap}
.chip{background:var(--surface);border-radius:99px;padding:6px 12px;font-weight:700;font-size:13px;color:var(--act);box-shadow:0 1px 0 var(--line)}
.chip.on{background:var(--act);color:#fff}
.hint3d{position:absolute;left:50%;top:12px;transform:translateX(-50%);color:var(--muted);font-size:12px;font-weight:700;background:var(--surface);border-radius:99px;padding:4px 12px;pointer-events:none;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}

/* step bar */
.steps{display:flex;align-items:center;gap:6px;justify-content:center;flex-wrap:wrap}
.steps button{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;font-weight:700;font-size:14px;color:var(--muted);background:transparent}
.steps button b{font-family:var(--mono);font-weight:500;opacity:.7}
.steps button[aria-current="step"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.steps button.done{color:var(--good)}

/* controls on the page */
.btn{background:var(--act);color:#fff;font-weight:700;border-radius:12px;padding:11px 18px;white-space:nowrap}
.btn[disabled]{opacity:.4;cursor:default}
.ghost{color:var(--act);font-weight:700;padding:10px 8px;border-radius:10px}
.ghost:hover{background:var(--act-soft)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:start;background:var(--act-soft);color:var(--act);font-weight:700;border-radius:14px;padding:12px 14px;border:2px solid transparent}
.opt.right{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);color:var(--bad)}
.opt[disabled]{cursor:default}
.box{border-radius:14px;padding:12px 14px}
.box.good{background:var(--good-soft)}
.box.bad{background:var(--bad-soft)}
.box.info{background:var(--bg)}
.box.hint{background:var(--shade-soft)}
.box .h{font-weight:800;margin-bottom:4px}
.explore-n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.goal{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--muted)}
.goal.ok{color:var(--good)}
.goal i{width:20px;height:20px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font-style:normal;font-size:12px}
.goal.ok i{background:var(--good);border-color:var(--good);color:#fff}
.rule{font-size:17px;display:flex;flex-direction:column;gap:10px}
.formula{font-family:var(--serif);font-size:24px;background:var(--bg);border-radius:14px;padding:12px 16px;text-align:center}

/* tasks */
.tasknav{display:flex;gap:6px;flex-wrap:wrap}
.tasknav button{width:34px;height:34px;border-radius:10px;background:var(--bg);font-weight:800;font-size:14px;color:var(--muted)}
.tasknav button[aria-current="true"]{background:var(--act);color:#fff}
.tasknav button.ok{background:var(--good-soft);color:var(--good)}
.level{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.level i{display:inline-flex;gap:3px}.level i b{width:8px;height:8px;border-radius:50%;background:var(--line)}.level i b.on{background:var(--shade)}
.prompt{font-size:18px;font-weight:600}
.answer{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.answer input{width:86px;border:2px solid var(--line);border-radius:12px;padding:9px 10px;font-size:20px;font-weight:700;text-align:center;background:var(--surface);font-variant-numeric:tabular-nums}
.answer input:focus{border-color:var(--act);outline:none}
.fin{display:inline-flex;flex-direction:column;align-items:center;gap:4px}
.fin hr{width:100%;border:0;border-top:3px solid var(--ink);margin:0}
.fin input{width:70px;padding:6px}
.unit-l{font-weight:700;color:var(--muted)}
.choice{display:flex;gap:8px}
.choice button{width:56px;height:52px;border-radius:12px;background:var(--act-soft);color:var(--act);font-size:24px;font-weight:800}
.choice button.sel{background:var(--act);color:#fff}

/* fractions in text */
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .12em;font-variant-numeric:tabular-nums;font-weight:700}
.frac i{font-style:normal;padding:0 .15em}
.frac i:first-child{border-bottom:2px solid currentColor}
.mixw{font-weight:700}
.tag .frac{font-size:.92em}

/* mobile */
@media (max-width:820px){
  .lesson{flex:none}
  #app{height:auto;min-height:100%}
  .book{grid-template-columns:1fr;grid-template-rows:auto auto;overflow:visible}
  .scene{order:-1;height:46vh;min-height:280px;border-bottom:1px solid var(--line)}
  .page{border-inline-end:0;overflow:visible;padding:18px 16px}
  .steps{position:sticky;bottom:0;background:var(--bg);padding:6px 0 10px;flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start}
  .steps button span{display:none}
  .top select{max-width:34vw}
}

/* Letter-spacing and uppercase break joined and non-Latin scripts. */
:lang(ar) *, :lang(hi) *, :lang(zh) *{letter-spacing:0 !important}
:lang(ar) .page .k, :lang(hi) .page .k, :lang(zh) .page .k{font-family:var(--sans, inherit);font-size:13px;font-weight:700}
</style>
</head>

ит это [[k/n]].","err":{"ticks":"Похоже, ты посчитал чёрточки, а не промежутки между ними. Частей на одну меньше, чем чёрточек.","flip":"Числитель и знаменатель поменялись местами."}},"frac.place":{"prompt":"Поставь бусину на [[k/n]]. Двигай её пальцем или стрелками под сценой.","h1":"Сначала сделай так, чтобы отрезок от 0 до 1 был разделён на {n} частей.","h2":"Каждая часть — это [[1/n]].","h3":"Отсчитай от нуля {k} частей.","sol":"Делим отрезок от 0 до 1 на {n} равных частей и отсчитываем от нуля {k}.","err":{"offByOne":"Почти! Бусина стоит на соседней отметке. Пересчитай части от нуля."}},"frac.equiv":{"prompt":"Какое число нужно вписать вместо знака вопроса? [[a/b]] = ? / {bm}","h1":"Во сколько раз {bm} больше, чем {b}?","h2":"Знаменатель увеличили в {m} раза. Чтобы дробь не изменилась, числитель увеличиваем во столько же раз.","h3":"{a} · {m} = ?","sol":"{bm} = {b} · {m}, поэтому числитель тоже умножаем на {m}: {a} · {m} = {am}. Значит, [[a/b]] = [[am/bm]].","err":{"add":"Ты прибавил к числителю столько же, сколько к знаменателю. Так дробь меняется. Числитель и знаменатель нужно умножать на одно и то же число.","same":"Знаменатель стал больше, значит доли стали мельче. Чтобы часть осталась той же, числитель тоже нужно увеличить."}},"frac.simplify":{"prompt":"Сократи дробь [[ag/bg]] до конца.","h1":"Найди число, на которое делятся и {ag}, и {bg}.","h2":"Попробуй разделить оба числа на {g}.","h3":"{ag} : {g} = ?   {bg} : {g} = ?","sol":"{ag} и {bg} делятся на {g}: [[ag/bg]] = [[a/b]]. Дальше сокращать нельзя.","err":{"notLowest":"Дробь равна нужной, но её можно сократить ещё. Найди общий делитель числителя и знаменателя."}},"frac.compare":{"prompt":"Сравни дроби: [[a/b]] ? [[c/d]]","h1":"Если знаменатели одинаковые, больше та дробь, у которой больше числитель.","h2":"Если числители одинаковые, больше та дробь, у которой знаменатель меньше: её доли крупнее.","h3":"Если всё разное, приведи дроби к общему знаменателю {l}: получится [[al/l]] и [[cl/l]].","sol":"Приводим к знаменателю {l}: [[a/b]] = [[al/l]], [[c/d]] = [[cl/l]]. Сравниваем числители {al} и {cl}.","err":{"bigDen":"Числители одинаковые, а знаменатель больше — значит доли мельче. Такая дробь меньше, а не больше."}},"frac.addSame":{"prompt":"Сложи: [[a/n]] + [[b/n]]","h1":"Доли одинаковые, по [[1/n]]. Складываем только количество долей.","h2":"{a} + {b} = ?","h3":"Знаменатель остаётся {n}.","sol":"[[a/n]] + [[b/n]] = [[s/n]]: складываем числители, знаменатель не меняется.","err":{"addDen":"Знаменатели складывать не нужно: размер доли не меняется, меняется только их количество."}},"frac.subSame":{"prompt":"Вычти: [[a/n]] − [[b/n]]","h1":"Было {a} долей по [[1/n]], убрали {b}.","h2":"{a} − {b} = ?","h3":"Знаменатель остаётся {n}.","sol":"[[a/n]] − [[b/n]] = [[s/n]]: вычитаем числители, знаменатель не меняется.","err":{"subDen":"Знаменатели вычитать не нужно: размер доли не меняется."}},"frac.lcd":{"prompt":"Найди наименьший общий знаменатель для дробей со знаменателями {b} и {d}.","h1":"Общий знаменатель делится и на {b}, и на {d}.","h2":"Выпиши числа, кратные {b}: {b}, {b*2}, {b*3}… Какое из них первым делится на {d}?","h3":"Произведение {b} · {d} = {p} подходит всегда, но бывает число меньше.","sol":"Наименьшее число, которое делится и на {b}, и на {d}, — это {l}.","err":{"product":"{p} подходит, но это не наименьший общий знаменатель. Поищи число меньше.","notLeast":"Это общий знаменатель, но не наименьший. Есть число меньше."}},"frac.addUnlike":{"prompt":"Вычисли: [[a/b]] {op} [[c/d]]","h1":"Знаменатели разные, поэтому сначала приведи дроби к общему знаменателю.","h2":"Общий знаменатель — {l}: [[a/b]] = [[al/l]], [[c/d]] = [[cl/l]].","h3":"Теперь {al} {op} {cl} = ?","sol":"[[a/b]] {op} [[c/d]] = [[al/l]] {op} [[cl/l]] = [[s/l]]. В несократимом виде: [[sn/sd]].","err":{"addDen":"Складывать или вычитать числители и знаменатели по отдельности нельзя: доли разного размера. Сначала приведи к общему знаменателю.","noScale":"Знаменатель общий, но числители тоже нужно домножить: [[a/b]] = [[al/l]], [[c/d]] = [[cl/l]]."}},"frac.toImproper":{"prompt":"Запиши [[w a/n]] неправильной дробью. Какое число будет в числителе? ? / {n}","h1":"В одном целом {n} долей по [[1/n]].","h2":"В {w} целых: {w} · {n} = {wn} долей.","h3":"Прибавь ещё {a}.","sol":"{w} · {n} + {a} = {t}, значит [[w a/n]] = [[t/n]].","err":{"wPlusA":"Целую часть нужно умножить на знаменатель, а не просто прибавить.","forgotA":"Не забудь прибавить дробную часть: ещё {a} долей."}},"frac.toMixed":{"prompt":"Выдели целую часть: [[t/n]]","h1":"Сколько целых раз {n} помещается в {t}?","h2":"{t} : {n} = {w}, остаток {a}.","h3":"Целая часть — это частное, числитель — остаток, знаменатель тот же.","sol":"{t} : {n} = {w}, остаток {a}. Значит, [[t/n]] = [[w a/n]].","err":{"swap":"Целая часть и числитель поменялись местами. Целая часть — это сколько раз знаменатель помещается в числителе."}},"frac.ofNumber":{"prompt":"Найди [[a/b]] от {N}. Можешь отламывать полоски шоколадки.","h1":"Сначала найди одну долю: раздели {N} на {b}.","h2":"[[1/b]] от {N} — это {q}.","h3":"Теперь возьми таких долей {a}.","sol":"{N} : {b} = {q}, затем {q} · {a} = {ans}.","err":{"divOnly":"Это только [[1/b]]. Нужно взять {a} таких доли.","mulOnly":"Сначала раздели на знаменатель, потом умножь на числитель."}},"frac.toDecimal":{"prompt":"Запиши десятичной дробью: [[k/d]]","h1":"Знаменатель {d}. Сколько знаков будет после запятой?","h2":"[[1/10]] = 0,1, а [[1/100]] = 0,01.","h3":"Запиши числитель {k} так, чтобы его последняя цифра стояла в нужном разряде.","sol":"[[k/d]] = {x}.","err":{"place":"Цифры верные, но стоят не на своих местах. В сотых два знака после запятой, в десятых — один."}},"force.gravity":{"prompt":"Ящик массой {m} кг стоит на Земле. С какой силой Земля его притягивает? Считай g = 10 Н/кг.","h1":"Сила тяжести: F = m · g.","h2":"m = {m} кг, g = 10 Н/кг.","h3":"{m} · 10 = ?","sol":"F = m · g = {m} кг · 10 Н/кг = {F} Н.","err":{"noG":"Это масса в килограммах, а нужна сила в ньютонах. Умножь массу на g."}},"force.gravityGrams":{"prompt":"Масса тела {mg} г. Найди силу тяжести, которая на него действует. Считай g = 10 Н/кг.","h1":"Сначала переведи граммы в килограммы: в 1 кг 1000 г.","h2":"{mg} г = {m} кг.","h3":"F = {m} · 10 = ?","sol":"{mg} г = {m} кг. F = {m} кг · 10 Н/кг = {F} Н.","err":{"grams":"Массу нужно перевести в килограммы: {mg} г = {m} кг.","noG":"Нужна сила в ньютонах: умножь массу в килограммах на g."}},"force.planet":{"prompt":"Ровер массой {m} кг стоит на поверхности. Планета: {planet}, g = {g} Н/кг. С какой силой планета его притягивает?","h1":"Формула та же: F = m · g, только g другое.","h2":"Здесь g = {g} Н/кг, а не 10.","h3":"{m} · {g} = ?","sol":"F = {m} кг · {g} Н/кг = {F} Н.","err":{"earthG":"Ты взял g для Земли. Здесь g = {g} Н/кг."}},"force.massFromWeight":{"prompt":"На тело действует сила тяжести {P} Н. Какова его масса? Считай g = 10 Н/кг.","h1":"F = m · g, значит m = F : g.","h2":"{P} : 10 = ?","h3":"Ответ получится в килограммах.","sol":"m = F : g = {P} Н : 10 Н/кг = {m} кг.","err":{"mult":"Нужно не умножать, а делить: m = F : g."}},"force.hooke":{"prompt":"Жёсткость пружины {k} Н/м. Её растянули на {cm} см. Какая сила упругости возникла?","h1":"Закон Гука: F = k · Δl.","h2":"Переведи сантиметры в метры: {cm} см = {x} м.","h3":"{k} · {x} = ?","sol":"F = k · Δl = {k} Н/м · {x} м = {F} Н.","err":{"cm":"Растяжение нужно перевести в метры: {cm} см = {x} м."}},"force.stiffness":{"prompt":"Под действием силы {F} Н пружина растянулась на {cm} см. Найди её жёсткость.","h1":"Из F = k · Δl следует k = F : Δl.","h2":"Δl = {cm} см = {x} м.","h3":"{F} : {x} = ?","sol":"k = F : Δl = {F} Н : {x} м = {k} Н/м.","err":{"cm":"Растяжение должно быть в метрах: {cm} см = {x} м.","invert":"Нужно делить силу на растяжение, а не умножать."}},"force.springScene":{"prompt":"Жёсткость пружины {k} Н/м, каждый груз весит 1 Н. Подвесь столько грузов, чтобы пружина растянулась на {cm} см.","h1":"Сила, которая нужна для такого растяжения: F = k · Δl.","h2":"Δl = {x} м, значит F = {k} · {x}.","h3":"Нужна сила {F} Н, а каждый груз даёт 1 Н.","sol":"F = {k} Н/м · {x} м = {F} Н. Это {n} грузов по 1 Н.","err":{"tooMany":"Слишком много: пружина растянулась сильнее. Сними груз.","tooFew":"Пока мало: растяжение меньше нужного. Добавь груз."}},"force.sumSame":{"prompt":"Двое тянут санки в одну сторону с силами {a} Н и {b} Н. Найди равнодействующую.","h1":"Силы направлены в одну сторону и помогают друг другу.","h2":"Значит, их нужно сложить.","h3":"{a} + {b} = ?","sol":"R = {a} Н + {b} Н = {R} Н, в ту же сторону.","err":{"diff":"Силы в одну сторону складываются, а не вычитаются."}},"force.sumOpp":{"prompt":"Ящик тянут влево с силой {a} Н и вправо с силой {b} Н. Найди равнодействующую.","h1":"Силы направлены в разные стороны и мешают друг другу.","h2":"Из большей силы вычти меньшую.","h3":"Ящик поедет туда, где сила больше: {side}.","sol":"R = {R} Н (большая сила минус меньшая), ящик поедет {side}.","err":{"sum":"Силы в разные стороны не складываются: из большей вычитаем меньшую."}},"force.tugScene":{"prompt":"Слева ящик тянут с силой {a} Н. Подбери силу справа, чтобы ящик стоял на месте.","h1":"Ящик покоится, если силы уравновешены.","h2":"Уравновешены — значит равны по величине и направлены в разные стороны.","h3":"Справа нужна такая же сила, как слева.","sol":"Справа нужно {a} Н, тогда равнодействующая равна нулю.","err":{"tooMany":"Сила справа больше, ящик поедет вправо. Уменьши её.","tooFew":"Сила справа меньше, ящик поедет влево. Увеличь её."}},"force.friction":{"prompt":"Ящик массой {m} кг тянут по полу. Коэффициент трения μ = {mu}. Какая сила трения скольжения действует на ящик? Считай g = 10 Н/кг.","h1":"Сила трения: F = μ · N, где N — сила, с которой ящик давит на пол.","h2":"На горизонтальном полу N = m · g = {N} Н.","h3":"{mu} · {N} = ?","sol":"F = μ · m · g = {mu} · {m} кг · 10 Н/кг = {F} Н.","err":{"noG":"Ты умножил μ на массу. Нужна сила давления: N = m · g.","noMu":"Это сила давления на пол. Умножь её на коэффициент трения μ."}},"force.uniform":{"prompt":"Ящик тянут по полу с постоянной скоростью. Динамометр показывает {F} Н. Чему равна сила трения?","h1":"Постоянная скорость значит, что силы вдоль пола уравновешены.","h2":"Вдоль пола действуют только тяга и трение.","h3":"Сила трения равна силе тяги.","sol":"При равномерном движении сила трения равна силе тяги: {F} Н.","err":{"zero":"Ящик скользит по полу, значит трение есть. При равномерном движении оно равно силе тяги."}}},"lessons":{"math5.fr01-parts":{"title":"Доли и дроби","hook":"Как честно поделить пирог на четверых?","page":"Если разрезать целое на равные части, каждая часть называется долей.\nДробь говорит, сколько таких долей мы взяли. Внизу пишем, на сколько долей разрезали целое, — это знаменатель. Вверху — сколько долей взяли, это числитель.","predict":{"q":"Пиццу разрезали на 8 равных кусков, ты съел 2. Какую часть пиццы ты съел?","opts":["[[2/6]]","[[2/8]]","[[8/2]]"],"why":"Всего 8 равных кусков — это знаменатель. Ты взял 2 — это числитель. Получается [[2/8]]."},"explore":["Нажми на один кусок пирога, чтобы закрасить его. Это одна четвёртая: [[1/4]].","Закрась ещё два куска. Сколько теперь закрашено? Это [[3/4]].","Кнопками «Долей» под сценой разрежь пирог на 8 частей.","Закрась [[5/8]] пирога."],"explain":"Дробь [[3/4]] читается «три четвёртых».\nЗнаменатель (4) показывает, на сколько **равных** частей разделили целое. Числитель (3) — сколько таких частей взяли.\nЕсли части неравные, дробью их называть нельзя.","formula":"[[3/4]] — взяли 3 доли из 4","sandbox":"Режь пироги на любое число долей и закрашивай. Попробуй найти две разные дроби, у которых закрашено одинаково."},"math5.fr02-number-line":{"title":"Дробь на числовой прямой","hook":"Где живёт [[1/2]]? Между 0 и 1!","page":"Дробь — это тоже число. У неё есть своё место на числовой прямой.\nЧтобы найти [[3/4]], делим отрезок от 0 до 1 на 4 равные части и отсчитываем от нуля три.","predict":{"q":"Где на отрезке от 0 до 1 стоит [[1/2]]?","opts":["Ближе к 0","Ровно посередине","Ближе к 1"],"why":"Половина делит отрезок на две равные части, поэтому [[1/2]] стоит ровно посередине."},"explore":["Перетащи бусину на [[3/4]]. Можно пальцем или стрелками.","Нажми «+» у «Частей», пока их не станет 8. Бусина осталась на месте, но теперь это [[6/8]].","Эта линейка доходит до 2. Поставь бусину на [[4/3]] — дробь больше единицы."],"explain":"Чтобы отметить дробь, делим отрезок от 0 до 1 на столько равных частей, сколько в знаменателе, и отсчитываем от нуля столько частей, сколько в числителе.\nЕсли числитель больше знаменателя, дробь больше единицы и стоит правее 1.","sandbox":"Двигай бусину и меняй число частей. Найди на прямой две разные записи одного и того же числа."},"math5.fr03-equivalent":{"title":"Равные дроби","hook":"Половина пиццы или две четвертинки — кому больше?","page":"Одну и ту же часть целого можно записать разными дробями.\nЕсли каждую долю разрезать ещё пополам, долей станет вдвое больше, но и взятых долей — тоже вдвое больше.","predict":{"q":"Что больше: [[1/2]] пирога или [[2/4]] пирога?","opts":["[[1/2]] больше","Одинаково","[[2/4]] больше"],"why":"Две четвертинки складываются ровно в половину. Это одна и та же часть пирога."},"explore":["Слева закрашена половина. Закрась на втором пироге столько четвертинок, чтобы закрашено было столько же.","А теперь [[1/3]]. Сколько шестых долей нужно закрасить, чтобы было столько же?","[[2/3]] = ? / 9. Закрась на втором пироге нужное число девятых."],"explain":"Если числитель и знаменатель умножить на одно и то же число, дробь не изменится.\n[[1/2]] = [[2/4]] = [[3/6]] = [[4/8]]. Это называют основным свойством дроби.","formula":"[[2/3]] = [[4/6]] = [[6/9]]","sandbox":"Режь пироги на разное число долей и ищи равные дроби."},"math5.fr04-simplify":{"title":"Сокращение дробей","hook":"[[6/8]] и [[3/4]] — одно и то же. Какая запись проще?","page":"Основное свойство дроби работает и в обратную сторону: числитель и знаменатель можно разделить на одно и то же число.\nЭто называется сокращением. Дробь становится короче, а часть целого — той же.","predict":{"q":"[[6/8]] пирога — это сколько четвертей?","opts":["[[2/4]]","[[3/4]]","[[6/4]]"],"why":"Каждые две восьмые складываются в одну четвёртую. Шесть восьмых — это три четвёртых."},"explore":["Уменьши число долей до 4 кнопкой «−». Закрашенное останется тем же: [[6/8]] превратится в [[3/4]].","[[4/10]]: сократи до пятых — сделай 5 долей."],"explain":"Чтобы сократить дробь, делим числитель и знаменатель на их общий делитель.\n[[6/8]]: оба числа делятся на 2, получаем [[3/4]]. Дальше 3 и 4 общих делителей не имеют — дробь несократима.","formula":"[[6/8]] = [[3/4]]","sandbox":"Попробуй сократить [[8/12]] пирога, уменьшая число долей."},"math5.fr05-compare":{"title":"Сравнение дробей","hook":"Что лучше: [[1/3]] торта или [[1/5]] торта?","page":"Сравнивать дроби легко, если у них одинаковые знаменатели или одинаковые числители.\nЕсли всё разное, сначала делаем доли одинаковыми.","predict":{"q":"Что больше: [[1/3]] или [[1/5]]?","opts":["[[1/3]]","Одинаково","[[1/5]]"],"why":"Чем на больше частей разрезано целое, тем мельче каждая часть. Треть больше пятой части."},"explore":["Знаменатели одинаковые — [[2/6]] и [[5/6]]. Больше та дробь, где больше закрашенных долей.","Числители одинаковые — [[1/3]] и [[1/5]]. Сравни, какой кусок крупнее.","[[2/3]] и [[3/4]]. Разрежь оба пирога на 12 долей и сравни, где закрашено больше."],"explain":"Одинаковые знаменатели: больше дробь с большим числителем.\nОдинаковые числители: больше дробь с меньшим знаменателем.\nВсё разное: приводим к общему знаменателю и сравниваем числители. [[2/3]] = [[8/12]], [[3/4]] = [[9/12]], значит [[3/4]] больше.","sandbox":"Сделай два пирога и попробуй закрасить их так, чтобы дроби были разными, а закрашенное — одинаковым."},"math5.fr06-add-same":{"title":"Сложение и вычитание с одинаковыми знаменателями","hook":"Три восьмых плюс две восьмых — это сколько восьмых?","page":"Когда доли одинаковые, складывать их просто: считаем, сколько долей стало.\nРазмер доли при этом не меняется, поэтому знаменатель остаётся прежним.","predict":{"q":"[[3/8]] + [[2/8]] = ?","opts":["[[5/16]]","[[5/8]]","[[6/8]]"],"why":"Складываем доли: 3 + 2 = 5 долей по [[1/8]]. Доли не стали меньше, поэтому знаменатель остаётся 8."},"explore":["На первом пироге 3 доли из 8, на втором 2. Сколько долей вместе?","Сложи их на одном пироге: закрась 3 + 2 доли.","Вычитание: было [[5/6]], съели [[3/6]]. Сними закраску с трёх долей."],"explain":"Чтобы сложить дроби с одинаковыми знаменателями, складываем числители, а знаменатель оставляем.\nС вычитанием так же: вычитаем числители, знаменатель не меняется.","formula":"[[3/8]] + [[2/8]] = [[5/8]]","sandbox":"Придумай свой пример на сложение и покажи его на пирогах."},"math5.fr07-common-denominator":{"title":"Общий знаменатель","hook":"Как сложить половину и треть, если куски разного размера?","page":"Складывать можно только одинаковые доли. Поэтому сначала режем оба целых на одинаковые доли.\nЧисло долей, которое подходит обоим, называется общим знаменателем.","predict":{"q":"Как сложить [[1/2]] и [[1/3]]?","opts":["Сложить числители и знаменатели: [[2/5]]","Разрезать оба пирога на одинаковые доли","Никак, их нельзя сложить"],"why":"Половину и треть можно разрезать на шестые: [[1/2]] = [[3/6]], [[1/3]] = [[2/6]]. Теперь доли одинаковые."},"explore":["Сделай на обоих пирогах одинаковое число долей так, чтобы закрашенное не изменилось. Попробуй 6.","[[1/4]] и [[1/6]]: 24 доли подойдут, но есть число меньше. Найди его."],"explain":"Общий знаменатель делится на оба знаменателя. Удобнее всего наименьший.\nНайти его можно так: выписываем числа, кратные большему знаменателю, пока не найдём то, что делится и на меньший.\nДля 4 и 6: 6, 12 — подходит 12.","sandbox":"Выбери любые две дроби и найди для них общий знаменатель на пирогах."},"math5.fr08-add-unlike":{"title":"Сложение с разными знаменателями","hook":"[[1/2]] + [[1/4]] — это сколько?","page":"Сначала приводим дроби к общему знаменателю, потом складываем числители.\nЕсли ответ можно сократить, сокращаем.","predict":{"q":"[[1/2]] + [[1/4]] = ?","opts":["[[2/6]]","[[3/4]]","[[2/4]]"],"why":"Половина — это две четвертинки. [[2/4]] + [[1/4]] = [[3/4]]."},"explore":["Разрежь первый пирог на четвертинки. Сколько четвертей закрашено?","Сложи на одном пироге: [[2/4]] + [[1/4]].","[[2/3]] − [[1/2]]: сделай оба пирога шестыми и сравни."],"explain":"1. Находим общий знаменатель.\n2. Домножаем числитель и знаменатель каждой дроби, чтобы получить этот знаменатель.\n3. Складываем или вычитаем числители.\n4. Сокращаем ответ, если можно.","formula":"[[2/3]] − [[1/2]] = [[4/6]] − [[3/6]] = [[1/6]]","sandbox":"Проверь на пирогах: [[2/3]] + [[1/4]] = [[11/12]]?"},"math5.fr09-mixed":{"title":"Смешанные числа","hook":"Полтора пирога — это сколько половинок?","page":"Если долей больше, чем в одном целом, получается неправильная дробь, например [[7/4]].\nЕё можно записать иначе: целая часть и дробная, [[1 3/4]]. Это смешанное число.","predict":{"q":"Сколько четвертей в [[1 3/4]]?","opts":["4","7","13"],"why":"В одном целом 4 четверти, и ещё 3: всего 7. [[1 3/4]] = [[7/4]]."},"explore":["Один целый пирог и ещё [[3/4]]. Это смешанное число [[1 3/4]], или [[7/4]].","Сделай [[2 2/3]]: закрась на третьем пироге нужное число долей. Сколько всего третей?"],"explain":"Смешанное число в дробь: целую часть умножаем на знаменатель и прибавляем числитель.\nДробь в смешанное число: делим числитель на знаменатель с остатком. Частное — целая часть, остаток — новый числитель.","formula":"[[2 2/3]] = [[8/3]]","sandbox":"Собери из пирогов смешанное число и запиши его неправильной дробью."},"math5.fr10-of-number":{"title":"Дробь от числа","hook":"В шоколадке 12 долек. Сколько долек в двух третях?","page":"Чтобы найти дробь от числа, делим число на знаменатель — так находим одну долю.\nПотом умножаем на числитель — берём нужное число долей.","predict":{"q":"В шоколадке 12 долек. Сколько долек в [[2/3]] шоколадки?","opts":["6","8","9"],"why":"Треть от 12 — это 4 дольки. Две трети — 8 долек."},"explore":["Шоколадка поделена на 3 равные полоски. Отломи [[2/3]]: нажми на 2 полоски.","20 долек, 4 полоски. Отломи [[3/4]]. Сколько это долек?"],"explain":"Чтобы найти дробь от числа, сначала делим число на знаменатель, потом умножаем на числитель.\n[[2/3]] от 12: 12 : 3 = 4, 4 · 2 = 8.","formula":"[[2/3]] от 12 = 12 : 3 · 2 = 8","sandbox":"Отламывай полоски и считай: какая часть шоколадки у тебя и сколько в ней долек."},"math5.fr11-decimals":{"title":"Десятичные дроби","hook":"[[3/10]] можно записать короче!","page":"Дроби со знаменателем 10, 100, 1000 удобно записывать через запятую.\n[[3/10]] = 0,3 — три десятых. [[7/100]] = 0,07 — семь сотых.","predict":{"q":"Как ещё записать [[3/10]]?","opts":["3,10","0,3","0,03"],"why":"Десятые записывают в первом разряде после запятой: [[3/10]] = 0,3."},"explore":["Отрезок от 0 до 1 разделён на 10 частей. Поставь бусину на 0,7 — это [[7/10]].","Где 0,5? Заметь: это ещё и половина."],"explain":"Первая цифра после запятой — десятые, вторая — сотые.\n[[45/100]] = 0,45. [[5/100]] = 0,05: ноль в разряде десятых обязателен.","formula":"[[7/10]] = 0,7   [[7/100]] = 0,07","sandbox":"Двигай бусину и смотри, как меняется десятичная запись."},"math5.fr12-mission":{"title":"Итоговая миссия: дроби","hook":"Шесть задач на всё, что ты узнал о дробях.","page":"В этой миссии задачи из разных уроков: прочитать дробь, найти её на прямой, сократить, сравнить, сложить и найти дробь от числа.\nЕсли что-то забыл, подсказки помогут.","predict":{"q":"Какая дробь больше единицы?","opts":["[[7/8]]","[[8/8]]","[[9/8]]"],"why":"[[8/8]] — это ровно один целый пирог. [[9/8]] — целый пирог и ещё одна восьмая."},"explore":["Разминка: закрась [[9/8]] на двух пирогах."],"explain":"Шпаргалка.\nЧислитель — сколько долей взяли, знаменатель — на сколько долей разделили целое.\nУмножать или делить числитель и знаменатель на одно число можно — дробь не меняется.\nСкладывать можно только одинаковые доли.","sandbox":"Свободная игра с пирогами: придумай задачу для друга."},"phys7.f01-force":{"title":"Что такое сила","hook":"Почему ящик едет, если его тянуть, и стоит, если тянуть с двух сторон?","page":"Сила — это действие одного тела на другое. Сила может сдвинуть тело, остановить его или изменить его форму.\nСилу измеряют в ньютонах (Н). На рисунках силу показывают стрелкой: направление стрелки — куда действует сила, длина — насколько она велика.","predict":{"q":"Двое тянут ящик в разные стороны с одинаковой силой. Что будет?","opts":["Поедет влево","Останется на месте","Поедет вправо"],"why":"Одинаковые силы в разные стороны уравновешивают друг друга. Ящик стоит."},"explore":["Слева и справа ящик тянут с силой 20 Н. Стрелки одинаковой длины, ящик стоит.","Увеличь силу справа до 40 Н. Куда поехал ящик?","Теперь уравновесь ящик: сделай силу слева такой же."],"explain":"Сила характеризуется величиной и направлением.\nЕдиница силы — ньютон (Н). Примерно с силой 1 Н Земля притягивает яблоко массой 100 г.","sandbox":"Меняй силы слева и справа и смотри, куда едет ящик."},"phys7.f02-gravity":{"title":"Сила тяжести","hook":"Почему всё падает вниз — и почему на Луне прыгать легче?","page":"Земля притягивает к себе все тела. Эта сила называется силой тяжести.\nЧем больше масса тела, тем сильнее его притягивает Земля. На других планетах притяжение другое.","predict":{"q":"Какой ящик Земля притягивает сильнее?","opts":["Массой 1 кг","Одинаково","Массой 10 кг"],"why":"Сила тяжести пропорциональна массе: 10 кг притягиваются в 10 раз сильнее, чем 1 кг."},"explore":["Увеличь массу ящика до 10 кг. Посмотри на стрелку и число.","Перенеси ящик на Луну. Масса та же, а сила?","А теперь на Юпитер."],"explain":"Сила тяжести: F = m · g.\nm — масса в килограммах, g — сколько ньютонов приходится на каждый килограмм. На Земле g ≈ 9,8 Н/кг, в задачах берут 10 Н/кг.\nНа Луне g ≈ 1,6 Н/кг, поэтому там всё в 6 раз легче поднять.","formula":"F = m · g","sandbox":"Подбирай массу и планету. Где тебе было бы легче всего прыгать?"},"phys7.f03-spring":{"title":"Сила упругости","hook":"Как пружина узнаёт, какой груз на ней висит?","page":"Если растянуть или сжать пружину, в ней возникает сила упругости. Она стремится вернуть пружине прежнюю форму.\nЧем сильнее растянута пружина, тем больше сила упругости. На этом устроен динамометр — прибор для измерения силы.","predict":{"q":"С одним грузом пружина растянулась на 2 см. На сколько она растянется с тремя такими грузами?","opts":["3 см","6 см","9 см"],"why":"Растяжение пропорционально силе: втрое больше груз — втрое больше растяжение, 6 см."},"explore":["Повесь один груз массой 100 г — на него действует сила тяжести 1 Н. Нажми на стопку грузов на столе.","Добавь ещё два груза. Во сколько раз выросло растяжение?","Возьми пружину пожёстче: 100 Н/м. Что стало с растяжением?"],"explain":"Закон Гука: сила упругости пропорциональна растяжению.\nF = k · Δl, где Δl — растяжение в метрах, k — жёсткость пружины в Н/м.\nЖёсткая пружина растягивается меньше при той же силе.","formula":"F = k · Δl","sandbox":"Подвешивай грузы и меняй пружины. Сделай свой динамометр: запомни, сколько сантиметров даёт 1 Н."},"phys7.f04-weight":{"title":"Вес тела","hook":"Масса и вес — это одно и то же?","page":"Вес — это сила, с которой тело давит на опору или растягивает подвес. Вес измеряют в ньютонах, а массу — в килограммах.\nЕсли тело и опора неподвижны, вес равен силе тяжести: P = m · g.","predict":{"q":"Масса яблока 200 г. Каков его вес на Земле?","opts":["200 Н","2 Н","0,2 Н"],"why":"200 г = 0,2 кг. P = 0,2 кг · 10 Н/кг = 2 Н."},"explore":["Поставь на опору 1 кг. Вес — это сила, с которой ящик давит на опору.","Перенеси ящик на Луну. Масса та же, а вес примерно в 6 раз меньше."],"explain":"Масса показывает, сколько вещества в теле, и не зависит от планеты.\nВес — сила, он зависит от g: P = m · g.\nНа Луне твоя масса та же, а вес в 6 раз меньше.","formula":"P = m · g","sandbox":"Сравни вес одного и того же ящика на разных планетах."},"phys7.f05-friction":{"title":"Сила трения","hook":"Почему тяжёлый шкаф так трудно сдвинуть с места?","page":"Когда одно тело скользит по другому, возникает сила трения. Она направлена против движения.\nТрение зависит от поверхностей и от того, как сильно тело прижато к опоре.","predict":{"q":"Ящик тянут, а он стоит на месте. Почему?","opts":["Сила тяги больше трения","Трение уравновешивает тягу","На ящик ничего не действует"],"why":"Пока ящик стоит, сила трения покоя равна силе тяги и уравновешивает её."},"explore":["Потяни за синее кольцо динамометра или нажимай «+». При какой силе ящик поедет?","Поставь ящик на лёд. Сколько теперь нужно, чтобы сдвинуть?","Увеличь массу до 10 кг. Как изменилось трение?"],"explain":"Сила трения скольжения: F = μ · N.\nN — сила, с которой тело давит на опору. На горизонтальном полу N = m · g.\nμ — коэффициент трения: у льда он маленький, у резины большой.","formula":"F = μ · m · g","sandbox":"Попробуй все поверхности и разные массы. Где трение самое маленькое?"},"phys7.f06-sum":{"title":"Сложение сил","hook":"Если тянуть вдвоём, получится в два раза сильнее?","page":"Если на тело действуют несколько сил, их можно заменить одной — равнодействующей.\nСилы в одну сторону складываются. Силы в разные стороны вычитаются, и равнодействующая направлена в сторону большей.","predict":{"q":"Двое тянут ящик вправо: один с силой 30 Н, другой 20 Н. С какой силой они тянут вместе?","opts":["10 Н","50 Н","600 Н"],"why":"Силы направлены в одну сторону, поэтому складываются: 30 + 20 = 50 Н."},"explore":["Сейчас ящик тянут вправо с силой 30 Н. Добавь справа ещё 20 Н.","Слева 30 Н, справа 50 Н. Равнодействующая — 20 Н вправо: большая минус меньшая.","Увеличь силу слева до 50 Н. Что стало с равнодействующей?"],"explain":"Силы вдоль одной прямой:\nв одну сторону — R = F₁ + F₂;\nв разные стороны — R = большая − меньшая, направлена в сторону большей.\nЕсли R = 0, тело ведёт себя так, будто сил нет.","sandbox":"Подбери силы так, чтобы равнодействующая была 10 Н влево."},"phys7.f07-balance":{"title":"Равновесие","hook":"Почему висящая люстра не падает?","page":"Тело находится в равновесии, если все силы, действующие на него, уравновешены. Тогда равнодействующая равна нулю.\nПокоящееся тело остаётся в покое, а движущееся движется равномерно.","predict":{"q":"Ящик стоит на месте. Значит, на него…","opts":["Не действуют никакие силы","Действуют уравновешенные силы","Действует только сила тяжести"],"why":"На ящик всегда действует сила тяжести. Он стоит, потому что её уравновешивает опора."},"explore":["Слева 60 Н, справа 20 Н. Уравновесь ящик, добавив силу справа.","Груз висит на пружине неподвижно: сила упругости вверх равна силе тяжести вниз."],"explain":"Равновесие: равнодействующая всех сил равна нулю.\nДля груза на пружине: k · Δl = m · g.\nДля ящика, который тянут с двух сторон: F слева = F справа.","sandbox":"Добейся равновесия ящика при разных силах."},"phys7.f08-mission":{"title":"Итоговая миссия: силы","hook":"Шесть задач для настоящего инженера.","page":"В миссии встретятся сила тяжести, пружины, трение и сложение сил.\nВ каждой задаче g = 10 Н/кг, если не сказано иное. Подсказки рядом.","predict":{"q":"Космонавт взял гирю на Луне. Что изменилось по сравнению с Землёй?","opts":["Масса гири","Вес гири","И масса, и вес"],"why":"Масса не зависит от планеты. Меняется вес, потому что на Луне g меньше."},"explore":["Перенеси гирю 20 кг на Марс и посмотри на силу тяжести."],"explain":"Шпаргалка.\nF = m · g — сила тяжести.\nF = k · Δl — сила упругости (Δl в метрах).\nF = μ · m · g — сила трения скольжения.\nСилы в одну сторону складываются, в разные — вычитаются.","sandbox":"Свободная лаборатория: тяни ящик по льду и по резине."}}},"en":{"ui":{"langName":"English","appTitle":"School Cool — pilot","hello":"Learn with your hands","pilotIntro":"School Cool pilot: two units, 20 lessons. Every lesson has a book page, a 3D experiment, a rule and practice problems with hints.","pilotNote":"This is a pilot. The lessons, 3D scenes and translations were prepared by AI; teachers and native speakers will spot-check them before children use them.","curriculum":"CURRICULUM","noMap":"Not mapped to this curriculum","sparks":"Sparks for solved problems","language":"Language","theme":"Light or dark theme","scene":"3D scene","steps":"Lesson steps","step":{"page":"Page","predict":"Predict","explore":"Explore","explain":"Understand","tasks":"Practice","sandbox":"Sandbox"},"next":"Next","back":"Back","reset":"Start over","toCatalog":"Next lesson","predictRight":"Correct!","predictCheck":"Let's check","goalTodo":"Do this in the scene","goalDone":"You did it!","summary":"Problems solved: {s} of {n}.","answer":"Answer","whole":"Whole number","numerator":"Numerator","denominator":"Denominator","sceneAnswer":"Answer right in the 3D scene, then press “Check”.","check":"Check","hint":"Hint {n}","hintN":"Hint {n}","noMoreHints":"No more hints","solution":"Worked solution","another":"Another problem","typeAnswer":"Type your answer first.","right":"Right","correct":"Correct!","sparkPlus":"+1 spark","nextTask":"Next problem","notYet":"Not quite yet","wrong":"Check again. A hint can help.","level1":"Beginner","level2":"Intermediate","level3":"Advanced","unitN":"N","unitKg":"kg","unitNkg":"N/kg","unitCm":"cm","unitNm":"N/m","slices":"Slices","clear":"Clear","parts":"Parts","point":"Bead","mass":"Mass","weights":"Weights","pull":"Pull","friction":"Friction","sliding":"sliding","left":"Left","dir_left":"to the left","dir_right":"to the right","balanced":"Forces are balanced","resultant":"Net force","planets":{"earth":"Earth","moon":"the Moon","mars":"Mars","jupiter":"Jupiter"},"surfaces":{"ice":"Ice","wood":"Wood","rubber":"Rubber"}},"curricula":{"ru-fgos":{"name":"Russia · FGOS","grade":"Grade {g}","units":{"math5-fractions":"Common fractions","phys7-forces":"Interaction of bodies"}},"us-ccss":{"name":"USA · Common Core & NGSS","grade":"Grade {g}","units":{"math5-fractions":"Number and Operations — Fractions","phys7-forces":"Forces and Interactions"}},"in-ncert":{"name":"India · NCERT","grade":"Class {g}","units":{"math5-fractions":"Fractions","phys7-forces":"Force and Pressure, Friction"}}},"units":{"math5-fractions":{"title":"Fractions"},"phys7-forces":{"title":"Forces"}},"tasks":{"frac.read":{"prompt":"What part of the pie is shaded? Write it as a fraction.","h1":"Count how many equal slices the pie is cut into. That is the denominator, the number below the line.","h2":"Now count the shaded slices. That is the numerator, the number above the line.","h3":"The pie is cut into {n} slices, and {k} are shaded.","sol":"There are {n} slices in all and {k} are shaded. So [[k/n]] of the pie is shaded.","err":{"flip":"The numerator and denominator have swapped places. On top we write how many slices we took; below, how many slices the whole was cut into.","unshaded":"You counted the unshaded slices. Count the shaded ones."}},"frac.shade":{"prompt":"Shade [[k/n]] of the pie. If you need to, change the number of slices with the buttons under the scene.","h1":"The denominator {n} tells you how many equal slices to cut the pie into.","h2":"The numerator {k} tells you how many slices to shade.","h3":"Make {n} slices and tap {k} of them.","sol":"Cut the pie into {n} equal slices and shade {k}. That is [[k/n]].","err":{"slices":"Check the number of slices: for [[k/n]] the pie is cut into {n} equal parts.","count":"The number of slices is right, but the number shaded is not {k}. Count the shaded slices again."}},"frac.numline":{"prompt":"Which fraction does the bead mark on the line?","h1":"Look at how many equal parts the segment from 0 to 1 is split into. Count the gaps, not the tick marks.","h2":"The segment from 0 to 1 is split into {n} parts. That is the denominator.","h3":"Count how many of those parts there are from 0 to the bead.","sol":"Each part is [[1/n]]. From 0 to the bead there are {k} parts, so it is [[k/n]].","err":{"ticks":"It looks like you counted the tick marks, not the gaps between them. There is one part fewer than tick marks.","flip":"The numerator and denominator have swapped places."}},"frac.place":{"prompt":"Put the bead on [[k/n]]. Drag it with your finger or use the arrows under the scene.","h1":"First make the segment from 0 to 1 split into {n} parts.","h2":"Each part is [[1/n]].","h3":"Count {k} parts from zero.","sol":"Split the segment from 0 to 1 into {n} equal parts and count {k} of them from zero.","err":{"offByOne":"Almost! The bead is on the next mark over. Count the parts from zero again."}},"frac.equiv":{"prompt":"Which number goes in place of the question mark? [[a/b]] = ? / {bm}","h1":"How many times bigger is {bm} than {b}?","h2":"The denominator was multiplied by {m}. To keep the fraction the same, multiply the numerator by the same number.","h3":"{a} × {m} = ?","sol":"{bm} = {b} × {m}, so we multiply the numerator by {m} too: {a} × {m} = {am}. So [[a/b]] = [[am/bm]].","err":{"add":"You added the same amount to the numerator as to the denominator. That changes the fraction. Multiply the numerator and denominator by the same number.","same":"The denominator got bigger, so the slices got smaller. To keep the same amount, the numerator has to get bigger too."}},"frac.simplify":{"prompt":"Simplify [[ag/bg]] as far as it will go.","h1":"Find a number that divides both {ag} and {bg}.","h2":"Try dividing both numbers by {g}.","h3":"{ag} ÷ {g} = ?   {bg} ÷ {g} = ?","sol":"{ag} and {bg} are both divisible by {g}: [[ag/bg]] = [[a/b]]. It can't be simplified any further.","err":{"notLowest":"This fraction is equal to the right one, but it can be simplified more. Find a common factor of the numerator and denominator."}},"frac.compare":{"prompt":"Compare the fractions: [[a/b]] ? [[c/d]]","h1":"If the denominators are the same, the fraction with the bigger numerator is bigger.","h2":"If the numerators are the same, the fraction with the smaller denominator is bigger: its slices are larger.","h3":"If everything is different, rewrite both with the common denominator {l}: you get [[al/l]] and [[cl/l]].","sol":"Rewrite with denominator {l}: [[a/b]] = [[al/l]], [[c/d]] = [[cl/l]]. Compare the numerators {al} and {cl}.","err":{"bigDen":"The numerators are the same and the denominator is bigger, so the slices are smaller. That fraction is smaller, not bigger."}},"frac.addSame":{"prompt":"Add: [[a/n]] + [[b/n]]","h1":"The slices are the same size, [[1/n]] each. Just add up how many slices there are.","h2":"{a} + {b} = ?","h3":"The denominator stays {n}.","sol":"[[a/n]] + [[b/n]] = [[s/n]]: add the numerators, the denominator doesn't change.","err":{"addDen":"Don't add the denominators: the size of a slice doesn't change, only how many slices there are."}},"frac.subSame":{"prompt":"Subtract: [[a/n]] − [[b/n]]","h1":"There were {a} slices of [[1/n]], and {b} were taken away.","h2":"{a} − {b} = ?","h3":"The denominator stays {n}.","sol":"[[a/n]] − [[b/n]] = [[s/n]]: subtract the numerators, the denominator doesn't change.","err":{"subDen":"Don't subtract the denominators: the size of a slice doesn't change."}},"frac.lcd":{"prompt":"Find the least common denominator for fractions with denominators {b} and {d}.","h1":"A common denominator is divisible by both {b} and {d}.","h2":"List the multiples of {b}: {b}, {b*2}, {b*3}… Which one is the first to be divisible by {d}?","h3":"The product {b} × {d} = {p} always works, but sometimes there is a smaller number.","sol":"The smallest number divisible by both {b} and {d} is {l}.","err":{"product":"{p} works, but it isn't the least common denominator. Look for a smaller number.","notLeast":"That is a common denominator, but not the least one. There is a smaller number."}},"frac.addUnlike":{"prompt":"Calculate: [[a/b]] {op} [[c/d]]","h1":"The denominators are different, so first rewrite the fractions with a common denominator.","h2":"The common denominator is {l}: [[a/b]] = [[al/l]], [[c/d]] = [[cl/l]].","h3":"Now {al} {op} {cl} = ?","sol":"[[a/b]] {op} [[c/d]] = [[al/l]] {op} [[cl/l]] = [[s/l]]. In simplest form: [[sn/sd]].","err":{"addDen":"You can't add or subtract the numerators and denominators separately: the slices are different sizes. First find a common denominator.","noScale":"The denominator is common, but the numerators need to be multiplied too: [[a/b]] = [[al/l]], [[c/d]] = [[cl/l]]."}},"frac.toImproper":{"prompt":"Write [[w a/n]] as an improper fraction. What is the numerator? ? / {n}","h1":"One whole has {n} slices of [[1/n]].","h2":"{w} wholes have {w} × {n} = {wn} slices.","h3":"Add {a} more.","sol":"{w} × {n} + {a} = {t}, so [[w a/n]] = [[t/n]].","err":{"wPlusA":"Multiply the whole number by the denominator, don't just add it.","forgotA":"Don't forget to add the fraction part: {a} more slices."}},"frac.toMixed":{"prompt":"Write as a mixed number: [[t/n]]","h1":"How many whole times does {n} go into {t}?","h2":"{t} ÷ {n} = {w}, remainder {a}.","h3":"The whole number is the quotient, the numerator is the remainder, and the denominator stays the same.","sol":"{t} ÷ {n} = {w}, remainder {a}. So [[t/n]] = [[w a/n]].","err":{"swap":"The whole number and the numerator have swapped places. The whole number is how many times the denominator goes into the numerator."}},"frac.ofNumber":{"prompt":"Find [[a/b]] of {N}. You can break off strips of the chocolate bar.","h1":"First find one part: divide {N} by {b}.","h2":"[[1/b]] of {N} is {q}.","h3":"Now take {a} of those parts.","sol":"{N} ÷ {b} = {q}, then {q} × {a} = {ans}.","err":{"divOnly":"That is only [[1/b]]. You need {a} of those parts.","mulOnly":"First divide by the denominator, then multiply by the numerator."}},"frac.toDecimal":{"prompt":"Write as a decimal: [[k/d]]","h1":"The denominator is {d}. How many digits will there be after the decimal point?","h2":"[[1/10]] = 0.1, and [[1/100]] = 0.01.","h3":"Write the numerator {k} so that its last digit lands in the right place.","sol":"[[k/d]] = {x}.","err":{"place":"The digits are right, but they are in the wrong places. Hundredths have two digits after the decimal point, tenths have one."}},"force.gravity":{"prompt":"A crate with a mass of {m} kg is sitting on Earth. How strongly does Earth pull on it? Use g = 10 N/kg.","h1":"Force of gravity: F = m · g.","h2":"m = {m} kg, g = 10 N/kg.","h3":"{m} × 10 = ?","sol":"F = m · g = {m} kg × 10 N/kg = {F} N.","err":{"noG":"That is the mass in kilograms, but we need the force in newtons. Multiply the mass by g."}},"force.gravityGrams":{"prompt":"An object has a mass of {mg} g. Find the force of gravity on it. Use g = 10 N/kg.","h1":"First change grams to kilograms: 1 kg is 1000 g.","h2":"{mg} g = {m} kg.","h3":"F = {m} × 10 = ?","sol":"{mg} g = {m} kg. F = {m} kg × 10 N/kg = {F} N.","err":{"grams":"Change the mass to kilograms first: {mg} g = {m} kg.","noG":"We need a force in newtons: multiply the mass in kilograms by g."}},"force.planet":{"prompt":"A rover with a mass of {m} kg is standing on the surface. Planet: {planet}, g = {g} N/kg. How strongly does it pull on the rover?","h1":"Same formula: F = m · g, only g is different.","h2":"Here g = {g} N/kg, not 10.","h3":"{m} × {g} = ?","sol":"F = {m} kg × {g} N/kg = {F} N.","err":{"earthG":"You used g for Earth. Here g = {g} N/kg."}},"force.massFromWeight":{"prompt":"The force of gravity on an object is {P} N. What is its mass? Use g = 10 N/kg.","h1":"F = m · g, so m = F ÷ g.","h2":"{P} ÷ 10 = ?","h3":"The answer will be in kilograms.","sol":"m = F ÷ g = {P} N ÷ 10 N/kg = {m} kg.","err":{"mult":"Don't multiply, divide: m = F ÷ g."}},"force.hooke":{"prompt":"A spring has a stiffness of {k} N/m. It is stretched by {cm} cm. What elastic force does it produce?","h1":"Hooke's law: F = k · Δl.","h2":"Change centimeters to meters: {cm} cm = {x} m.","h3":"{k} × {x} = ?","sol":"F = k · Δl = {k} N/m × {x} m = {F} N.","err":{"cm":"The stretch has to be in meters: {cm} cm = {x} m."}},"force.stiffness":{"prompt":"A force of {F} N stretched a spring by {cm} cm. Find its stiffness.","h1":"From F = k · Δl we get k = F ÷ Δl.","h2":"Δl = {cm} cm = {x} m.","h3":"{F} ÷ {x} = ?","sol":"k = F ÷ Δl = {F} N ÷ {x} m = {k} N/m.","err":{"cm":"The stretch has to be in meters: {cm} cm = {x} m.","invert":"Divide the force by the stretch, don't multiply."}},"force.springScene":{"prompt":"The spring's stiffness is {k} N/m, and each weight is 1 N. Hang enough weights to stretch the spring by {cm} cm.","h1":"The force needed for that stretch: F = k · Δl.","h2":"Δl = {x} m, so F = {k} × {x}.","h3":"You need a force of {F} N, and each weight gives 1 N.","sol":"F = {k} N/m × {x} m = {F} N. That is {n} weights of 1 N each.","err":{"tooMany":"Too many: the spring stretched too far. Take a weight off.","tooFew":"Not enough yet: the stretch is too small. Add a weight."}},"force.sumSame":{"prompt":"Two children pull a sled in the same direction with forces of {a} N and {b} N. Find the net force.","h1":"The forces point the same way and help each other.","h2":"So add them.","h3":"{a} + {b} = ?","sol":"R = {a} N + {b} N = {R} N, in the same direction.","err":{"diff":"Forces in the same direction add up; you don't subtract them."}},"force.sumOpp":{"prompt":"A crate is pulled to the left with a force of {a} N and to the right with a force of {b} N. Find the net force.","h1":"The forces point in opposite directions and work against each other.","h2":"Subtract the smaller force from the bigger one.","h3":"The crate moves toward the bigger force: {side}.","sol":"R = {R} N (bigger force minus smaller force), and the crate moves {side}.","err":{"sum":"Opposite forces don't add up: subtract the smaller from the bigger."}},"force.tugScene":{"prompt":"The crate is pulled to the left with a force of {a} N. Choose a force on the right so the crate stays put.","h1":"The crate stays still if the forces are balanced.","h2":"Balanced means equal in size and pointing in opposite directions.","h3":"The right side needs the same force as the left.","sol":"The right side needs {a} N; then the net force is zero.","err":{"tooMany":"The force on the right is bigger, so the crate moves right. Make it smaller.","tooFew":"The force on the right is smaller, so the crate moves left. Make it bigger."}},"force.friction":{"prompt":"A crate with a mass of {m} kg is pulled across the floor. The coefficient of friction is μ = {mu}. What sliding friction force acts on the crate? Use g = 10 N/kg.","h1":"Friction force: F = μ · N, where N is how hard the crate presses on the floor.","h2":"On a flat floor N = m · g = {N} N.","h3":"{mu} × {N} = ?","sol":"F = μ · m · g = {mu} × {m} kg × 10 N/kg = {F} N.","err":{"noG":"You multiplied μ by the mass. You need the pressing force: N = m · g.","noMu":"That is the force pressing on the floor. Multiply it by the coefficient of friction μ."}},"force.uniform":{"prompt":"A crate is pulled across the floor at a constant speed. The spring scale reads {F} N. What is the friction force?","h1":"Constant speed means the forces along the floor are balanced.","h2":"Only the pull and friction act along the floor.","h3":"The friction force equals the pull.","sol":"When the motion is steady, friction equals the pull: {F} N.","err":{"zero":"The crate is sliding on the floor, so there is friction. At steady speed it equals the pull."}}},"lessons":{"math5.fr01-parts":{"title":"Parts and fractions","hook":"How do you share a pie fairly among four people?","page":"If you cut a whole into equal parts, each part is called a share.\nA fraction tells how many of those shares we took. Below the line we write how many shares the whole was cut into: that is the denominator. Above the line we write how many shares we took: that is the numerator.","predict":{"q":"A pizza is cut into 8 equal slices and you eat 2. What part of the pizza did you eat?","opts":["[[2/6]]","[[2/8]]","[[8/2]]"],"why":"There are 8 equal slices in all: that is the denominator. You took 2: that is the numerator. So it is [[2/8]]."},"explore":["Tap one slice of the pie to shade it. That is one fourth: [[1/4]].","Shade two more slices. How much is shaded now? That is [[3/4]].","Use the “Slices” buttons under the scene to cut the pie into 8 pieces.","Shade [[5/8]] of the pie."],"explain":"The fraction [[3/4]] is read “three fourths”.\nThe denominator (4) shows how many **equal** parts the whole was split into. The numerator (3) shows how many of those parts we took.\nIf the parts are not equal, you can't call them a fraction.","formula":"[[3/4]]: 3 parts taken out of 4","sandbox":"Cut pies into any number of slices and shade them. Try to find two different fractions that shade the same amount."},"math5.fr02-number-line":{"title":"Fractions on the number line","hook":"Where does [[1/2]] live? Between 0 and 1!","page":"A fraction is a number too. It has its own place on the number line.\nTo find [[3/4]], split the segment from 0 to 1 into 4 equal parts and count three of them from zero.","predict":{"q":"Where on the segment from 0 to 1 is [[1/2]]?","opts":["Closer to 0","Exactly in the middle","Closer to 1"],"why":"A half splits the segment into two equal parts, so [[1/2]] is exactly in the middle."},"explore":["Drag the bead to [[3/4]]. Use your finger or the arrows.","Press “+” next to “Parts” until there are 8. The bead stayed in place, but now it is [[6/8]].","This line goes up to 2. Put the bead on [[4/3]], a fraction greater than one."],"explain":"To mark a fraction, split the segment from 0 to 1 into as many equal parts as the denominator says, and count as many parts from zero as the numerator says.\nIf the numerator is bigger than the denominator, the fraction is greater than one and sits to the right of 1.","sandbox":"Move the bead and change the number of parts. Find two different ways to write the same number on the line."},"math5.fr03-equivalent":{"title":"Equivalent fractions","hook":"Half a pizza or two quarters: which is more?","page":"The same part of a whole can be written as different fractions.\nIf you cut every slice in half, there are twice as many slices, but you also have twice as many slices taken.","predict":{"q":"Which is more: [[1/2]] of a pie or [[2/4]] of a pie?","opts":["[[1/2]] is more","They are the same","[[2/4]] is more"],"why":"Two quarters make exactly one half. It is the same part of the pie."},"explore":["Half of the pie on the left is shaded. On the second pie, shade enough quarters to cover the same amount.","Now [[1/3]]. How many sixths do you need to shade to get the same amount?","[[2/3]] = ? / 9. Shade the right number of ninths on the second pie."],"explain":"If you multiply the numerator and denominator by the same number, the fraction doesn't change.\n[[1/2]] = [[2/4]] = [[3/6]] = [[4/8]]. This is called the basic property of a fraction.","formula":"[[2/3]] = [[4/6]] = [[6/9]]","sandbox":"Cut pies into different numbers of slices and look for equivalent fractions."},"math5.fr04-simplify":{"title":"Simplifying fractions","hook":"[[6/8]] and [[3/4]] are the same. Which one is simpler to write?","page":"The basic property of a fraction also works backwards: you can divide the numerator and denominator by the same number.\nThis is called simplifying. The fraction gets shorter, but the part of the whole stays the same.","predict":{"q":"[[6/8]] of a pie is how many quarters?","opts":["[[2/4]]","[[3/4]]","[[6/4]]"],"why":"Every two eighths make one quarter. Six eighths are three quarters."},"explore":["Lower the number of slices to 4 with the “−” button. The shaded part stays the same: [[6/8]] turns into [[3/4]].","[[4/10]]: simplify it to fifths by making 5 slices."],"explain":"To simplify a fraction, divide the numerator and denominator by a common factor.\n[[6/8]]: both numbers are divisible by 2, so we get [[3/4]]. 3 and 4 have no common factors, so the fraction is in simplest form.","formula":"[[6/8]] = [[3/4]]","sandbox":"Try to simplify [[8/12]] of a pie by lowering the number of slices."},"math5.fr05-compare":{"title":"Comparing fractions","hook":"Which is better: [[1/3]] of a cake or [[1/5]] of a cake?","page":"Comparing fractions is easy when they have the same denominators or the same numerators.\nIf everything is different, first make the slices the same size.","predict":{"q":"Which is bigger: [[1/3]] or [[1/5]]?","opts":["[[1/3]]","They are the same","[[1/5]]"],"why":"The more parts a whole is cut into, the smaller each part is. A third is bigger than a fifth."},"explore":["The denominators are the same: [[2/6]] and [[5/6]]. The fraction with more shaded slices is bigger.","The numerators are the same: [[1/3]] and [[1/5]]. Compare which piece is larger.","[[2/3]] and [[3/4]]. Cut both pies into 12 slices and compare which has more shaded."],"explain":"Same denominators: the fraction with the bigger numerator is bigger.\nSame numerators: the fraction with the smaller denominator is bigger.\nEverything different: rewrite with a common denominator and compare the numerators. [[2/3]] = [[8/12]], [[3/4]] = [[9/12]], so [[3/4]] is bigger.","sandbox":"Make two pies and try to shade them so the fractions are different but the shaded amount is the same."},"math5.fr06-add-same":{"title":"Adding and subtracting with like denominators","hook":"Three eighths plus two eighths is how many eighths?","page":"When the slices are the same size, adding them is easy: count how many slices there are now.\nThe size of a slice doesn't change, so the denominator stays the same.","predict":{"q":"[[3/8]] + [[2/8]] = ?","opts":["[[5/16]]","[[5/8]]","[[6/8]]"],"why":"Add the slices: 3 + 2 = 5 slices of [[1/8]]. The slices didn't get smaller, so the denominator stays 8."},"explore":["The first pie has 3 slices out of 8, the second has 2. How many slices are there together?","Add them on one pie: shade 3 + 2 slices.","Subtraction: there was [[5/6]], and [[3/6]] was eaten. Unshade three slices."],"explain":"To add fractions with the same denominator, add the numerators and keep the denominator.\nSubtraction works the same way: subtract the numerators, the denominator doesn't change.","formula":"[[3/8]] + [[2/8]] = [[5/8]]","sandbox":"Make up your own addition problem and show it with pies."},"math5.fr07-common-denominator":{"title":"Common denominator","hook":"How do you add a half and a third if the pieces are different sizes?","page":"You can only add slices of the same size. So first cut both wholes into the same kind of slices.\nA number of slices that works for both is called a common denominator.","predict":{"q":"How do you add [[1/2]] and [[1/3]]?","opts":["Add the numerators and the denominators: [[2/5]]","Cut both pies into slices of the same size","You can't, they can't be added"],"why":"A half and a third can both be cut into sixths: [[1/2]] = [[3/6]], [[1/3]] = [[2/6]]. Now the slices are the same size."},"explore":["Give both pies the same number of slices without changing the shaded amounts. Try 6.","[[1/4]] and [[1/6]]: 24 slices would work, but there is a smaller number. Find it."],"explain":"A common denominator is divisible by both denominators. The least one is the most convenient.\nHere is how to find it: list the multiples of the bigger denominator until you find one that the smaller one also divides.\nFor 4 and 6: 6, 12, and 12 works.","sandbox":"Pick any two fractions and find a common denominator for them with the pies."},"math5.fr08-add-unlike":{"title":"Adding with unlike denominators","hook":"What is [[1/2]] + [[1/4]]?","page":"First rewrite the fractions with a common denominator, then add the numerators.\nIf the answer can be simplified, simplify it.","predict":{"q":"[[1/2]] + [[1/4]] = ?","opts":["[[2/6]]","[[3/4]]","[[2/4]]"],"why":"A half is two quarters. [[2/4]] + [[1/4]] = [[3/4]]."},"explore":["Cut the first pie into quarters. How many quarters are shaded?","Add them on one pie: [[2/4]] + [[1/4]].","[[2/3]] − [[1/2]]: turn both pies into sixths and compare."],"explain":"1. Find a common denominator.\n2. Multiply the numerator and denominator of each fraction to get that denominator.\n3. Add or subtract the numerators.\n4. Simplify the answer if you can.","formula":"[[2/3]] − [[1/2]] = [[4/6]] − [[3/6]] = [[1/6]]","sandbox":"Check it with pies: does [[2/3]] + [[1/4]] = [[11/12]]?"},"math5.fr09-mixed":{"title":"Mixed numbers","hook":"One and a half pies is how many halves?","page":"If there are more slices than fit in one whole, you get an improper fraction, such as [[7/4]].\nIt can also be written as a whole number and a fraction: [[1 3/4]]. That is a mixed number.","predict":{"q":"How many quarters are in [[1 3/4]]?","opts":["4","7","13"],"why":"One whole has 4 quarters, plus 3 more: 7 in all. [[1 3/4]] = [[7/4]]."},"explore":["One whole pie and [[3/4]] more. That is the mixed number [[1 3/4]], or [[7/4]].","Make [[2 2/3]]: shade the right number of slices on the third pie. How many thirds are there in all?"],"explain":"Mixed number to fraction: multiply the whole number by the denominator and add the numerator.\nFraction to mixed number: divide the numerator by the denominator with a remainder. The quotient is the whole number, and the remainder is the new numerator.","formula":"[[2 2/3]] = [[8/3]]","sandbox":"Build a mixed number from pies and write it as an improper fraction."},"math5.fr10-of-number":{"title":"A fraction of a number","hook":"A chocolate bar has 12 squares. How many squares are in two thirds of it?","page":"To find a fraction of a number, divide the number by the denominator: that gives one part.\nThen multiply by the numerator to take the right number of parts.","predict":{"q":"A chocolate bar has 12 squares. How many squares are in [[2/3]] of the bar?","opts":["6","8","9"],"why":"A third of 12 is 4 squares. Two thirds is 8 squares."},"explore":["The chocolate bar is split into 3 equal strips. Break off [[2/3]]: tap 2 strips.","20 squares, 4 strips. Break off [[3/4]]. How many squares is that?"],"explain":"To find a fraction of a number, first divide the number by the denominator, then multiply by the numerator.\n[[2/3]] of 12: 12 ÷ 3 = 4, 4 × 2 = 8.","formula":"[[2/3]] of 12 = 12 ÷ 3 × 2 = 8","sandbox":"Break off strips and count: what part of the bar do you have, and how many squares is it?"},"math5.fr11-decimals":{"title":"Decimals","hook":"[[3/10]] can be written more briefly!","page":"Fractions with denominators 10, 100 and 1000 are handy to write with a decimal point.\n[[3/10]] = 0.3, three tenths. [[7/100]] = 0.07, seven hundredths.","predict":{"q":"How else can you write [[3/10]]?","opts":["3.10","0.3","0.03"],"why":"Tenths go in the first place after the decimal point: [[3/10]] = 0.3."},"explore":["The segment from 0 to 1 is split into 10 parts. Put the bead on 0.7, which is [[7/10]].","Where is 0.5? Notice that it is also one half."],"explain":"The first digit after the decimal point is tenths, the second is hundredths.\n[[45/100]] = 0.45. [[5/100]] = 0.05: the zero in the tenths place is required.","formula":"[[7/10]] = 0.7   [[7/100]] = 0.07","sandbox":"Move the bead and watch the decimal change."},"math5.fr12-mission":{"title":"Final mission: fractions","hook":"Six problems on everything you learned about fractions.","page":"This mission has problems from different lessons: read a fraction, find it on the number line, simplify, compare, add, and find a fraction of a number.\nIf you forget something, the hints will help.","predict":{"q":"Which fraction is greater than one?","opts":["[[7/8]]","[[8/8]]","[[9/8]]"],"why":"[[8/8]] is exactly one whole pie. [[9/8]] is a whole pie and one more eighth."},"explore":["Warm-up: shade [[9/8]] using two pies."],"explain":"Cheat sheet.\nThe numerator is how many parts we took; the denominator is how many parts the whole was split into.\nYou can multiply or divide the numerator and denominator by the same number: the fraction doesn't change.\nYou can only add slices of the same size.","sandbox":"Free play with pies: make up a problem for a friend."},"phys7.f01-force":{"title":"What is a force","hook":"Why does a crate move when you pull it, but stay put when it is pulled from both sides?","page":"A force is the action of one object on another. A force can move an object, stop it, or change its shape.\nForce is measured in newtons (N). In pictures a force is drawn as an arrow: the arrow points where the force acts, and its length shows how big the force is.","predict":{"q":"Two people pull a crate in opposite directions with the same force. What happens?","opts":["It moves left","It stays put","It moves right"],"why":"Equal forces in opposite directions balance each other. The crate stays put."},"explore":["The crate is pulled with 20 N on the left and on the right. The arrows are the same length, and the crate stays put.","Raise the force on the right to 40 N. Which way did the crate go?","Now balance the crate: make the force on the left the same."],"explain":"A force has a size and a direction.\nThe unit of force is the newton (N). Earth pulls on an apple with a mass of 100 g with a force of about 1 N.","sandbox":"Change the forces on the left and right and watch which way the crate moves."},"phys7.f02-gravity":{"title":"Gravity","hook":"Why does everything fall down, and why is it easier to jump on the Moon?","page":"Earth pulls every object toward itself. This force is called the force of gravity.\nThe greater an object's mass, the harder Earth pulls on it. On other planets the pull is different.","predict":{"q":"Which crate does Earth pull on harder?","opts":["The 1 kg crate","The same","The 10 kg crate"],"why":"Gravity is proportional to mass: 10 kg is pulled 10 times harder than 1 kg."},"explore":["Raise the crate's mass to 10 kg. Look at the arrow and the number.","Move the crate to the Moon. The mass is the same, but what about the force?","And now to Jupiter."],"explain":"Force of gravity: F = m · g.\nm is the mass in kilograms; g is how many newtons act on each kilogram. On Earth g ≈ 9.8 N/kg, and in problems we use 10 N/kg.\nOn the Moon g ≈ 1.6 N/kg, so everything there is about 6 times easier to lift.","formula":"F = m · g","sandbox":"Choose a mass and a planet. Where would it be easiest for you to jump?"},"phys7.f03-spring":{"title":"Elastic force","hook":"How does a spring know what weight is hanging on it?","page":"If you stretch or squeeze a spring, an elastic force appears in it. It tries to bring the spring back to its original shape.\nThe more a spring is stretched, the bigger the elastic force. This is how a spring scale, a tool for measuring force, works.","predict":{"q":"With one weight the spring stretched by 2 cm. How much will it stretch with three of the same weights?","opts":["3 cm","6 cm","9 cm"],"why":"The stretch is proportional to the force: three times the weight gives three times the stretch, 6 cm."},"explore":["Hang one 100 g weight; gravity pulls on it with 1 N. Tap the stack of weights on the table.","Add two more weights. How many times bigger is the stretch now?","Take a stiffer spring: 100 N/m. What happened to the stretch?"],"explain":"Hooke's law: the elastic force is proportional to the stretch.\nF = k · Δl, where Δl is the stretch in meters and k is the spring's stiffness in N/m.\nA stiff spring stretches less under the same force.","formula":"F = k · Δl","sandbox":"Hang weights and change springs. Make your own spring scale: remember how many centimeters 1 N gives."},"phys7.f04-weight":{"title":"Weight","hook":"Are mass and weight the same thing?","page":"Weight is the force with which an object presses on a support or stretches what it hangs from. Weight is measured in newtons, and mass in kilograms.\nIf the object and the support are not moving, the weight equals the force of gravity: P = m · g.","predict":{"q":"An apple has a mass of 200 g. What is its weight on Earth?","opts":["200 N","2 N","0.2 N"],"why":"200 g = 0.2 kg. P = 0.2 kg × 10 N/kg = 2 N."},"explore":["Put 1 kg on the support. Weight is the force with which the crate presses on the support.","Move the crate to the Moon. The mass is the same, but the weight is about 6 times smaller."],"explain":"Mass shows how much matter is in an object and doesn't depend on the planet.\nWeight is a force, and it depends on g: P = m · g.\nOn the Moon your mass is the same, but your weight is 6 times smaller.","formula":"P = m · g","sandbox":"Compare the weight of the same crate on different planets."},"phys7.f05-friction":{"title":"Friction","hook":"Why is a heavy wardrobe so hard to move?","page":"When one object slides over another, a friction force appears. It points against the motion.\nFriction depends on the surfaces and on how hard the object is pressed against its support.","predict":{"q":"Someone pulls a crate, but it doesn't move. Why?","opts":["The pull is bigger than friction","Friction balances the pull","No forces act on the crate"],"why":"While the crate stays put, static friction equals the pull and balances it."},"explore":["Pull the blue ring of the spring scale or press “+”. At what force does the crate start to move?","Put the crate on ice. How much force do you need to move it now?","Raise the mass to 10 kg. How did friction change?"],"explain":"Sliding friction: F = μ · N.\nN is the force with which the object presses on the support. On a flat floor N = m · g.\nμ is the coefficient of friction: small for ice, large for rubber.","formula":"F = μ · m · g","sandbox":"Try every surface and different masses. Where is friction smallest?"},"phys7.f06-sum":{"title":"Adding forces","hook":"If two people pull, is it twice as strong?","page":"If several forces act on an object, they can be replaced by one force: the net force.\nForces in the same direction add up. Forces in opposite directions subtract, and the net force points toward the bigger one.","predict":{"q":"Two people pull a crate to the right: one with 30 N, the other with 20 N. How strongly do they pull together?","opts":["10 N","50 N","600 N"],"why":"The forces point the same way, so they add up: 30 + 20 = 50 N."},"explore":["Right now the crate is pulled to the right with 30 N. Add another 20 N on the right.","30 N on the left, 50 N on the right. The net force is 20 N to the right: bigger minus smaller.","Raise the force on the left to 50 N. What happened to the net force?"],"explain":"Forces along one line:\nsame direction: R = F₁ + F₂;\nopposite directions: R = bigger − smaller, pointing toward the bigger one.\nIf R = 0, the object behaves as if there were no forces.","sandbox":"Choose forces so that the net force is 10 N to the left."},"phys7.f07-balance":{"title":"Equilibrium","hook":"Why doesn't a hanging lamp fall?","page":"An object is in equilibrium if all the forces on it are balanced. Then the net force is zero.\nAn object at rest stays at rest, and a moving object keeps moving at a steady speed.","predict":{"q":"A crate is standing still. That means…","opts":["No forces act on it","Balanced forces act on it","Only gravity acts on it"],"why":"Gravity always acts on the crate. It stays still because the support balances gravity."},"explore":["60 N on the left, 20 N on the right. Balance the crate by adding force on the right.","A weight hangs still on a spring: the elastic force up equals gravity down."],"explain":"Equilibrium: the net force of all forces is zero.\nFor a weight on a spring: k · Δl = m · g.\nFor a crate pulled from both sides: F on the left = F on the right.","sandbox":"Balance the crate with different forces."},"phys7.f08-mission":{"title":"Final mission: forces","hook":"Six problems for a real engineer.","page":"In this mission you will meet gravity, springs, friction and adding forces.\nIn every problem g = 10 N/kg unless it says otherwise. Hints are close by.","predict":{"q":"An astronaut picks up a weight on the Moon. What is different compared with Earth?","opts":["The mass of the weight","The weight of the weight","Both the mass and the weight"],"why":"Mass doesn't depend on the planet. The weight changes, because g is smaller on the Moon."},"explore":["Move a 20 kg weight to Mars and look at the force of gravity."],"explain":"Cheat sheet.\nF = m · g: gravity.\nF = k · Δl: elastic force (Δl in meters).\nF = μ · m · g: sliding friction.\nForces in the same direction add up; in opposite directions they subtract.","sandbox":"Free lab: pull the crate across ice and across rubber."}}},"es":{"ui":{"langName":"Español","appTitle":"School Cool — piloto","hello":"Aprende con las manos","pilotIntro":"Piloto de School Cool: dos unidades, 20 lecciones. Cada lección tiene una página de libro, un experimento en 3D, una regla y ejercicios con pistas.","pilotNote":"Esta es una versión piloto. Las lecciones, las escenas 3D y las traducciones las preparó una IA; antes de mostrarlas a los niños, docentes y hablantes nativos revisarán una muestra.","curriculum":"PROGRAMA","noMap":"Sin correspondencia con este programa","sparks":"Chispas por ejercicios resueltos","language":"Idioma","theme":"Tema claro u oscuro","scene":"Escena 3D","steps":"Pasos de la lección","step":{"page":"Página","predict":"Predice","explore":"Explora","explain":"Comprende","tasks":"Ejercicios","sandbox":"Arenero"},"next":"Siguiente","back":"Atrás","reset":"Empezar de nuevo","toCatalog":"Siguiente lección","predictRight":"¡Correcto!","predictCheck":"Vamos a comprobarlo","goalTodo":"Hazlo en la escena","goalDone":"¡Lo lograste!","summary":"Ejercicios resueltos: {s} de {n}.","answer":"Respuesta","whole":"Parte entera","numerator":"Numerador","denominator":"Denominador","sceneAnswer":"Responde directamente en la escena 3D y luego pulsa «Comprobar».","check":"Comprobar","hint":"Pista {n}","hintN":"Pista {n}","noMoreHints":"No hay más pistas","solution":"Solución explicada","another":"Otro ejercicio","typeAnswer":"Primero escribe tu respuesta.","right":"Derecha","correct":"¡Correcto!","sparkPlus":"+1 chispa","nextTask":"Siguiente ejercicio","notYet":"Todavía no","wrong":"Revísalo otra vez. Una pista te puede ayudar.","level1":"Inicial","level2":"Intermedio","level3":"Avanzado","unitN":"N","unitKg":"kg","unitNkg"
