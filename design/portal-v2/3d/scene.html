const r=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});

const TM=new URLSearchParams(location.search).get('tm')||'lin'; r.toneMapping=TM=='aces'?THREE.ACESFilmicToneMapping:THREE.LinearToneMapping; r.toneMappingExposure=TM=='aces'?1.05:.82; r.outputColorSpace=THREE.SRGBColorSpace;

const pm=new THREE.PMREMGenerator(r); const envTex=pm.fromScene(new RoomEnvironment(r),.04).texture;

window.render=(name, opt={})=>{
  const sc=new THREE.Scene(); sc.environment=envTex;
  const obj=B[name](); sc.add(obj);
  obj.updateMatrixWorld(true);
  const box=new THREE.Box3().setFromObject(obj); const ctr=box.getCenter(new THREE.Vector3()); const sph_=box.getBoundingSphere(new THREE.Sphere());
  const cam=new THREE.PerspectiveCamera(opt.fov||28,1,.1,100);
  const elev=(opt.elev??22)*D, az=(opt.az??0)*D; const dir=new THREE.Vector3(Math.sin(az)*Math.cos(elev),Math.sin(elev),Math.cos(az)*Math.cos(elev));
  const dist=sph_.radius/Math.sin((cam.fov/2)*D)*(opt.pad||1.02);
  cam.position.copy(ctr).addScaledVector(dir,dist); cam.lookAt(ctr);
  const key=new THREE.DirectionalLight(0xFFF7EE,1.7); key.position.copy(ctr).add(new THREE.Vector3(-3,7,4).multiplyScalar(sph_.radius)); key.target.position.copy(ctr);
  key.castShadow=true; key.shadow.mapSize.set(2048,2048); key.shadow.radius=14; key.shadow.blurSamples=24; key.shadow.bias=-.0004;

  if(!obj.userData.noFloor){const fl=new THREE.Mesh(new THREE.PlaneGeometry(sph_.radius*8,sph_.radius*8),new THREE.ShadowMaterial({opacity:opt.shadow||.16}));fl.rotation.x=-Math.PI/2;fl.position.y=box.min.y+.001;fl.receiveShadow=true;sc.add(fl);}
  r.render(sc,cam);
  return r.domElement.toDataURL('image/png');
};
